ng program can get to is alive;"," * the rest is a deletion candidate."," *"," * The result is only as trustworthy as the entrypoint set, so a run that resolves"," * no entrypoints reports that rather than declaring the whole repo dead."," */","export function findDeadCode(graph: CodeGraph, config: Config, coverage?: Coverage): DeadResult {","  const entryFiles = [...graph.files.keys()].filter((f) =\u003e matchesAny(f, config.entrypoints));","  const apiFiles = [...graph.files.keys()].filter((f) =\u003e matchesAny(f, config.publicApi));","  graph.entrypoints = entryFiles;","","  const roots = new Set\u003cstring\u003e();","  // Every satellite file is a root: an MDX page or a single-file component is","  // rendered by its framework, so whatever it imports is live.","  for (const edge of graph.edges) {","    if (edge.from.endsWith('#\u003csatellite\u003e')) roots.add(edge.from);","  }","  for (const symbol of graph.symbols.values()) {","    // An ambient declaration merges into a type declared elsewhere. Nothing","    // names it, it cannot be deleted, and reporting it is always wrong.","    if (symbol.ambient) roots.add(symbol.id);","    // Everything in an entrypoint file is reachable: module-level code runs.","    else if (entryFiles.includes(symbol.file)) roots.add(symbol.id);","    // A published export is the package's contract; absent callers are the point.","    else if (apiFiles.includes(symbol.file) \u0026\u0026 symbol.exported) roots.add(symbol.id);","  }","","  for (const id of graph.roots ?? []) roots.add(id);","","  // What a framework calls by itself: a decorated controller, a lifecycle hook.","  const pluginRoots = new Map\u003cstring, number\u003e();","  for (const symbol of graph.symbols.values()) {","    const plugin = rootingPlugin(symbol, config.plugins ?? []);","    if (!plugin) continue;","    roots.add(symbol.id);","    // The framework imported the file to find it, so the file's top level ran.","    roots.add(`${symbol.file}#\u003cmodule\u003e`);","    pluginRoots.set(plugin.name, (pluginRoots.get(plugin.name) ?? 0) + 1);","  }","","  // A module nothing imports, which nevertheless runs code when loaded, is a","  // script: something executes it even though no file names it. Treating it as","  // an entrypoint is what stops every helper in a build script, a migration or","  // a benchmark being reported as dead.","  const imported = new Set(","    graph.edges.filter((e) =\u003e e.kind === 'imports').map((e) =\u003e e.to),","  );","  for (const symbol of graph.symbols.values()) {","    if (symbol.kind === 'module' \u0026\u0026 symbol.sideEffects \u0026\u0026 !imported.has(symbol.id)) {","      roots.add(symbol.id);","      for (const other of graph.symbols.values()) {","        // Everything the script declares is in scope while it runs.","        if (other.file === symbol.file) roots.add(other.id);","      }","    }","  }","","  const outgoing = new Map\u003cstring, string[]\u003e();","  for (const edge of graph.edges) {","    const list = outgoing.get(edge.from);","    if (list) list.push(edge.to);","    else outgoing.set(edge.from, [edge.to]);","  }","","  const walk = (seeds: Iterable\u003cstring\u003e): Set\u003cstring\u003e =\u003e {","    const seen = new Set\u003cstring\u003e(seeds);","    const queue = [...seen];","    while (queue.length \u003e 0) {","      const current = queue.pop()!;","      for (const next of outgoing.get(current) ?? []) {","        if (!seen.has(next)) {","          seen.add(next);","          queue.push(next);","        }","      }","    }","    return seen;","  };","","  // A class published as part of the API brings its public members with it.","  // `HTTPError.statusCode` has no caller inside the library precisely because","  // it exists for consumers, and the publicApi rule already says those exports","  // are the contract — it simply had not reached inside a class before.","  const apiRoots = new Set\u003cstring\u003e();","  for (const symbol of graph.symbols.values()) {","    if (apiFiles.includes(symbol.file) \u0026\u0026 symbol.exported) apiRoots.add(symbol.id);","  }","  for (const id of walk(apiRoots)) {","    const owner = graph.symbols.get(id);","    if (!owner || owner.kind !== 'class') continue;","    for (const member of graph.symbols.values()) {","      if (member.kind !== 'method' || !member.id.startsWith(`${owner.file}#${owner.name}.`)) continue;","      // Private members are not a contract with anybody, and neither is a","      // member its language leaves internal: Swift's default, Go's lower case.","      if (member.name.startsWith('#') || member.name.startsWith('_') || !member.exported) continue;","      roots.add(member.id);","    }","  }","","  /*","   * Anything a test run executed is alive, however it was reached.","   *","   * This is the only honest answer to dynamic dispatch: a container resolving","   * a name from a string leaves no trace in the source, and it leaves a very","   * clear one in a coverage report.","   */","  if (coverage) {","    for (const symbol of graph.symbols.values()) {","      const lines = coverage.executed.get(symbol.file);","      if (!lines) continue;","      for (let line = symbol.line; line \u003c= symbol.endLine; line++) {","        if (lines.has(line)) {","          roots.add(symbol.id);","          break;","        }","      }","    }","  }","","  const reachable = walk(roots);","","  const noEntrypoints = entryFiles.length === 0 \u0026\u0026 apiFiles.length === 0;","  if (noEntrypoints) {","    return { findings: [], reachable, deadLoc: 0, noEntrypoints: true, pluginRoots };","  }","","  const dynamicNames = collectDynamicNames(graph);","  const dataNames = collectDataNames(config);","  const findings: Finding[] = [];","  let deadLoc = 0;","","  // A file with nothing reachable in it is one decision — delete the file —","  // not one row per symbol. zod's top twenty findings were two orphaned files","  // between them, which pushed every independent finding out of view.","  //","  // Unless something may load one of them by name: then it is a question per","  // symbol, and rolling it up would state it as a verdict.","  // A member of a class a config file names goes wherever its class goes.","  // Not so for a class named in a string literal: `typeName: \"ZodString\"` is","  // everywhere, and says nothing about who calls ZodString's members.","  const nameIsData = (s: CodeSymbol): boolean =\u003e","    dynamicNames.has(s.name) || s.id.split('#')[1].split('.').some((name) =\u003e dataNames.has(name));","  // What only a maybe-loaded symbol reaches is as uncertain as it is: a base","  // class used only by a class that Info.plist names is not dead either.","  const doubtful = coverage","    ? new Set\u003cstring\u003e()","    : walk([...graph.symbols.values()].filter((s) =\u003e !reachable.has(s.id) \u0026\u0026 nameIsData(s)).map((s) =\u003e s.id));","  const uncertain = (s: CodeSymbol): boolean =\u003e nameIsData(s) || doubtful.has(s.id);","  const orphanFiles = findOrphanFiles(graph, reachable, coverage ? () =\u003e false : uncertain);","","  for (const file of orphanFiles) {","    const symbols = [...graph.symbols.values()].filter(","      (s) =\u003e s.file === file \u0026\u0026 s.kind !== 'module',","    );","    const loc = graph.files.get(file)?.loc ?? symbols.reduce((sum, s) =\u003e sum + s.loc, 0);","    deadLoc += loc;","    findings.push({","      id: `orphan-file:${file}`,","      kind: 'orphan-file',","      severity: 'high',","      title: `Nothing in ${file} is reachable`,","      action: `Delete ${file}. Nothing imports it and nothing in it is reached.`,","      detail:","        `All ${symbols.length} symbol${symbols.length === 1 ? '' : 's'} in this file are unreachable, ` +","        'and no file imports it. Deleting the file is one decision rather than one per symbol.',","      file,","      line: 1,","      symbols: symbols.map((s) =\u003e s.id),","      loc,","      score: 0.9,","      evidence: {","        symbols: symbols.map((s) =\u003e ({ name: s.name, line: s.line, kind: s.kind, loc: s.loc })),","      },","    });","  }","","  for (const symbol of graph.symbols.values()) {","    if (reachable.has(symbol.id)) continue;","    if (symbol.kind === 'module') continue;","    if (orphanFiles.has(symbol.file)) continue; // Reported as one file above.","","    // A file the coverage report mentions was watched while the tests ran, so","    // \"never reached\" stops being a guess about dynamic dispatch and becomes an","    // observation. The usual hedges no longer apply.","    const covered = !!coverage \u0026\u0026 coverage.executed.has(symbol.file);","    const dataFile = symbol.id.split('#')[1].split('.').map((n) =\u003e dataNames.get(n)).find(Boolean);","    // Its name is written down somewhere as data: something may look it up by","    // that name. That is a question for a human, not a verdict, and it is","    // reported as one rather than as a lower-confidence \"dead\".","    const unknown = !covered \u0026\u0026 uncertain(symbol);","    const score = covered ? 0.97 : unknown ? Math.min(0.45, confidence(symbol, dynamicNames)) : confidence(symbol, dynamicNames);","    // Same rule as duplicates: the headline number, and therefore the CI budget,","    // only counts what we would stand behind.","    if (score \u003e= METRIC_CONFIDENCE_FLOOR) deadLoc += symbol.loc;","    findings.push({","      id: `dead:${symbol.id}`,","      kind: 'dead',","      severity: symbol.loc \u003e= 40 ? 'high' : symbol.loc \u003e= 10 ? 'medium' : 'low',","      title: !unknown","        ? `${symbol.name} is never reached`","        : nameIsData(symbol)","          ? `${symbol.name} may be loaded by name`","          : `${symbol.name} is only reached from code that may be loaded by name`,","      detail:","        buildDetail(symbol, dynamicNames, dataFile) +","        (covered","          ? ' A coverage report was supplied and no test executed it, so it is not reached dynamically either.'","          : ''),","      action: unknown","        ? `Check whether ${symbol.name} is looked up by name. If it is, add a plugin rule in .instantiate.yml so it counts as used; if not, delete it.`","        : symbol.exported","          ? `Delete ${symbol.name}, unless something outside this codebase imports it — check before removing an export.`","          : `Delete ${symbol.name}. Nothing inside this codebase can reach it.`,","      file: symbol.file,","      line: symbol.line,","      symbols: [symbol.id],","      loc: symbol.loc,","      score,","      evidence: {","        kind: symbol.kind,","        exported: symbol.exported,","        verdict: unknown ? 'unknown' : 'dead',","        nameAppearsInString: dynamicNames.has(symbol.name),","        ...(dataFile ? { nameAppearsIn: dataFile } : {}),","      },","    });","  }","","  // Biggest and most certain first: that is the order a human should delete in.","  findings.sort((a, b) =\u003e b.score * b.loc - a.score * a.loc);","  return { findings, reachable, deadLoc, noEntrypoints: false, pluginRoots };","}","","/**"," * Files where nothing at all is reachable and nothing imports the file."," *"," * Both conditions matter: a file whose exports are all unused but which is"," * imported for its side effects is not an orphan, and a file nobody imports"," * but whose symbols are reached some other way is not one either."," */","function findOrphanFiles(","  graph: CodeGraph,","  reachable: Set\u003cstring\u003e,","  uncertain: (symbol: CodeSymbol) =\u003e boolean,","): Set\u003cstring\u003e {","  const importedFiles = new Set(","    graph.edges","      .filter((e) =\u003e e.kind === 'imports')","      .map((e) =\u003e e.to.split('#')[0]),","  );","","  const orphans = new Set\u003cstring\u003e();","  for (const file of graph.files.keys()) {","    if (importedFiles.has(file)) continue;","    const symbols = [...graph.symbols.values()].filter(","      (s) =\u003e s.file === file \u0026\u0026 s.kind !== 'module',","    );","    // A file with one symbol is clearer reported as that symbol.","    if (symbols.length \u003c 2) continue;","    if (symbols.every((s) =\u003e !reachable.has(s.id)) \u0026\u0026 !symbols.some(uncertain)) orphans.add(file);","  }","  return orphans;","}","","/**"," * Names that appear inside string literals anywhere in the codebase. A static"," * graph cannot see `container.resolve('UserService')`, so any symbol whose name"," * shows up as a string is downgraded rather than reported as confidently dead."," */","function collectDynamicNames(graph: CodeGraph): Set\u003cstring\u003e {","  const names = new Set\u003cstring\u003e();","  const stringLiteral = /['\"`]([A-Za-z_$][\\w$]*)['\"`]/g;","  for (const symbol of graph.symbols.values()) {","    let match: RegExpExecArray | null;","    stringLiteral.lastIndex = 0;","    while ((match = stringLiteral.exec(symbol.body)) !== null) names.add(match[1]);","  }","  return names;","}","","/** Data formats a framework or container reads names from. */","const DATA_FILES = ['**/*.{json,yml,yaml,toml,ini,cfg,xml,properties,plist,storyboard,xib}'];","const NOT_DATA = /(^|\\/)(package-lock\\.json|pnpm-lock\\.yaml|yarn\\.lock|composer\\.lock|tsconfig[^/]*\\.json|coverage-final\\.json)$/;","","/**"," * Identifiers written in configuration and data files, with the first file"," * each was seen in."," *"," * A DI container, a plugin loader or a job scheduler usually names what it"," * loads in a YAML or JSON file, which the source never mentions. Only names"," * that look like code — a capital or an underscore somewhere after the start,"," * four characters or more — count, so `name` and `version` do not hedge every"," * symbol that shares a common word."," */","function collectDataNames(config: Config): Map\u003cstring, string\u003e {","  const names = new Map\u003cstring, string\u003e();","  for (const absolute of discoverFiles(config, DATA_FILES)) {","    const file = relPath(config.root, absolute);","    if (NOT_DATA.test(file)) continue;","    try {","      if (statSync(absolute).size \u003e 256 * 1024) continue;","      const text = readFileSync(absolute, 'utf8');","      for (const [word] of text.matchAll(/[A-Za-z_$][\\w$]{3,}/g)) {","        if (!/.[A-Z_]/.test(word) || names.has(word)) continue;","        names.set(word, file);","      }","    } catch {","      // Unreadable: nothing to learn from it.","    }","  }","  return names;","}","","function confidence(symbol: CodeSymbol, dynamicNames: Set\u003cstring\u003e): number {","  let score = 0.95;","  // An export may have a consumer this repo cannot see.","  if (symbol.exported) score -= 0.25;","  // A name that also appears as a string may be reached by dynamic lookup.","  if (dynamicNames.has(symbol.name)) score -= 0.35;","  // Types vanish at runtime, so an unused one is real but cheap; rank it below code.","  if (symbol.kind === 'interface' || symbol.kind === 'type') score -= 0.1;","  // One-liners are often re-exports or constants kept deliberately.","  if (symbol.loc \u003c= 2) score -= 0.1;","  return Math.max(0.05, Math.round(score * 100) / 100);","}","","function buildDetail(symbol: CodeSymbol, dynamicNames: Set\u003cstring\u003e, dataFile?: string): string {","  const parts = [`No path reaches this ${symbol.kind} from any entrypoint.`];","  if (symbol.exported) {","    parts.push('It is exported, so a consumer outside this repo may still use it.');","  }","  if (dynamicNames.has(symbol.name)) {","    parts.push(`The name \"${symbol.name}\" also appears in a string literal, so it may be reached dynamically.`);","  }","  if (dataFile) {","    parts.push(`The name \"${symbol.name}\" appears in ${dataFile}, so something may load it by name.`);","  }","  return parts.join(' ');","}",""]},{"path":"src/analysis/drift.ts","loc":209,"findings":[],"symbols":[{"id":"src/analysis/drift.ts#Dialect","name":"Dialect","kind":"interface","line":11,"loc":4,"exported":false,"usedBy":[{"file":"src/analysis/drift.ts","line":19,"name":"Category"},{"file":"src/analysis/drift.ts","line":131,"name":"findDrift"}],"usedByCount":2,"reaches":[],"reachesCount":0,"findings":[]},{"id":"src/analysis/drift.ts#Category","name":"Category","kind":"interface","line":16,"loc":9,"exported":false,"usedBy":[{"file":"src/analysis/drift.ts","line":26,"name":"CATEGORIES"},{"file":"src/analysis/drift.ts","line":129,"name":"findDrift"}],"usedByCount":2,"reaches":[{"file":"src/analysis/drift.ts","line":11,"name":"Dialect"}],"reachesCount":1,"findings":[]},{"id":"src/analysis/drift.ts#CATEGORIES","name":"CATEGORIES","kind":"variable","line":26,"loc":75,"exported":false,"usedBy":[{"file":"src/analysis/drift.ts","line":125,"name":"findDrift"}],"usedByCount":1,"reaches":[{"file":"src/analysis/drift.ts","line":16,"name":"Category"}],"reachesCount":1,"findings":[]},{"id":"src/analysis/drift.ts#DriftResult","name":"DriftResult","kind":"interface","line":102,"loc":4,"exported":true,"usedBy":[{"file":"src/analysis/drift.ts","line":122,"name":"findDrift"},{"file":"src/api.ts","line":101,"name":"scan"}],"usedByCount":2,"reaches":[{"file":"src/types.ts","line":111,"name":"Finding"}],"reachesCount":1,"findings":[]},{"id":"src/analysis/drift.ts#NON_PRODUCTION","name":"NON_PRODUCTION","kind":"variable","line":115,"loc":2,"exported":false,"usedBy":[{"file":"src/analysis/drift.ts","line":119,"name":"isProductionCode"}],"usedByCount":1,"reaches":[],"reachesCount":0,"findings":[]},{"id":"src/analysis/drift.ts#isProductionCode","name":"isProductionCode","kind":"function","line":118,"loc":3,"exported":false,"usedBy":[{"file":"src/analysis/drift.ts","line":128,"name":"findDrift"}],"usedByCount":1,"reaches":[{"file":"src/analysis/drift.ts","line":115,"name":"NON_PRODUCTION"}],"reachesCount":1,"findings":[]},{"id":"src/analysis/drift.ts#findDrift","name":"findDrift","kind":"function","line":122,"loc":79,"exported":true,"usedBy":[{"file":"src/api.ts","line":54,"name":"scan"}],"usedByCount":1,"reaches":[{"file":"src/types.ts","line":69,"name":"CodeGraph"},{"file":"src/analysis/drift.ts","line":102,"name":"DriftResult"},{"file":"src/types.ts","line":111,"name":"Finding"},{"file":"src/analysis/drift.ts","line":26,"name":"CATEGORIES"},{"file":"src/types.ts","line":13,"name":"CodeSymbol"},{"file":"src/analysis/drift.ts","line":118,"name":"isProductionCode"},{"file":"src/analysis/drift.ts","line":16,"name":"Category"},{"file":"src/analysis/drift.ts","line":11,"name":"Dialect"},{"file":"src/analysis/drift.ts","line":203,"name":"percent"}],"reachesCount":9,"findings":[]},{"id":"src/analysis/drift.ts#percent","name":"percent","kind":"function","line":203,"loc":6,"exported":false,"usedBy":[{"file":"src/analysis/drift.ts","line":161,"name":"findDrift"}],"usedByCount":1,"reaches":[],"reachesCount":0,"findings":[]}],"usedBy":[{"path":"src/api.ts","count":4},{"path":"test/dupe-shapes.test.ts","count":1}],"uses":[{"path":"src/types.ts","count":8}],"marks":[],"source":["import type { CodeGraph, CodeSymbol, Finding } from '../types.js';","","/**"," * Convention drift: one job, several dialects."," *"," * When each session guesses how this codebase handles errors, four dialects"," * appear and no single file looks wrong. Drift is invisible locally and obvious"," * in aggregate, which is exactly what a whole-codebase view is for."," */","","interface Dialect {","  name: string;","  test: RegExp;","}","","interface Category {","  key: string;","  label: string;","  dialects: Dialect[];","  /** Below this many uses the category has no established convention to drift from. */","  minUses: number;","  /** Files where a dialect is mandated by a framework rather than chosen. */","  exempt?: RegExp;","}","","const CATEGORIES: Category[] = [","  // Raising a failure and absorbing one are different jobs, so they are","  // different categories. Compared as one, `throw new UserError` at a boundary","  // and `catch {}` around an optional file looked like a codebase that could","  // not decide, when each was the only right answer where it stood.","  {","    key: 'errors',","    label: 'reporting failure',","    minUses: 6,","    dialects: [","      { name: 'throw Error', test: /\\bthrow\\s+new\\s+\\w*Error\\b/ },","      { name: 'result object', test: /\\breturn\\s*\\{\\s*(ok|success)\\s*:/ },","    ],","  },","  {","    key: 'caught',","    label: 'handling a caught error',","    minUses: 6,","    dialects: [","      // `catch {}` and `catch { return null }` are the same decision — carry","      // on without it — differing only in whether the function returns.","      { name: 'swallow', test: /\\bcatch\\s*(\\([^)]*\\))?\\s*\\{\\s*(return\\s+(null|undefined)\\s*;?\\s*)?\\}/ },","      { name: 'console then rethrow', test: /\\bcatch[\\s\\S]{0,80}console\\.(error|warn)[\\s\\S]{0,60}\\bthrow\\b/ },","    ],","  },","  {","    key: 'async',","    label: 'asynchrony',","    minUses: 6,","    dialects: [","      { name: 'async/await', test: /\\bawait\\s+/ },","      { name: 'promise chain', test: /\\.then\\s*\\(/ },","      { name: 'node callback', test: /function\\s*\\([^)]*\\berr(or)?\\b\\s*,/ },","    ],","  },","  {","    key: 'logging',","    label: 'logging',","    minUses: 5,","    dialects: [","      { name: 'console', test: /\\bconsole\\.(log|info|warn|error|debug)\\s*\\(/ },","      { name: 'logger object', test: /\\b(logger|log)\\.(info|warn|error|debug|trace)\\s*\\(/ },","      // A write that starts with `\\r` redraws a progress line in place, which","      // console cannot do because it always ends the line. That is a","      // different job, not a rival way of logging.","      { name: 'process.stdout', test: /\\bprocess\\.(stdout|stderr)\\.write\\s*\\(\\s*(?![`'\"]\\\\r)/ },","    ],","  },","  {","    key: 'exports',","    label: 'module exports',","    minUses: 8,","    // Next.js, Nuxt and friends *require* a default export from route files.","    // Reading a framework's mandated shape as an inconsistency is a false","    // positive that makes the whole category look untrustworthy.","    exempt: /(^|\\/)(app|pages|src\\/app|src\\/pages)\\/.*\\/?(page|layout|route|loading|error|not-found|template|default|middleware|sitemap|robots|opengraph-image|icon)\\.(tsx?|jsx?|mts)$|\\.config\\.(ts|js|mjs|cjs)$/,","    dialects: [","      { name: 'named export', test: /\\bexport\\s+(const|function|class|interface|type|async)\\b/ },","      { name: 'default export', test: /\\bexport\\s+default\\b/ },","      { name: 'commonjs', test: /\\bmodule\\.exports\\b/ },","    ],","  },","  {","    key: 'validation',","    label: 'input validation',","    minUses: 4,","    dialects: [","      { name: 'schema library', test: /\\b(z|yup|joi|v)\\.(object|string|number|array)\\s*\\(/ },","      // Only ways of checking a value's *type*. `if (!x) return` checks that","      // it is there at all, which a typeof guard cannot replace, so counting","      // it as a rival made parsing untrusted JSON carefully look like drift.","      { name: 'manual typeof guard', test: /\\btypeof\\s+\\w+\\s*(===|!==)\\s*['\"](string|number|boolean|object)['\"]/ },","    ],","  },","];","","export interface DriftResult {","  findings: Finding[];","  count: number;","}","","/**"," * A convention is what the shipping code does."," *"," * Benchmarks compare variants on purpose, examples are written for clarity"," * rather than consistency, and a demo uses whatever the framework prefers."," * Letting them vote produced verdicts anchored in `benchmarks/fetch/bench.mts`"," * and `examples/demo`, which tell a maintainer nothing about their own codebase."," */","const NON_PRODUCTION =","  /(^|\\/)(bench|benchmark|benchmarks|perf|perf-measures|examples?|demo|playground|fixtures?|__fixtures__|docs?)\\//i;","","function isProductionCode(file: string): boolean {","  return !NON_PRODUCTION.test(file);","}","","export function findDrift(graph: CodeGraph): DriftResult {","  const findings: Finding[] = [];","","  for (const category of CATEGORIES) {","    const uses = new Map\u003cstring, CodeSymbol[]\u003e();","    for (const symbol of graph.symbols.values()) {","      if (!isProductionCode(symbol.file)) continue;","      if (category.exempt?.test(symbol.file)) continue;","      for (const dialect of category.dialects) {","        if (dialect.test.test(symbol.body)) {","          const list = uses.get(dialect.name);","          if (list) list.push(symbol);","          else uses.set(dialect.name, [symbol]);","        }","      }","    }","","    const total = [...uses.values()].reduce((sum, list) =\u003e sum + list.length, 0);","    if (total \u003c category.minUses || uses.size \u003c 2) continue;","","    const ranked = [...uses.entries()].sort((a, b) =\u003e b[1].length - a[1].length);","    const [dominantName, dominantUses] = ranked[0];","    const dominantShare = dominantUses.length / total;","","    // A genuine 50/50 split is a decision nobody made; a 90/10 split is drift.","    // Both are worth showing, but only when one convention is clearly the norm","    // is there an obvious action, so that is what we rank highest.","    const minority = ranked.slice(1);","    const minorityCount = minority.reduce((sum, [, list]) =\u003e sum + list.length, 0);","","    // A single outlier among hundreds is not a convention being contested, and","    // reporting it produced headings like \"named export 100%, default export 0%","    // — 1 place deviates\", which is arithmetic nonsense.","    const minorityShare = minorityCount / total;","    if (minorityShare \u003c 0.02 \u0026\u0026 minorityCount \u003c 3) continue;","    const deviants = minority.flatMap(([name, list]) =\u003e","      list.map((s) =\u003e ({ dialect: name, id: s.id, file: s.file, line: s.line, name: s.name })),","    );","","    const breakdown = ranked.map(([name, list]) =\u003e `${name} ${percent(list.length, total)}`).join(', ');","","    findings.push({","      id: `drift:${category.key}`,","      kind: 'drift',","      severity: dominantShare \u003e= 0.8 ? 'medium' : 'high',","      title: `${category.label} is done ${uses.size} different ways`,","      action:","        dominantShare \u003e= 0.8","          ? `Change the ${minorityCount} deviating place${minorityCount === 1 ? '' : 's'} to use \"${dominantName}\", which is what the rest of the codebase does.`","          : `Decide which of these this codebase uses, write it down, and convert the others.`,","      detail:","        `${breakdown}. ` +","        (dominantShare \u003e= 0.8","          ? `\"${dominantName}\" is the established convention here; ${minorityCount} ${minorityCount === 1 ? 'place deviates' : 'places deviate'} from it.`","          : `No convention has won, so each new change picks one at random.`),","      file: deviants[0]?.file ?? [...graph.files.keys()][0] ?? '',","      line: deviants[0]?.line ?? 1,","      symbols: deviants.map((d) =\u003e d.id),","      loc: minorityCount,","      // A clear norm with a few deviants is actionable; a coin-flip split is not.","      score: dominantShare \u003e= 0.8 ? 0.8 : 0.5,","      evidence: {","        category: category.label,","        dominant: dominantName,","        dominantShare: Number(dominantShare.toFixed(2)),","        breakdown: ranked.map(([name, list]) =\u003e ({","          dialect: name,","          count: list.length,","          share: Number((list.length / total).toFixed(3)),","        })),","        // Cap the list: a report is a worklist, not a log.","        deviants: deviants.slice(0, 25),","      },","    });","  }","","  findings.sort((a, b) =\u003e b.score - a.score);","  return { findings, count: findings.length };","}","","/** Never round a non-zero share to 0%, nor a non-total share to 100%. */","function percent(part: number, total: number): string {","  const share = (part / total) * 100;","  if (part \u003e 0 \u0026\u0026 share \u003c 1) return '\u003c1%';","  if (part \u003c total \u0026\u0026 share \u003e 99) return '\u003e99%';","  return `${Math.round(share)}%`;","}",""]},{"path":"src/analysis/dupes upes.ts#isNamingFamily","name":"isNamingFamily","kind":"function","line":570,"loc":44,"exported":false,"usedBy":[{"file":"src/analysis/dupes.ts","line":644,"name":"rankScore"},{"file":"src/analysis/dupes.ts","line":701,"name":"describe"}],"usedByCount":2,"reaches":[{"file":"src/analysis/dupes.ts","line":49,"name":"DupeCluster"},{"file":"src/analysis/similarity.ts","line":103,"name":"splitIdentifier"},{"file":"src/types.ts","line":13,"name":"CodeSymbol"}],"reachesCount":3,"findings":[]},{"id":"src/analysis/dupes.ts#ACTIONABLE_CLUSTER","name":"ACTIONABLE_CLUSTER","kind":"variable","line":621,"loc":1,"exported":false,"usedBy":[{"file":"src/analysis/dupes.ts","line":636,"name":"rankScore"}],"usedByCount":1,"reaches":[],"reachesCount":0,"findings":[]},{"id":"src/analysis/dupes.ts#rankScore","name":"rankScore","kind":"function","line":623,"loc":43,"exported":false,"usedBy":[{"file":"src/analysis/dupes.ts","line":163,"name":"findDuplicates"}],"usedByCount":1,"reaches":[{"file":"src/analysis/dupes.ts","line":49,"name":"DupeCluster"},{"file":"src/analysis/dupes.ts","line":402,"name":"isProductionCode"},{"file":"src/types.ts","line":13,"name":"CodeSymbol"},{"file":"src/analysis/dupes.ts","line":621,"name":"ACTIONABLE_CLUSTER"},{"file":"src/analysis/dupes.ts","line":570,"name":"isNamingFamily"}],"reachesCount":5,"findings":[]},{"id":"src/analysis/dupes.ts#titleOf","name":"titleOf","kind":"function","line":668,"loc":11,"exported":false,"usedBy":[{"file":"src/analysis/dupes.ts","line":169,"name":"findDuplicates"}],"usedByCount":1,"reaches":[{"file":"src/analysis/dupes.ts","line":49,"name":"DupeCluster"},{"file":"src/types.ts","line":13,"name":"CodeSymbol"}],"reachesCount":2,"findings":[]},{"id":"src/analysis/dupes.ts#describe","name":"describe","kind":"function","line":680,"loc":30,"exported":false,"usedBy":[{"file":"src/analysis/dupes.ts","line":173,"name":"findDuplicates"}],"usedByCount":1,"reaches":[{"file":"src/analysis/dupes.ts","line":49,"name":"DupeCluster"},{"file":"src/types.ts","line":13,"name":"CodeSymbol"},{"file":"src/analysis/dupes.ts","line":570,"name":"isNamingFamily"}],"reachesCount":3,"findings":[]}],"usedBy":[{"path":"src/api.ts","count":4},{"path":"test/dupe-shapes.test.ts","count":1}],"uses":[{"path":"src/types.ts","count":32},{"path":"src/analysis/similarity.ts","count":11},{"path":"src/config.ts","count":4}],"marks":[],"source":["import type { CodeGraph, CodeSymbol, Finding } from '../types.js';","import type { Config } from '../config.js';","import { structuralBag, vocabularyBag, cosine, splitIdentifier, type Bag } from './similarity.js';","","interface Candidate {","  symbol: CodeSymbol;","  /** The body with its signature removed. See bodyOf. */","  body: string;","  structure: Bag;","  vocabulary: Bag;","}","","/**"," * The body, without the signature that introduces it."," *"," * Measured against labelled examples, every high-scoring false positive was a"," * pair whose *parameter lists* aligned while their bodies did different work —"," * a 12-key destructuring matching another 12-key destructuring, a typed"," * overload stub matching another stub. The signature says what a function"," * takes; only the body says what it does, and duplication is about what it does."," */","function bodyOf(symbol: CodeSymbol): string {","  const text = symbol.body;","  // TypeScript and JavaScript: everything after the opening brace.","  const brace = text.indexOf('{');","  const arrow = text.indexOf('=\u003e');","  if (brace !== -1 \u0026\u0026 (arrow === -1 || brace \u003c arrow + 3)) return text.slice(brace + 1);","  if (arrow !== -1) return text.slice(arrow + 2);","  // Python: the colon ending the signature, which may follow a return","  // annotation — `def f(x) -\u003e Iterator[str]:` ends at the last colon, not the","  // one straight after the parameters.","  const close = text.indexOf(')');","  if (close !== -1) {","    const colon = text.indexOf(':', close);","    if (colon !== -1) return text.slice(colon + 1);","  }","  return text;","}","","/**"," * A body that does nothing: an overload stub, or a definition whose whole"," * content is its own documentation. Every such body resembles every other."," */","function isTrivialBody(body: string): boolean {","  const stripped = body.replace(/[\\s{}();]/g, '');","  return stripped.length \u003c 24 || /^\\.\\.\\.$/.test(stripped);","}","","export interface DupeCluster {","  members: CodeSymbol[];","  /** Mean pairwise similarity inside the cluster. */","  similarity: number;","  /**","   * How much of the smaller body appears verbatim in the larger.","   *","   * The decisive signal. Two functions that share a parameter list can score","   * well on everything else while doing different work; two that share their","   * actual statements are the same function written twice, whatever they are","   * called and wherever they live.","   */","  overlap: number;","  crossFile: boolean;","  connected: boolean;","  /** The same name implemented once per file: translations, adapters, drivers. */","  parallelSet: boolean;","  /** Thin wrappers that all delegate to one shared target. */","  delegating: boolean;","  /**","   * Members call at least one of the same things.","   *","   * Two functions doing the same job almost always reach for the same","   * helpers. When two similar-looking bodies call nothing in common, the","   * resemblance is in their shape rather than in their work.","   */","  sharesWork: boolean;","}","","export interface DupeResult {","  findings: Finding[];","  clusters: DupeCluster[];","  duplicateLoc: number;","  /** The cut-off actually used, after per-project calibration. */","  threshold: number;","}","","const STRUCTURE_WEIGHT = 0.5;","","/**"," * Both signals must clear a floor, not merely average well."," *"," * Measured on real repositories, the two signals do different jobs than"," * expected. False positives are *vocabulary* matches: a tagged-template helper"," * against a child-node loop, an error boundary against a suspense wrapper —"," * same domain words, 0.74 to 0.93 on vocabulary, but only 0.58 to 0.74 on"," * structure, because they do different things with those words."," *"," * Genuine re-implementations perform the same steps, so they agree on"," * structure: 1.00 for two copies of one function, and 1.00 for the same idea"," * rewritten with different names. Structure is what separates them, and"," * averaging let a moderate structure score hide behind a strong vocabulary one."," */","const STRUCTURE_FLOOR = 0.85;","const VOCABULARY_FLOOR = 0.45;","","/**"," * Headline numbers drive the CI budget, so only findings we would actually"," * stand behind count towards them. A cluster we are 27% sure of is still worth"," * showing as a question; it is not worth failing someone's build over."," */","const METRIC_CONFIDENCE_FLOOR = 0.5;","","/**"," * Find groups of symbols that do the same job. Not a clone detector: the target"," * is the third `formatDuration` written by a session that could not find the"," * first two, which shares no tokens with them but does share intent."," */","export function findDuplicates(graph: CodeGraph, config: Config): DupeResult {","  const candidates: Candidate[] = [];","  for (const symbol of graph.symbols.values()) {","    if (symbol.kind !== 'function' \u0026\u0026 symbol.kind !== 'method') continue;","    if (symbol.loc \u003c config.dupeMinLoc) continue;","    // A constructor, and Python's `__init__` and friends, are near-identical","    // because the language requires the shape, not because anyone","    // re-implemented anything. They are not candidates at all.","    if (symbol.name === 'constructor') continue;","    if (symbol.name.startsWith('__') \u0026\u0026 symbol.name.endsWith('__')) continue;","    // A stub declares an interface; it has no implementation to duplicate.","    if (isStub(symbol)) continue;","    // A test suite repeats its scaffolding on purpose: each case sets up the","    // same shape and asserts something different. Verified precision on Python","    // test suites was zero, so these are opt-in rather than default.","    if (!config.includeTests \u0026\u0026 isTestFile(symbol.file)) continue;","    // Benchmarks and examples are written to be self-contained so each one","    // measures or demonstrates a single thing; their resemblance is the point.","    if (!config.includeTests \u0026\u0026 !isProductionCode(symbol.file)) continue;","    const body = bodyOf(symbol);","    // An overload stub or a docstring-only definition has nothing to duplicate.","    if (isTrivialBody(body)) continue;","    candidates.push({","      symbol,","      body,","      structure: structuralBag(body),","      vocabulary: vocabularyBag(symbol.name, body),","    });","  }","","  const threshold = calibrate(candidates, config);","  const parallelDirs = findParallelDirectories(graph);","  const pairs = scorePairs(candidates, threshold);","  const clusters = cluster(pairs, candidates, graph, parallelDirs);","","  const findings: Finding[] = [];","  let duplicateLoc = 0;","","  for (const group of clusters) {","    // The smallest member is what you would keep; the rest is what you would remove.","    const removable = group.members","      .slice()","      .sort((a, b) =\u003e a.loc - b.loc)","      .slice(1)","      .reduce((sum, s) =\u003e sum + s.loc, 0);","","    const score = rankScore(group);","    if (score \u003e= METRIC_CONFIDENCE_FLOOR) duplicateLoc += removable;","    findings.push({","      id: `duplicate:${group.members.map((m) =\u003e m.id).join('|')}`,","      kind: 'duplicate',","      severity: removable \u003e= 40 ? 'high' : removable \u003e= 12 ? 'medium' : 'low',","      title: titleOf(group),","      action: group.members.length === 2","        ? `Keep one of these and have the other call it.`","        : `Keep one implementation and have the other ${group.members.length - 1} call it.`,","      detail: describe(group),","      file: group.members[0].file,","      line: group.members[0].line,","      symbols: group.members.map((m) =\u003e m.id),","      loc: removable,","      score,","      evidence: {","        similarity: Number(group.similarity.toFixed(3)),","        crossFile: group.crossFile,","        connected: group.connected,","        members: group.members.map((m) =\u003e ({","          id: m.id,","          name: m.name,","          file: m.file,","          line: m.line,","          endLine: m.endLine,","          loc: m.loc,","          signature: m.signature,","        })),","      },","    });","  }","","  findings.sort((a, b) =\u003e b.score * b.loc - a.score * a.loc);","  return { findings, clusters, duplicateLoc, threshold };","}","","/**"," * A codebase of small adapters looks self-similar everywhere, so one global"," * cut-off cannot serve every project. Raise the threshold when the background"," * similarity is already high, otherwise the first run is all noise."," */","function calibrate(candidates: Candidate[], config: Config): number {","  if (candidates.length \u003c 30) return config.dupeThreshold;","","  // Sample random pairs to estimate what \"unrelated\" looks like in this repo.","  const samples: number[] = [];","  let seed = 42;","  const random = (): number =\u003e {","    seed = (seed * 1664525 + 1013904223) % 4294967296;","    return seed / 4294967296;","  };","  for (let i = 0; i \u003c 400; i++) {","    const a = candidates[Math.floor(random() * candidates.length)];","    const b = candidates[Math.floor(random() * candidates.length)];","    if (a === b) continue;","    samples.push(similarity(a, b));","  }","  if (samples.length === 0) return config.dupeThreshold;","","  samples.sort((a, b) =\u003e a - b);","  const p95 = samples[Math.floor(samples.length * 0.95)];","  // Sit above the background, but never below the configured floor.","  return Math.max(config.dupeThreshold, Math.min(0.95, p95 + 0.05));","}","","/** Fraction of the smaller body's token shingles that also appear in the larger. */","function bodyOverlap(a: Candidate, b: Candidate): number {","  const [small, large] = a.structure.size \u003c= b.structure.size ? [a, b] : [b, a];","  if (small.structure.size === 0) return 0;","  let shared = 0;","  for (const key of small.structure.keys()) {","    if (large.structure.has(key)) shared++;","  }","  return shared / small.structure.size;","}","","function similarity(a: Candidate, b: Candidate): number {","  const structure = cosine(a.structure, b.structure);","  if (structure \u003c STRUCTURE_FLOOR) return 0;","  const vocabulary = cosine(a.vocabulary, b.vocabulary);","  if (vocabulary \u003c VOCABULARY_FLOOR) return 0;","  return STRUCTURE_WEIGHT * structure + (1 - STRUCTURE_WEIGHT) * vocabulary;","}","","/**"," * One declaration inside another: a closure and the function that holds it."," *"," * The parent's text contains the child's, so similarity is high by"," * construction and means nothing. This is containment, not duplication."," */","function contains(a: CodeSymbol, b: CodeSymbol): boolean {","  if (a.file !== b.file) return false;","  return (","    (a.line \u003c= b.line \u0026\u0026 b.endLine \u003c= a.endLine) || (b.line \u003c= a.line \u0026\u0026 a.endLine \u003c= b.endLine)","  );","}","","interface Pair {","  a: number;","  b: number;","  score: number;","}","","/**"," * Candidate generation by inverted index on vocabulary, so we never score all"," * pairs. Two functions with no shared word cannot clear the threshold."," */","function scorePairs(candidates: Candidate[], threshold: number): Pair[] {","  const postings = new Map\u003cstring, number[]\u003e();","  for (let i = 0; i \u003c candidates.length; i++) {","    for (const word of candidates[i].vocabulary.keys()) {","      const list = postings.get(word);","      if (list) list.push(i);","      else postings.set(word, [i]);","    }","  }","","  const seen = new Set\u003cnumber\u003e();","  const pairs: Pair[] = [];","  for (const list of postings.values()) {","    // A word shared by half the codebase tells us nothing and costs the most.","    if (list.length \u003e 60) continue;","    for (let x = 0; x \u003c list.length; x++) {","      for (let y = x + 1; y \u003c list.length; y++) {","        const a = list[x];","        const b = list[y];","        const key = a * candidates.length + b;","        if (seen.has(key)) continue;","        seen.add(key);","        if (contains(candidates[a].symbol, candidates[b].symbol)) continue;","        if (!comparableSize(candidates[a].symbol, candidates[b].symbol)) continue;","        const score = similarity(candidates[a], candidates[b]);","        if (score \u003e= threshold) pairs.push({ a, b, score });","      }","    }","  }","  return pairs;","}","","/** Union-find over the surviving pairs: a cluster is a connected component. */","function cluster(","  pairs: Pair[],","  candidates: Candidate[],","  graph: CodeGraph,","  parallelDirs: Set\u003cstring\u003e,","): DupeCluster[] {","  const parent = new Map\u003cnumber, number\u003e();","  const find = (x: number): number =\u003e {","    let root = x;","    while (parent.get(root) !== undefined \u0026\u0026 parent.get(root) !== root) root = parent.get(root)!;","    return root;","  };","  const union = (x: number, y: number): void =\u003e {","    const rx = find(parent.has(x) ? x : (parent.set(x, x), x));","    const ry = find(parent.has(y) ? y : (parent.set(y, y), y));","    if (rx !== ry) parent.set(rx, ry);","  };","","  for (const pair of pairs) union(pair.a, pair.b);","","  const groups = new Map\u003cnumber, number[]\u003e();","  for (const key of parent.keys()) {","    const root = find(key);","    const list = groups.get(root);","    if (list) list.push(key);","    else groups.set(root, [key]);","  }","","  const edgeSet = new Set(graph.edges.map((e) =\u003e `${e.from}\u003e${e.to}`));","  const out: DupeCluster[] = [];","","  for (const indices of groups.values()) {","    if (indices.length \u003c 2) continue;","    const members = indices.map((i) =\u003e candidates[i].symbol);","    const relevant = pairs.filter((p) =\u003e indices.includes(p.a) \u0026\u0026 indices.includes(p.b));","    const mean = relevant.reduce((sum, p) =\u003e sum + p.score, 0) / (relevant.length || 1);","    const overlap = relevant.length","      ? Math.max(...relevant.map((p) =\u003e bodyOverlap(candidates[p.a], candidates[p.b])))","      : 0;","","    // A wrapper that calls the thing it resembles is delegation, not","    // duplication — and so is an override beside the base it overrides, which","    // the indexer links with the same kind of edge.","    const connected = members.some((m) =\u003e","      members.some((n) =\u003e m !== n \u0026\u0026 (edgeSet.has(`${m.id}\u003e${n.id}`) || edgeSet.has(`${n.id}\u003e${m.id}`))),","    );","","    out.push({","      members: members.sort((a, b) =\u003e b.loc - a.loc),","      similarity: mean,","      overlap,","      crossFile: new Set(members.map((m) =\u003e m.file)).size \u003e 1,","      connected,","      parallelSet: isParallelSet(members) || spansParallelSurfaces(members, parallelDirs),","      delegating: isDelegating(members, graph),","      sharesWork: sharesWork(members, graph),","    });","  }","","  return out;","}","","/**"," * A body that only announces it is not implemented: an abstract base's method,"," * or a placeholder. Every stub resembles every other stub, and none of them is"," * code anyone would merge."," */","function isStub(symbol: CodeSymbol): boolean {","  return /\\b(raise\\s+NotImplementedError|throw\\s+new\\s+Error\\(\\s*['\"`](not implemented|unimplemented)|NotImplementedError\\b)/i.test(","    symbol.body,","  );","}","","/**"," * Duplicates are substitutable, and substitutable code is comparable in size."," *"," * A 1078-character implementation and a 231-character declaration matched at"," * 0.86 because both open with a long typed parameter list, which dominates the"," * token skeleton. Neither could replace the other, so it was never a duplicate."," */","const MAX_SIZE_RATIO = 2.5;","","function comparableSize(a: CodeSymbol, b: CodeSymbol): boolean {","  const larger = Math.max(a.body.length, b.body.length);","  const smaller = Math.min(a.body.length, b.body.length);","  return smaller \u003e 0 \u0026\u0026 larger / smaller \u003c= MAX_SIZE_RATIO;","}","","const TEST_FILE =","  /(^|\\/)(tests?|spec|__tests__|test-d|e2e)\\/|(^|\\/)(test_[^/]*|[^/]*_test|[^/]*\\.(test|spec))\\.[cm]?[jt]sx?$|(^|\\/)test_[^/]*\\.py$|_test\\.(py|go)$|(^|\\/)Tests\\/|Tests?\\.swift$/i;","","function isTestFile(file: string): boolean {","  return TEST_FILE.test(file);","}","","const NON_PRODUCTION =","  /(^|\\/)(bench|benchmark|benchmarks|perf|perf-measures|examples?|fixtures?|__fixtures__|demo|playground)\\//i;","","function isProductionCode(file: string): boolean {","  return !NON_PRODUCTION.test(file);","}","","/**"," * Directories that are parallel surfaces over one idea."," *"," * zod ships `core`, `classic` and `mini`: three published APIs with the same"," * function names and deliberately different generics. A repository with a `v3`"," * beside a `v4`, or one driver directory per backend, has the same shape."," * Two directories that share a large share of their symbol names are answering"," * the same questions on purpose, so resemblance between them is the design."," */","function findParallelDirectories(graph: CodeGraph): Set\u003cstring\u003e {","  const byDir = new Map\u003cstring, Set\u003cstring\u003e\u003e();","  for (const symbol of graph.symbols.values()) {","    if (symbol.kind === 'module') continue;","    const dir = symbol.file.slice(0, symbol.file.lastIndexOf('/'));","    const names = byDir.get(dir);","    if (names) names.add(symbol.name);","    else byDir.set(dir, new Set([symbol.name]));","  }","","  const dirs = [...byDir.entries()].filter(([, names]) =\u003e names.size \u003e= 8);","  const parallel = new Set\u003cstring\u003e();","","  for (let i = 0; i \u003c dirs.length; i++) {","    for (let j = i + 1; j \u003c dirs.length; j++) {","      const [dirA, namesA] = dirs[i];","      const [dirB, namesB] = dirs[j];","      const shared = [...namesA].filter((n) =\u003e namesB.has(n)).length;","      const smaller = Math.min(namesA.size, namesB.size);","      if (shared \u003e= 8 \u0026\u0026 shared / smaller \u003e= 0.4) {","        parallel.add(pairKey(dirA, dirB));","      }","    }","  }","  return parallel;","}","","function pairKey(a: string, b: string): string {","  return a \u003c b ? `${a}|${b}` : `${b}|${a}`;","}","","/** Does this cluster straddle two directories that mirror each other? */","function spansParallelSurfaces(members: CodeSymbol[], parallelDirs: Set\u003cstring\u003e): boolean {","  const dirs = [...new Set(members.map((m) =\u003e m.file.slice(0, m.file.lastIndexOf('/'))))];","  for (let i = 0; i \u003c dirs.length; i++) {","    for (let j = i + 1; j \u003c dirs.length; j++) {","      if (parallelDirs.has(pairKey(dirs[i], dirs[j]))) return true;","    }","  }","  return false;","}","","/**"," * What each member calls, by name, ignoring calls between members themselves."," *"," * By name rather than by identity: `api.head` forwards to `api.request` while"," * `Session.head` forwards to `Session.request`, and those are two symbols and"," * one idea."," */","function calleeNames(members: CodeSymbol[], graph: CodeGraph): Array\u003cSet\u003cstring\u003e\u003e {","  const ids = new Set(members.map((m) =\u003e m.id));","  return members.map((member) =\u003e {","    const names = new Set\u003cstring\u003e();","    for (const edge of graph.edges) {","      if (edge.from !== member.id || ids.has(edge.to)) continue;","      const target = graph.symbols.get(edge.to);","      if (target \u0026\u0026 target.kind !== 'module') names.add(target.name);","    }","    return names;","  });","}","","/** Names every member calls. */","function commonCallees(perMember: Array\u003cSet\u003cstring\u003e\u003e): string[] {","  if (perMember.length === 0) return [];","  const [first, ...rest] = perMember;","  return [...first].filter((name) =\u003e rest.every((set) =\u003e set.has(name)));","}","","/**"," * Do the members call anything in common, or merely look alike?"," *"," * Only meaningful when they call anything at all: a leaf function built from"," * a regular expression and string methods reaches for nothing, and two such"," * functions can still be the same function written twice."," */","function sharesWork(members: CodeSymbol[], graph: CodeGraph): boolean {","  if (members.length \u003c 2) return true;","  const perMember = calleeNames(members, graph);","  if (perMember.some((names) =\u003e names.size === 0)) return true;","  return commonCallees(perMember).length \u003e 0;","}","","/**"," * Thin wrappers over one shared implementation: `head`, `options`, `delete`,"," * each a line that forwards to `request`."," *"," * They resemble each other because that is the entire design — a named door"," * onto one function — and merging them would delete the public API."," */","function isDelegating(members: CodeSymbol[], graph: CodeGraph): boolean {","  if (members.length \u003c 2) return false;","  // Only a thin wrapper, measured on the normalised body rather than on line","  // count: a well-documented one-line forwarder runs to twenty lines of which","  // nineteen are docstring.","  //","  // Two substantial functions that merely share helpers are not wrappers —","  // hono's `jwk` and `jwt` middlewares share a verify helper and are still two","  // forty-line bodies, one copied from the other.","  if (members.some((m) =\u003e m.body.length \u003e 240)) return false;","","  const perMember = calleeNames(members, graph);","  if (perMember.some((names) =\u003e names.size === 0)) return false;","  return commonCallees(perMember).length \u003e 0;","}","","/**"," * One name, implemented once per file: `error` in sixty `locales/*.ts`, or a"," * driver per backend."," *"," * Identical structure is the entire point of such a set, and the differing"," * content is the payload. Reporting zod's sixty translations as \"redundant"," * re-implementation\" at 98% confidence is the single fastest way to lose a"," * user's trust, so this is treated as structure, not redundancy."," */","function isParallelSet(members: CodeSymbol[]): boolean {","  // One name, implemented as a method by several classes, is polymorphism: each","  // class must supply its own `convert` or `getQueryString`, and that is the","  // design. Two free functions sharing a name is the opposite — nobody had to","  // write the second one, and copy-paste is exactly how it happens.","  const oneName = new Set(members.map((m) =\u003e m.name)).size === 1;","  if (oneName \u0026\u0026 members.every((m) =\u003e m.kind === 'method')) return true;","","  if (members.length \u003c 3) return false;","","  const names = new Map\u003cstring, number\u003e();","  for (const member of members) names.set(member.name, (names.get(member.name) ?? 0) + 1);","  const commonest = Math.max(...names.values());","","  // One name implemented once per class is polymorphism: each subclass must","  // provide its own `_parse`, and that is the design rather than a repetition","  // anyone introduced by accident.","  const containers = new Set(members.map((m) =\u003e m.id.split('#')[1].split('.').slice(0, -1).join('.')));","  if (commonest \u003e= 3 \u0026\u0026 containers.size \u003e= 3) return true;","","  const files = new Set(members.map((m) =\u003e m.file));","  // One implementation per file, or close to it.","  if (files.size \u003c members.length * 0.7) return false;","  if (commonest \u003e= 3) return true;","","  // Sibling files under one directory implementing the same small vocabulary is","  // the same shape: `adapters/postgres.ts`, `adapters/mysql.ts`, and so on.","  const directories = new Set([...files].map((f) =\u003e f.slice(0, f.lastIndexOf('/'))));","  return directories.size === 1 \u0026\u0026 files.size \u003e= 4;","}","","/**"," * A deliberate naming family: `formatRfc850Date` and `formatAsctimeDate`, or"," * `parseJson` and `parseYaml`."," *"," * Names that share most of their words are a set someone designed, where the"," * differing word *is* the point. That is the opposite of the case this tool"," * exists for — three names with nothing in common doing one job, each written"," * by someone who could not find the others."," */","function isNamingFamily(group: DupeCluster): boolean {","  const wordLists = group.members.map((m) =\u003e splitIdentifier(m.name));","","  // A designed set differs in exactly one place: `help_option` beside","  // `version_option`, `useCallback` beside `useMemo`, `_find` beside","  // `_find_no_duplicates`. The differing word is the whole point.","  //","  // A shared boundary word alone is not enough — `renderInvoiceTotal` and","  // `formatReceiptTotal` also end alike, and are a genuine duplicate.","  // Checked pairwise: a cluster mixing `_maxSize`, `_minSize` and `_minLength`","  // has no single shared boundary across every member, yet every pair in it is","  // a variant of its neighbour.","  for (let i = 0; i \u003c wordLists.length; i++) {","    for (let j = i + 1; j \u003c wordLists.length; j++) {","      const a = wordLists[i];","      const b = wordLists[j];","      if (a.length === 0 || b.length === 0) continue;","      if (group.members[i].name === group.members[j].name) continue;","","      // Differ in exactly one word at a shared boundary.","      if (a[0] === b[0] \u0026\u0026 a.length \u003c= 2 \u0026\u0026 b.length \u003c= 2) return true;","      if (a.at(-1) === b.at(-1) \u0026\u0026 a.length \u003c= 2 \u0026\u0026 b.length \u003c= 2) return true;","","      // One name extends the other: `_find` and `_find_no_duplicates`.","      const [shortest, longest] = a.length \u003c= b.length ? [a, b] : [b, a];","      if (shortest.every((word, k) =\u003e longest[k] === word)) return true;","    }","  }","","  const wordSets = wordLists.map((w) =\u003e new Set(w));","  for (let i = 0; i \u003c wordSets.length; i++) {","    for (let j = i + 1; j \u003c wordSets.length; j++) {","      const a = wordSets[i];","      const b = wordSets[j];","      const shared = [...a].filter((w) =\u003e b.has(w)).length;","      const smaller = Math.min(a.size, b.size);","      // Most of the shorter name is shared, and something still differs.","      if (smaller \u003e 0 \u0026\u0026 shared \u003e= 2 \u0026\u0026 shared / smaller \u003e= 0.5 \u0026\u0026 shared \u003c Math.max(a.size, b.size)) {","        return true;","      }","    }","  }","  return false;","}","","/**"," * Accidental duplication comes in twos and threes: someone could not find the"," * first one, so they wrote a second. Twenty-seven copies is not an accident —"," * it is a pattern somebody chose, and no human is going to merge twenty-seven"," * functions off the back of a report."," */","const ACTIONABLE_CLUSTER = 4;","","function rankScore(group: DupeCluster): number {","  let score = group.similarity;","  const penaltiesBefore = score;","  // One implementation per file is structure, not redundancy.","  if (group.parallelSet) score -= 0.6;","  // Named doors onto one shared function: merging them deletes the API.","  if (group.delegating) score -= 0.5;","  // Similar shape, nothing in common to do: the resemblance is superficial.","  if (!group.sharesWork) score -= 0.3;","  // Benchmarks, fixtures and examples repeat themselves on purpose, to compare","  // variants. Real, and not work anyone is going to do.","  if (group.members.every((m) =\u003e !isProductionCode(m.file))) score -= 0.3;","  // Past a handful, confidence falls away with size.","  if (group.members.length \u003e ACTIONABLE_CLUSTER) {","    score -= Math.min(0.5, 0.08 * (group.members.length - ACTIONABLE_CLUSTER));","  }","  // Same file, adjacent: usually deliberate overloads a reader can already see.","  if (!group.crossFile) score -= 0.15;","  // One calls the other, so it is layering rather than redundancy.","  if (group.connected) score -= 0.4;","  // A designed set of variants, where the differing word is the whole point.","  if (isNamingFamily(group)) score -= 0.45;","  // More copies is stronger evidence that nobody knew the others existed.","  if (group.members.length \u003e 2) score += 0.05;","","  // A body reproduced almost verbatim is a duplicate however it is named and","  // wherever it sits, so the reasons above cannot bury it.","  //","  // Except where verbatim bodies are the design rather than an accident:","  //","  //  - a designed pair, where the one differing word is exactly where the","  //    behaviour differs. `setResponseHeader` and `appendResponseHeader` are","  //    near-identical apart from a single `delete` call.","  //  - a parallel set — sixty locale files, one adapter per backend, a class","  //    per subtype — where identical structure is the entire point.","  //  - a thin wrapper around a shared function.","  const expectedToMatch = isNamingFamily(group) || group.parallelSet || group.delegating;","  if (group.overlap \u003e= 0.9 \u0026\u0026 !expectedToMatch) {","    score = Math.max(score, penaltiesBefore - 0.2);","  }","","  return Math.max(0.05, Math.min(1, Math.round(score * 100) / 100));","}","","/** Name the cluster without listing sixty symbols in a heading. */","function titleOf(group: DupeCluster): string {","  const unique = [...new Set(group.members.map((m) =\u003e m.name))];","  const shown = unique.slice(0, 3).join(', ');","  const rest = unique.length - 3;","  const names = rest \u003e 0 ? `${shown} and ${rest} more` : shown;","","  if (group.parallelSet) {","    return `${group.members.length} parallel implementations of ${names}`;","  }","  return `${group.members.length} implementations of the same thing: ${names}`;","}","","function describe(group: DupeCluster): string {","  const shown = group.members.slice(0, 6).map((m) =\u003e `${m.file}:${m.line}`);","  const where =","    group.members.length \u003e 6","      ? `${shown.join(', ')} and ${group.members.length - 6} more`","      : shown.join(', ');","  const parts = [","    `${group.members.length} symbols share ${(group.similarity * 100).toFixed(0)}% similarity: ${where}.`,","  ];","  if (group.delegating) {","    parts.push(","      'Each one forwards to the same underlying function, so these are named ' +","        'entry points onto one implementation rather than repeated work.',","    );","  } else if (group.parallelSet) {","    parts.push(","      'A deliberate parallel set — translations, adapters, drivers, or two API ' +","        'surfaces over one idea — where matching structure is the design rather than a repetition.',","    );","  } else if (group.connected) {","    parts.push('One of them calls another, so this may be deliberate delegation rather than duplication.');","  } else if (isNamingFamily(group)) {","    parts.push('Their names share most of their words, so these may be a deliberate set of variants rather than redundant re-implementations.');","  } else if (group.crossFile) {","    parts.push('They live in different files and none calls another, so each was likely written without knowledge of the others.');","  } else {","    parts.push('They live in the same file.');","  }","  return parts.join(' ');","}",""]},{"path":"src/analysis/history.ts","loc":276,"findings":[],"symbols":[{"id":"src/analysis/history.ts#ANALYSIS_VERSION","name":"ANALYSIS_VERSION","kind":"variable","line":26,"loc":1,"exported":true,"usedBy":[{"file":"src/analysis/history.ts","line":187,"name":"buildHistory"}],"usedByCount":1,"reaches":[],"reachesCount":0,"findings":[]},{"id":"src/analysis/history.ts#HistoryPoint","name":"HistoryPoint","kind":"interface","line":28,"loc":18,"exported":true,"usedBy":[{"file":"src/analysis/history.ts","line":59,"name":"readHistory"},{"file":"src/analysis/history.ts","line":69,"name":"writeHistory"},{"file":"src/analysis/history.ts","line":171,"name":"buildHistory"},{"file ","  /** How many samples across that window. */","  points: number;","  onProgress?: (done: number, total: number, sha: string) =\u003e void;","}","","export function historyPath(root: string): string {","  return join(root, '.instantiate', 'history.json');","}","","export function readHistory(root: string): HistoryPoint[] {","  const path = historyPath(root);","  if (!existsSync(path)) return [];","  try {","    return JSON.parse(readFileSync(path, 'utf8')) as HistoryPoint[];","  } catch {","    return [];","  }","}","","function writeHistory(root: string, points: HistoryPoint[]): void {","  mkdirSync(join(root, '.instantiate'), { recursive: true });","  const sorted = points","    .slice()","    .sort((a, b) =\u003e (a.at ?? a.date).localeCompare(b.at ?? b.date));","  writeFileSync(historyPath(root), `${JSON.stringify(sorted, null, 2)}\\n`);","}","","export function isGitRepo(root: string): boolean {","  try {","    git(root, ['rev-parse', '--git-dir']);","    return true;","  } catch {","    return false;","  }","}","","function git(root: string, args: string[]): string {","  return execFileSync('git', args, { cwd: root, encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] }).trim();","}","","/**"," * Sample commits evenly across the window: the last commit on or before each"," * cut-off. Sampling by date rather than by commit count keeps the x-axis"," * honest, since a quiet fortnight should look quiet."," */","interface Sample {","  sha: string;","  date: string;","  at: string;","}","","function sampleCommits(root: string, days: number, points: number): Sample[] {","  const out: Sample[] = [];","  const seen = new Set\u003cstring\u003e();","  const now = Date.now();","  const step = (days * 86_400_000) / Math.max(1, points - 1);","","  for (let i = points - 1; i \u003e= 0; i--) {","    const when = new Date(now - step * i).toISOString();","    let line: string;","    try {","      line = git(root, ['log', '-1', `--until=${when}`, '--format=%H %cI']);","    } catch {","      continue;","    }","    if (!line) continue;","    const [sha, date] = line.split(' ');","    // A quiet period samples the same commit repeatedly; one point is enough.","    if (!sha || seen.has(sha)) continue;","    seen.add(sha);","    out.push({ sha, date: date?.slice(0, 10) ?? '', at: date ?? '' });","  }","","  // Sampling by date keeps the x-axis honest, but a young repository does all","  // its work in a few days and collapses to two points. Spread the commits","  // themselves instead, which is the case this tool most wants to serve.","  if (out.length \u003c points) {","    const spread = sampleByCommitCount(root, points, seen);","    out.push(...spread);","    out.sort((a, b) =\u003e a.at.localeCompare(b.at));","  }","  return out;","}","","function sampleByCommitCount(root: string, points: number, seen: Set\u003cstring\u003e): Sample[] {","  let log: string[];","  try {","    log = git(root, ['log', '--format=%H %cI']).split('\\n').filter(Boolean);","  } catch {","    return [];","  }","  if (log.length === 0) return [];","","  const out: Sample[] = [];","  const step = Math.max(1, Math.floor(log.length / points));","  // `git log` is newest first; walk from the oldest so the line reads forwards.","  for (let i = log.length - 1; i \u003e= 0 \u0026\u0026 seen.size \u003c points + out.length; i -= step) {","    const [sha, date] = log[i].split(' ');","    if (!sha || seen.has(sha)) continue;","    seen.add(sha);","    out.push({ sha, date: date?.slice(0, 10) ?? '', at: date ?? '' });","  }","  return out;","}","","/**"," * Scan the codebase as it was at each sampled commit."," *"," * Each point needs a real checkout, because the analysis reads files from disk."," * A detached worktree is the cheap way to get one without disturbing whatever"," * the user has in progress — nothing in their working tree is touched."," */","/** A `--depth 1` clone has exactly one commit, so there is no trend to draw. */","export function isShallow(root: string): boolean {","  try {","    return git(root, ['rev-parse', '--is-shallow-repository']) === 'true';","  } catch {","    return false;","  }","}","","export async function buildHistory(root: string, options: HistoryOptions): Promise\u003cHistoryPoint[]\u003e {","  if (!isGitRepo(root)) {","    throw new UserError('Not a git repository, so there is no history to walk.');","  }","  if (!isGitRepo(root)) {","    throw new UserError('Not a git repository, so there is no history to walk.');","  }","","  const existing = new Map(readHistory(root).map((p) =\u003e [p.sha, p]));","  const commits = sampleCommits(root, options.days, options.points);","  const results: HistoryPoint[] = [];","","  for (const [i, commit] of commits.entries()) {","    options.onProgress?.(i + 1, commits.length, commit.sha);","","    const cached = existing.get(commit.sha);","    if (cached \u0026\u0026 cached.version === ANALYSIS_VERSION) {","      // A commit's content cannot change, so never re-scan one we have — as","      // long as it was measured by the rules in force now.","      results.push(cached);","      continue;","    }","","    const worktree = join(tmpdir(), `instantiate-${commit.sha.slice(0, 12)}`);","    try {","      git(root, ['worktree', 'add', '--detach', '--quiet', worktree, commit.sha]);","      const result = await scan({ root: worktree });","      const clean =","        result.stats.loc \u003e 0","          ? 1 - (result.stats.deadLoc + result.stats.duplicateLoc) / result.stats.loc","          : 1;","      results.push({","        sha: commit.sha,","        version: ANALYSIS_VERSION,","        date: commit.date,","        at: commit.at,","        deadLoc: result.stats.deadLoc,","        duplicateLoc: result.stats.duplicateLoc,","        driftCount: result.stats.driftCount,","        loc: result.stats.loc,","        loadBearing: Number((clean * 100).toFixed(2)),","      });","    } catch {","      // A commit that will not check out or index is skipped rather than fatal:","      // a gap in the line is better than no line.","    } finally {","      try {","        git(root, ['worktree', 'remove', '--force', worktree]);","      } catch {","        rmSync(worktree, { recursive: true, force: true });","      }","    }","  }","","  // Re-measured points replace their stale predecessors.","  const merged = new Map(existing);","  for (const point of results) merged.set(point.sha, point);","  writeHistory(root, [...merged.values()]);","  return results;","}","","/** Sparkline from a series, for the terminal. */","export function sparkline(values: number[]): string {","  if (values.length === 0) return '';","  const blocks = '▁▂▃▄▅▆▇█';","  const min = Math.min(...values);","  const max = Math.max(...values);","  const span = max - min;","  return values","    .map((value) =\u003e {","      // A flat series is flat, not noise: pin it to the middle rather than","      // amplifying floating-point dust into a mountain range.","      if (span \u003c 1e-9) return blocks[3];","      const index = Math.round(((value - min) / span) * (blocks.length - 1));","      return blocks[index];","    })","    .join('');","}","","export interface TrendSummary {","  label: string;","  values: number[];","  first: number;","  last: number;","  /** Positive means the number grew. */","  delta: number;","  /** True when growth is the bad direction for this metric. */","  growthIsBad: boolean;","}","","export function summarise(points: HistoryPoint[]): TrendSummary[] {","  const series: Array\u003c[string, (p: HistoryPoint) =\u003e number, boolean]\u003e = [","    ['dead lines', (p) =\u003e p.deadLoc, true],","    ['duplicated lines', (p) =\u003e p.duplicateLoc, true],","    ['load-bearing %', (p) =\u003e p.loadBearing, false],","    ['total lines', (p) =\u003e p.loc, false],","  ];","","  return series.map(([label, pick, growthIsBad]) =\u003e {","    const values = points.map(pick);","    const first = values[0] ?? 0;","    const last = values[values.length - 1] ?? 0;","    return { label, values, first, last, delta: last - first, growthIsBad };","  });","}",""]},{"path":"src/analysis/ignores.ts","loc":198,"findings":[],"symbols":[{"id":"src/analysis/ignores.ts#Ignore","name":"Ignore","kind":"interface","line":20,"loc":11,"exported":true,"usedBy":[{"file":"src/analysis/ignores.ts","line":35,"name":"IgnoreResult"},{"file":"src/analysis/ignores.ts","line":58,"name":"applyIgnores"},{"file":"src/analysis/ignores.ts","line":93,"name":"parse"},{"file":"src/analysis/ignores.ts","line":136,"name":"filter"}],"usedByCount":4,"reaches":[{"file":"src/types.ts","line":107,"name":"FindingKind"}],"reachesCount":1,"findings":[]},{"id":"src/analysis/ignores.ts#IgnoreResult","name":"IgnoreResult","kind":"interface","line":32,"loc":9,"exported":true,"usedBy":[{"file":"src/analysis/ignores.ts","line":56,"name":"applyIgnores"},{"file":"src/api.ts","line":121,"name":"scan"}],"usedByCount":2,"reaches":[{"file":"src/types.ts","line":111,"name":"Finding"},{"file":"src/analysis/ignores.ts","line":20,"name":"Ignore"}],"reachesCount":2,"findings":[]},{"id":"src/analysis/ignores.ts#DIRECTIVE","name":"DIRECTIVE","kind":"variable","line":43,"loc":1,"exported":false,"usedBy":[{"file":"src/analysis/ignores.ts","line":97,"name":"parse"}],"usedByCount":1,"reaches":[],"reachesCount":0,"findings":[]},{"id":"src/analysis/ignores.ts#KINDS","name":"KINDS","kind":"variable","line":45,"loc":10,"exported":false,"usedBy":[{"file":"src/analysis/ignores.ts","line":103,"name":"parse"}],"usedByCount":1,"reaches":[{"file":"src/types.ts","line":107,"name":"FindingKind"}],"reachesCount":1,"findings":[]},{"id":"src/analysis/ignores.ts#applyIgnores","name":"applyIgnores","kind":"function","line":56,"loc":36,"exported":true,"usedBy":[{"file":"src/api.ts","line":118,"name":"scan"}],"usedByCount":1,"reaches":[{"file":"src/types.ts","line":111,"name":"Finding"},{"file":"src/types.ts","line":69,"name":"CodeGraph"},{"file":"src/analysis/ignores.ts","line":32,"name":"IgnoreResult"}, ns in review. A comment"," * travels with the declaration and shows up in the diff that adds it."," *"," * The rules keep it from becoming a dumping ground:"," *   - a reason is required; without one the comment does nothing and is reported"," *   - it names the kinds it hides, so a real duplicate on the same function still shows"," *   - it covers the next declaration only, never a file or a block"," *   - one that no longer hides anything is reported, so it gets deleted"," *   - the number in force is a CI budget line, so it can only grow on purpose"," */","export interface Ignore {","  file: string;","  /** Where the comment is. */","  line: number;","  /** The lines it covers: the declaration, and its decorators. */","  targets: number[];","  kinds: FindingKind[];","  reason: string;","  /** Hid at least one finding this run. */","  used: boolean;","}","","export interface IgnoreResult {","  findings: Finding[];","  /** Comments that hid something. */","  applied: Ignore[];","  /** Well-formed comments that hid nothing: the finding went away. */","  stale: Ignore[];","  /** Comments missing a reason or naming no known kind. They hide nothing. */","  malformed: Ignore[];","}","","/** The comment must open where it stands: `\\`// instantiate-ignore\\`` quoted in prose is not one. */","const DIRECTIVE = /(?:^|\\s)(?:\\/\\/|#|\\/\\*|\u003c!--)\\s*instantiate-ignore\\b(.*)$/;","","const KINDS: Record\u003cstring, FindingKind[]\u003e = {","  dead: ['dead', 'orphan-file'],","  duplicate: ['duplicate'],","  dupes: ['duplicate'],","  drift: ['drift'],","  conflict: ['contradiction'],","  conflicts: ['contradiction'],","  contradiction: ['contradiction'],","  unfinished: ['unfinished'],","};","","export function applyIgnores(findings: Finding[], graph: CodeGraph): IgnoreResult {","  const files = new Set([...graph.files.keys(), ...findings.map((f) =\u003e f.file)]);","  const all: Ignore[] = [];","  const malformed: Ignore[] = [];","","  for (const file of files) {","    let text: string;","    try {","      text = readFileSync(join(graph.root, file), 'utf8');","    } catch {","      continue;","    }","    if (!text.includes('instantiate-ignore')) continue;","    for (const ignore of parse(file, text)) {","      if (ignore.kinds.length === 0 || !ignore.reason) malformed.push(ignore);","      else all.push(ignore);","    }","  }","","  const covering = (kind: FindingKind, file: string, line: number): Ignore | undefined =\u003e","    all.find((i) =\u003e i.file === file \u0026\u0026 i.kinds.includes(kind) \u0026\u0026 i.targets.includes(line));","  const lineOf = (id: string): number | undefined =\u003e graph.symbols.get(id)?.line;","","  const kept: Finding[] = [];","  for (const finding of findings) {","    const result = filter(finding, covering, lineOf);","    if (result) kept.push(result);","  }","","  return {","    findings: kept,","    applied: all.filter((i) =\u003e i.used),","    stale: all.filter((i) =\u003e !i.used),","    malformed,","  };","}","","function parse(file: string, text: string): Ignore[] {","  const lines = text.split('\\n');","  const out: Ignore[] = [];","  lines.forEach((raw, index) =\u003e {","    const match = DIRECTIVE.exec(raw);","    if (!match) return;","    const body = match[1].replace(/\\s*(\\*\\/|--\u003e)\\s*$/, '');","    const colon = body.indexOf(':');","    const names = (colon === -1 ? body : body.slice(0, colon)).split(/[\\s,]+/).filter(Boolean);","    const reason = colon === -1 ? '' : body.slice(colon + 1).trim();","    const kinds = [...new Set(names.flatMap((n) =\u003e KINDS[n.toLowerCase()] ?? []))];","    // Unknown words are a typo, not a wish to hide everything.","    const valid = names.length \u003e 0 \u0026\u0026 names.every((n) =\u003e KINDS[n.toLowerCase()]);","","    const before = raw.slice(0, match.index).trim();","    const targets = before ? [index + 1] : following(lines, index);","    out.push({ file, line: index + 1, targets, kinds: valid ? kinds : [], reason, used: false });","  });","  return out;","}","","/**"," * The next declaration: its decorators and the line they sit on. Blank lines"," * and further comments between are skipped, so an ignore can sit above a"," * docblock."," */","function following(lines: string[], index: number): number[] {","  const targets: number[] = [];","  for (let i = index + 1; i \u003c lines.length; i++) {","    const line = lines[i].trim();","    if (!line || /^(\\/\\/|#|\\/\\*|\\*)/.test(line)) {","      if (targets.length) break;","      continue;","    }","    targets.push(i + 1);","    if (!line.startsWith('@')) break;","  }","  return targets;","}","","/** The finding with the ignored parts taken out, or nothing when nothing is left. */","function filter(","  finding: Finding,","  covering: (kind: FindingKind, file: string, line: number) =\u003e Ignore | undefined,","  lineOf: (id: string) =\u003e number | undefined,","): Finding | undefined {","  const hit = (file: string, line: number | undefined): boolean =\u003e {","    if (line === undefined) return false;","    const ignore = covering(finding.kind, file, line);","    if (ignore) ignore.used = true;","    return !!ignore;","  };","","  switch (finding.kind) {","    case 'orphan-file': {","      // Vouching for one symbol in the file vouches for the file: it is loaded.","      const symbols = (finding.evidence?.symbols ?? []) as Array\u003c{ line: number }\u003e;","      return symbols.some((s) =\u003e hit(finding.file, s.line)) ? undefined : finding;","    }","","    case 'duplicate': {","      // One copy may be deliberate; the others are still copies of each other.","      const members = (finding.evidence?.members ?? []) as Array\u003c{ id: string; file: string; line: number; loc: number }\u003e;","      const remaining = members.filter((m) =\u003e !hit(m.file, m.line));","      if (remaining.length === members.length) return finding;","      if (remaining.length \u003c 2) return undefined;","      const loc = remaining","        .m
