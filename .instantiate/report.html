th":"src/index/treesitter.ts","count":9},{"path":"src/config.ts","count":5}],"marks":[],"source":["import type { Node, Tree } from 'web-tree-sitter';","import { readFileSync, existsSync } from 'node:fs';","import { relative } from 'node:path';","import type { CodeSymbol, DynamicSite, Edge, FileRecord, SymbolKind } from '../types.js';","import { record as recordSymbol, recordModule, symbolId, moduleId } from './symbol.js';","import type { Config } from '../config.js';","import { fileRecord, parserFor, type Backend, type LanguageGraph } from './treesitter.js';","","/**"," * Python, through tree-sitter."," *"," * There is no type checker here, so resolution is by name and scope rather than"," * by type. That is weaker than the TypeScript indexer and the analyses are told"," * so: where a call could mean several things, an edge is emitted to each"," * candidate. Over-approximating costs a missed finding; under-approximating"," * costs a false \"this is dead\", and trust is far harder to win back than a"," * finding is to re-run."," */","","interface FileIndex {","  file: string;","  tree: Tree;","  source: string;","  /** Module-level name -\u003e symbol id, for resolving a bare call. */","  locals: Map\u003cstring, string\u003e;","  /** Imported alias -\u003e module path, for resolving across files. */","  imports: Map\u003cstring, { module: string; name?: string }\u003e;","  /** Class name -\u003e (method name -\u003e symbol id). */","  classes: Map\u003cstring, Map\u003cstring, string\u003e\u003e;","  /** Class name -\u003e the names it inherits from. */","  bases: Map\u003cstring, string[]\u003e;","}","","export const python: Backend = {","  name: 'python',","  globs: (config) =\u003e config.python,","  build: buildPythonGraph,","};","","async function buildPythonGraph(config: Config, files: string[]): Promise\u003cLanguageGraph\u003e {","  const p = await parserFor('python');","  const symbols = new Map\u003cstring, CodeSymbol\u003e();","  const edges: Edge[] = [];","  const fileRecords = new Map\u003cstring, FileRecord\u003e();","  const sources = new Map\u003cstring, string\u003e();","  const indexes: FileIndex[] = [];","  const scripts: string[] = [];","","  // Pass one: declare everything, so any edge has something to point at.","  for (const absolute of files) {","    let source: string;","    try {","      source = readFileSync(absolute, 'utf8');","    } catch {","      continue;","    }","    const file = relative(config.root, absolute).split('\\\\').join('/');","    const tree = p.parse(source);","    if (!tree) continue;","","    fileRecords.set(file, fileRecord(file, source));","","    sources.set(file, source.replace(/#[^\\n]*/g, ''));","","    // `if __name__ == \"__main__\":` is Python's way of saying \"this file is run\".","    if (/if\\s+__name__\\s*==\\s*['\"]__main__['\"]/.test(source)) scripts.push(file);","","    const index: FileIndex = {","      file,","      tree,","      source,","      locals: new Map(),","      imports: new Map(),","      classes: new Map(),","      bases: new Map(),","    };","    declareModule(index, symbols);","    declare(tree.rootNode, index, symbols);","    collectImports(tree.rootNode, index);","    indexes.push(index);","  }","","  // A method name may belong to any class, since `obj.method()` says nothing","  // about obj's type without inference.","  const methodsByName = new Map\u003cstring, string[]\u003e();","  for (const index of indexes) {","    for (const methods of index.classes.values()) {","      for (const [name, id] of methods) {","        const list = methodsByName.get(name);","        if (list) list.push(id);","        else methodsByName.set(name, [id]);","      }","    }","  }","","  const byModule = new Map(indexes.map((i) =\u003e [moduleName(i.file), i]));","","  // Pass two: connect.","  for (const index of indexes) {","    connect(index.tree.rootNode, index, symbols, edges, byModule, methodsByName, config);","  }","","  const dynamicSites: DynamicSite[] = [];","  for (const index of indexes) {","    connectDynamic(index.file, sources.get(index.file) ?? '', symbols, edges, byModule, methodsByName, dynamicSites);","  }","","  return { sources, symbols, edges, files: fileRecords, scripts, dynamicSites };","}","","/** `pkg/sub/mod.py` -\u003e `pkg.sub.mod`, which is how Python names it. */","/**"," * Reflection, read from the text rather than the tree: the patterns are few"," * and fixed, and each one only ever adds edges or records a site."," *"," * - `getattr(obj, \"name\")` names a member with a string; it is a call to every"," *   method of that name, exactly like `obj.name`."," * - `import_module(f\"app.plugins.{name}\")` has a fixed prefix, and every module"," *   under it is one this may load."," * - Anything else computed — `getattr(obj, name)`, `globals()[name]`, `eval` —"," *   is recorded as a place the graph cannot follow."," */","function connectDynamic(","  file: string,","  source: string,","  symbols: Map\u003cstring, CodeSymbol\u003e,","  edges: Edge[],","  byModule: Map\u003cstring, FileIndex\u003e,","  methodsByName: Map\u003cstring, string[]\u003e,","  sites: DynamicSite[],","): void {","  const from = moduleId(file);","  const lines = source.split('\\n');","  lines.forEach((text, i) =\u003e {","    const line = i + 1;","    const site = (kind: DynamicSite['kind'], match: string): void =\u003e {","      sites.push({ file, line, kind, text: match.trim().slice(0, 120) });","    };","","    for (const m of text.matchAll(/\\b(?:getattr|hasattr)\\(\\s*[^,]+?,\\s*([^,)]+)/g)) {","      const literal = /^(['\"])([A-Za-z_]\\w*)\\1$/.exec(m[1].trim());","      if (!literal) {","        site('reflection', m[0]);","        continue;","      }","      for (const id of methodsByName.get(literal[2]) ?? []) {","        edges.push({ from, to: id, kind: 'calls', file, line });","      }","    }","","    for (const m of text.matchAll(/\\b(?:import_module|__import__)\\(\\s*([^,)]+)/g)) {","      const argument = m[1].trim();","      if (/^(['\"])[\\w.]+\\1$/.test(argument)) continue; // A literal is an ordinary import.","      const prefix =","        /^f(['\"])([\\w.]+)\\{/.exec(argument)?.[2] ?? /^(['\"])([\\w.]+)\\1\\s*\\+/.exec(argument)?.[2];","      const targets = prefix","        ? [...byModule.entries()].filter(([name]) =\u003e `.${name}`.includes(`.${prefix}`) \u0026\u0026 name !== prefix.replace(/\\.$/, ''))","        : [];","      if (targets.length === 0) {","        site('import', m[0]);","        continue;","      }","      for (const [, target] of targets) {","        edges.push({ from, to: moduleId(target.file), kind: 'imports', file, line });","        for (const symbol of symbols.values()) {","          // Loading a module by name is followed by using what it defines.","          if (symbol.file === target.file \u0026\u0026 symbol.kind !== 'module' \u0026\u0026 !symbol.id.split('#')[1].includes('.')) {","            edges.push({ from, to: symbol.id, kind: 'references', file, line });","          }","        }","      }","    }","","    for (const m of text.matchAll(/\\b(?:globals|locals|vars)\\(\\)\\s*\\[[^\\]]*\\]|\\b(?:eval|exec)\\([^)]*\\)?/g)) {","      site('reflection', m[0]);","    }","  });","}","","function moduleName(file: string): string {","  return file","    .replace(/\\.py$/, '')","    .replace(/\\/__init__$/, '')","    .split('/')","    .filter((p) =\u003e p !== 'src')","    .join('.');","}","","function declareModule(index: FileIndex, symbols: Map\u003cstring, CodeSymbol\u003e): void {","  recordModule(symbols, index.file, index.source.split('\\n').length);","}","","function declare(","  node: Node,","  index: FileIndex,","  symbols: Map\u003cstring, CodeSymbol\u003e,","  className?: string,","): void {","  for (let i = 0; i \u003c node.childCount; i++) {","    const child = node.child(i);","    if (!child) continue;","","    if (child.type === 'class_definition') {","      const name = child.childForFieldName('name')?.text;","      if (name) {","        record(child, name, 'class', index, symbols);","        index.locals.set(name, symbolId(index.file, name));","        const methods = new Map\u003cstring, string\u003e();","        index.classes.set(name, methods);","        index.bases.set(name, baseNames(child));","        const body = child.childForFieldName('body');","        if (body) declareMethods(body, name, index, symbols, methods);","      }","      continue;","    }","","    if (child.type === 'function_definition') {","      const name = child.childForFieldName('name')?.text;","      if (name) {","        record(child, name, className ? 'method' : 'function', index, symbols, className);","        if (!className) index.locals.set(name, symbolId(index.file, name));","      }","      continue;","    }","","    // A module-level assignment is a name other modules can import.","    if (child.type === 'expression_statement' \u0026\u0026 node.type === 'module') {","      const assignment = child.child(0);","      if (assignment?.type === 'assignment') {","        const left = assignment.childForFieldName('left');","        if (left?.type === 'identifier') {","          record(assignment, left.text, 'variable', index, symbols);","          index.locals.set(left.text, symbolId(index.file, left.text));","        }","      }","      continue;","    }","","    // Decorated definitions wrap the real one.","    if (child.type === 'decorated_definition') {","      declare(child, index, symbols, className);","      continue;","    }","","    if (child.type === 'if_statement' || child.type === 'try_statement') {","      declare(child, index, symbols, className);","    }","  }","}","","/** The names in `class Option(Parameter):`. */","function baseNames(node: Node): string[] {","  const args = node.childForFieldName('superclasses');","  if (!args) return [];","  const out: string[] = [];","  for (let i = 0; i \u003c args.namedChildCount; i++) {","    const child = args.namedChild(i);","    if (!child) continue;","    // `class X(Base)` and `class X(module.Base)` both name a base.","    const text = child.type === 'attribute' ? child.text.split('.').pop()! : child.text;","    if (/^[A-Za-z_]\\w*$/.test(text)) out.push(text);","  }","  return out;","}","","function declareMethods(","  body: Node,","  className: string,","  index: FileIndex,","  symbols: Map\u003cstring, CodeSymbol\u003e,","  methods: Map\u003cstring, string\u003e,","): void {","  for (let i = 0; i \u003c body.childCount; i++) {","    const child = body.child(i);","    if (!child) continue;","    const definition = child.type === 'decorated_definition' ? child.childForFieldName('definition') : child;","    if (definition?.type === 'function_definition') {","      const name = definition.childForFieldName('name')?.text;","      if (name) {","        record(definition, name, 'method', index, symbols, className);","        methods.set(name, symbolId(index.file, name, className));","      }","    }","  }","}","","// instantiate-ignore duplicate: one per language by design, each reading its own syntax tree","function record(","  node: Node,","  name: string,","  kind: SymbolKind,","  index: FileIndex,","  symbols: Map\u003cstring, CodeSymbol\u003e,","  container?: string,","): void {","  recordSymbol(","    symbols,","    {","      name,","      kind,","      file: index.file,","      line: node.startPosition.row + 1,","      endLine: node.endPosition.row + 1,","      // Python has no export keyword; a leading underscore is the convention","      // for \"internal\", and everything else is part of the module's surface.","      exported: !name.startsWith('_'),","      decorators: decoratorsOf(node),","      body: normaliseBody(node.text),","      signature: signatureOf(node),","    },","    container,","  );","}","","/** `@app.route(\"/\")` -\u003e `app.route`, `@pytest.fixture` -\u003e `pytest.fixture`. */","function decoratorsOf(node: Node): string[] | undefined {","  const wrapper = node.parent;","  if (wrapper?.type !== 'decorated_definition') return undefined;","  const out: string[] = [];","  for (let i = 0; i \u003c wrapper.namedChildCount; i++) {","    const child = wrapper.namedChild(i);","    if (child?.type !== 'decorator') continue;","    const name = child.text.replace(/^@\\s*/, '').split('(')[0].trim();","    if (name) out.push(name);","  }","  return out.length ? out : undefined;","}","","/**"," * Strip docstrings as well as comments."," *"," * A docstring is prose, not behaviour, and Python puts a great deal of it"," * inside the function body. Left in, it dominated both similarity signals: two"," * unrelated methods with long typed signatures and thorough documentation"," * scored 81% on their prose alone, which is the opposite of what this measures."," */","function normaliseBody(text: string): string {","  return text","    .replace(/'''[\\s\\S]*?'''/g, ' ')","    .replace(/\"\"\"[\\s\\S]*?\"\"\"/g, ' ')","    .replace(/#[^\\n]*/g, ' ')","    .replace(/\\s+/g, ' ')","    .trim();","}","","function signatureOf(node: Node): string {","  const params = node.childForFieldName('parameters');","  if (!params) return node.type;","  const names: string[] = [];","  for (let i = 0; i \u003c params.namedChildCount; i++) {","    const child = params.namedChild(i);","    if (child) names.push(child.type === 'identifier' ? 'any' : child.type);","  }","  return `(${names.join(',')})`;","}","","function collectImports(root: Node, index: FileIndex): void {","  const visit = (node: Node): void =\u003e {","    if (node.type === 'import_from_statement') {","      const moduleNode = node.childForFieldName('module_name');","      const module = moduleNode ? resolveRelative(moduleNode.text, index.file) : '';","      for (let i = 0; i \u003c node.namedChildCount; i++) {","        const child = node.namedChild(i);","        if (!child || child === moduleNode) continue;","        if (child.type === 'dotted_name' || child.type === 'identifier') {","          index.imports.set(child.text.split('.').pop()!, { module, name: child.text });","        } else if (child.type === 'aliased_import') {","          const original = child.childForFieldName('name')?.text;","          const alias = child.childForFieldName('alias')?.text;","          if (original \u0026\u0026 alias) index.imports.set(alias, { module, name: original });","        } else if (child.type === 'wildcard_import') {","          index.imports.set('*', { module });","        }","      }","    } else if (node.type === 'import_statement') {","      for (let i = 0; i \u003c node.namedChildCount; i++) {","        const child = node.namedChild(i);","        if (!child) continue;","        if (child.type === 'dotted_name') {","          index.imports.set(child.text.split('.').pop()!, { module: child.text });","        } else if (child.type === 'aliased_import') {","          const original = child.childForFieldName('name')?.text;","          const alias = child.childForFieldName('alias')?.text;","          if (original \u0026\u0026 alias) index.imports.set(alias, { module: original });","        }","      }","    }","    for (let i = 0; i \u003c node.childCount; i++) {","      const child = node.child(i);","      if (child) visit(child);","    }","  };","  visit(root);","}","","/** `from .sibling import x` and `from ..pkg import y` are relative to this file. */","function resolveRelative(module: string, file: string): string {","  if (!module.startsWith('.')) return module;","  const up = module.match(/^\\.+/)![0].length;","  const parts = file.split('/').slice(0, -1);","  const base = parts.slice(0, parts.length - (up - 1)).filter((p) =\u003e p !== 'src');","  const rest = module.slice(up);","  return [...base, ...(rest ? rest.split('.') : [])].join('.');","}","","function connect(","  root: Node,","  index: FileIndex,","  symbols: Map\u003cstring, CodeSymbol\u003e,","  edges: Edge[],","  byModule: Map\u003cstring, FileIndex\u003e,","  methodsByName: Map\u003cstring, string[]\u003e,","  config: Config,","): void {","  const ownModuleId = moduleId(index.file);","","  // `__getattr__` at module level is Python's module attribute hook, and","  // `__all__` and friends are read by the import machinery. Nothing names them.","  for (const [name, id] of index.locals) {","    if (name.startsWith('__') \u0026\u0026 name.endsWith('__')) {","      edges.push({ from: ownModuleId, to: id, kind: 'calls', file: index.file, line: 1 });","    }","  }","","  // A reached base method reaches every override of it.","  //","  // `self.consume_value()` in `Parameter` resolves to `Parameter.consume_value`,","  // but what runs for an `Option` is the override — which nothing else names,","  // so every subclass implementation looked unreachable.","  for (const [className, bases] of index.bases) {","    const own = index.classes.get(className);","    if (!own) continue;","    for (const baseName of bases) {","      // `class TextWrapper(textwrap.TextWrapper)` shadows its base's name, so a","      // lookup finds the subclass itself and concludes the base is local when","      // it is in fact the standard library's.","      const candidates = allClasses(byModule, baseName).filter((m) =\u003e m !== own);","      for (const candidate of candidates) {","        for (const [methodName, baseId] of candidate) {","          const override = own.get(methodName);","          if (override \u0026\u0026 override !== baseId) {","            edges.push({ from: baseId, to: override, kind: 'calls', file: index.file, line: 1 });","          }","        }","      }","      // A base outside this repository — `textwrap.TextWrapper` — still calls","      // the override, so an override of an unknown base is reached by its class.","      if (candidates.length === 0) {","        const classId = symbolId(index.file, className);","        for (const methodId of own.values()) {","          edges.push({ from: classId, to: methodId, kind: 'calls', file: index.file, line: 1 });","        }","      }","    }","  }","","  // The interpreter calls dunder methods itself: `__call__` on `auth(request)`,","  // `__enter__` on a `with` block, `__iter__` on a loop. Nothing in the source","  // names them, so a reachable class must be taken to reach its own.","  for (const [className, methods] of index.classes) {","    const classId = symbolId(index.file, className);","    for (const [name, methodId] of methods) {","      if (name.startsWith('__') \u0026\u0026 name.endsWith('__')) {","        edges.push({ from: classId, to: methodId, kind: 'calls', file: index.file, line: 1 });","      }","    }","  }","","  // Importing a module runs it, and names what it brings in.","  for (const [alias, imported] of index.imports) {","    const target = importedModule(imported, alias, byModule);","    if (!target) continue;","    edges.push({ from: ownModuleId, to: moduleId(target.file), kind: 'imports', file: index.file, line: 1 });","","    const wanted = alias === '*' ? [...target.locals.keys()] : [imported.name?.split('.').pop() ?? alias];","    for (const name of wanted) {","      const id = target.locals.get(name);","      if (id) edges.push({ from: ownModuleId, to: id, kind: 'references', file: index.file, line: 1 });","    }","  }","","  const visit = (node: Node, enclosing: string, className?: string): void =\u003e {","    let scope = enclosing;","    let scopeClass = className;","","    // Only descend into a scope we actually recorded. A nested `def` — the","    // inner function a decorator factory returns — is not a symbol, so keying","    // edges on its name attributed them to something that does not exist, and","    // everything it called looked unreachable.","    if (node.type === 'class_definition') {","      const name = node.childForFieldName('name')?.text;","      const candidate = name ? symbolId(index.file, name) : undefined;","      if (name \u0026\u0026 candidate \u0026\u0026 symbols.has(candidate)) {","        scope = candidate;","        scopeClass = name;","      }","    } else if (node.type === 'function_definition') {","      const name = node.childForFieldName('name')?.text;","      const candidate = name ? symbolId(index.file, name, className) : undefined;","      if (candidate \u0026\u0026 symbols.has(candidate)) scope = candidate;","    } else if (node.type === 'call') {","      const callee = node.childForFieldName('function');","      if (callee) {","        for (const target of resolveCall(callee, index, byModule, methodsByName, scopeClass)) {","          edges.push({","            from: scope,","            to: target,","            kind: 'calls',","            file: index.file,","            line: node.startPosition.row + 1,","          });","        }","      }","    } else if (node.type === 'attribute') {","      // `types.OptionHelpExtra` in a type annotation names a symbol in another","      // module without calling it, so the call path never saw it.","      const object = node.childForFieldName('object');","      const attribute = node.childForFieldName('attribute')?.text;","      if (object?.type === 'identifier' \u0026\u0026 attribute) {","        const imported = index.imports.get(object.text);","        const target = imported ? importedModule(imported, object.text, byModule) : undefined;","        const id = target?.locals.get(attribute);","        if (id \u0026\u0026 id !== scope) {","          edges.push({","            from: scope,","            to: id,","            kind: 'references',","            file: index.file,","            line: node.startPosition.row + 1,","          });","        }","      }","    }","","    if (node.type === 'attribute' \u0026\u0026 scopeClass) {","      // `self.handler` used as a value, not called: `register_hook(\"x\", self.handler)`","      // passes the method somewhere that will invoke it later. Without this edge","      // the method, and everything it reaches, looks unreachable.","      const object = node.childForFieldName('object');","      const attribute = n   build: buildSwiftGraph,","};","","/**"," * What well-known protocols require, so conforming to one keeps only those"," * members rather than everything. A superclass or protocol not listed here,"," * and not declared in this repository, keeps every non-private member: its"," * requirements are unknown, and UIKit alone calls hundreds of methods by name."," */","/**"," * Types the system finds by themselves: nothing constructs an App Intent, a"," * widget or a preview; the OS enumerates them from build metadata."," */","const DISCOVERED = new Set([","  'AppIntent', 'AppShortcutsProvider', 'AppEntity', 'AppEnum', 'EntityQuery', 'Widget', 'WidgetBundle',","  'TimelineProvider', 'IntentTimelineProvider', 'AppIntentTimelineProvider', 'ControlWidget',","  'PreviewProvider', 'XCTestCase', 'NSExtensionRequestHandling', 'Tip',","]);","","const KNOWN_REQUIREMENTS: Record\u003cstring, string[]\u003e = {","  Equatable: ['=='],","  Hashable: ['hash', '=='],","  Comparable: ['\u003c', '=='],","  Identifiable: ['id'],","  CustomStringConvertible: ['description'],","  CustomDebugStringConvertible: ['debugDescription'],","  LocalizedError: ['errorDescription', 'failureReason', 'recoverySuggestion', 'helpAnchor'],","  Error: [],","  Sendable: [],","  Codable: ['encode', 'init'],","  Encodable: ['encode'],","  Decodable: ['init'],","  Sequence: ['makeIterator'],","  IteratorProtocol: ['next'],","  Collection: ['startIndex', 'endIndex', 'index', 'subscript'],","  CaseIterable: ['allCases'],","  RawRepresentable: ['rawValue', 'init'],","  ExpressibleByStringLiteral: ['init'],","  ExpressibleByIntegerLiteral: ['init'],","  View: ['body'],","  App: ['body'],","  Scene: ['body'],","  ObservableObject: [],","};","","async function buildSwiftGraph(config: Config, files: string[]): Promise\u003cLanguageGraph\u003e {","  const parser = await parserFor('swift');","  const symbols = new Map\u003cstring, CodeSymbol\u003e();","  const edges: Edge[] = [];","  const records = new Map\u003cstring, FileRecord\u003e();","  const sources = new Map\u003cstring, string\u003e();","  const dynamicSites: DynamicSite[] = [];","","  /** Top-level name -\u003e ids: types, functions, globals. */","  const names = new Map\u003cstring, string[]\u003e();","  /** Member name -\u003e ids, for `x.member` and implicit-self calls. */","  const members = new Map\u003cstring, string[]\u003e();","  /** Type name -\u003e its member ids, gathered across the type and all its extensions. */","  const typeMembers = new Map\u003cstring, Array\u003c{ id: string; name: string; isPrivate: boolean; override: boolean }\u003e\u003e();","  /** Type name -\u003e what it conforms to or inherits from, across its declaration and extensions. */","  const conformances = new Map\u003cstring, Set\u003cstring\u003e\u003e();","  /** Member names some protocol in this repository requires. */","  const required = new Set\u003cstring\u003e();","  /** Declaration node id -\u003e symbol id, to attribute references to their owner. */","  const owners = new Map\u003cnumber, string\u003e();","  const trees: Array\u003c{ file: string; root: Node }\u003e = [];","  const roots: string[] = [];","","  const add = (map: Map\u003cstring, string[]\u003e, key: string, id: string): void =\u003e {","    const list = map.get(key) ?? [];","    if (!list.includes(id)) list.push(id);","    map.set(key, list);","  };","","  for (const absolute of files) {","    let text: string;","    try {","      text = readFileSync(absolute, 'utf8');","    } catch {","      continue;","    }","    const tree = parser.parse(text);","    if (!tree) continue;","    const file = relative(config.root, absolute).split('\\\\').join('/');","    records.set(file, fileRecord(file, text));","    sources.set(file, stripCStyleComments(text));","    recordModule(symbols, file, text.split('\\n').length);","    trees.push({ file, root: tree.rootNode });","","    const declareType = (node: Node, outer?: string): void =\u003e {","      const nameNode = node.ch ature,","  });","  return id;","}","","/** The symbol standing for a file itself. See the indexers for why it exists. */","export function recordModule(","  symbols: Map\u003cstring, CodeSymbol\u003e,","  file: string,","  lines: number,","): string {","  const id = moduleId(file);","  symbols.set(id, {","    id,","    name: file,","    kind: 'module',","    file,","    line: 1,","    endLine: lines,","    // Importing a module runs it, so it is reachable from outside by definition.","    exported: true,","    // Lines belong to the declarations inside, not to the module wrapper, or","    // every file would be counted twice in every total.","    loc: 0,","    body: '',","    signature: 'module',","  });","  return id;","}",""]},{"path":"src/index/treesitter.ts","loc":82,"findings":[],"symbols":[{"id":"src/index/treesitter.ts#LanguageGraph","name":"LanguageGraph","kind":"interface","line":11,"loc":14,"exported":true,"usedBy":[{"file":"src/index/treesitter.ts","line":34,"name":"Backend"},{"file":"src/index/python.ts","line":40,"name":"buildPythonGraph"},{"file":"src/index/go.ts","line":54,"name":"buildGoGraph"},{"file":"src/index/swift.ts","line":73,"name":"buildSwiftGraph"},{"file":"src/api.ts","line":198,"name":"mergeBackends"}],"usedByCount":5,"reaches":[{"file":"src/types.ts","line":13,"name":"CodeSymbol"},{"file":"src/types.ts","line":53,"name":"Edge"},{"file":"src/types.ts","line":61,"name":"FileRecord"},{"file":"src/types.ts","line":99,"name":"DynamicSite"}],"reachesCount":4,"findings":[]},{"id":"src/index/treesitter.ts#Backend","name":"Backend","kind":"interface","line":30,"loc":6,"exported":true,"usedBy":[{"file":"src/index/python.ts","line":34,"name":"python"},{"file":"src/index/go.ts","line":23,"name":"go"},{"file":"src/index/swift.ts","line":25,"name":"swift"},{"file":"src/index/backends.ts","line":7,"name":"BACKENDS"},{"file":"src/api.ts","line":194,"name":"mergeBackends"}],"usedByCount":5,"reaches":[{"file":"src/config.ts","line":6,"name":"Config"},{"fi l time, so each is loaded once, and only when a"," * repository actually contains that language."," */","export function parserFor(grammar: string): Promise\u003cParser\u003e {","  let parser = parsers.get(grammar);","  if (!parser) {","    parser = (async () =\u003e {","      ready ??= Parser.init();","      await ready;","      // Two levels up from src/index or dist/index is the package root.","      const path = fileURLToPath(new URL(`../../grammars/tree-sitter-${grammar}.wasm`, import.meta.url));","      const instance = new Parser();","      instance.setLanguage(await Language.load(path));","      return instance;","    })();","    parsers.set(grammar, parser);","  }","  return parser;","}","","/** What every indexer records about a file it read. */","export function fileRecord(file: string, text: string): FileRecord {","  return {","    path: file,","    loc: text.split('\\n').length,","    hash: createHash('sha1').update(text).digest('hex').slice(0, 16),","    indexedAt: Date.now(),","  };","}","","/**"," * C-style comments removed, line for line: a block comment becomes blanks so"," * every line number still matches the file. Go and Swift both use it."," */","export function stripCStyleComments(text: string): string {","  return text","    .replace(/\\/\\*[\\s\\S]*?\\*\\//g, (m) =\u003e m.replace(/[^\\n]/g, ' '))","    .replace(/\\/\\/[^\\n]*/g, '');","}",""]},{"path":"src/intent/command.ts","loc":172,"findings":[],"symbols":[{"id":"src/intent/command.ts#TEST_FILE","name":"TEST_FILE","kind":"variable","line":6,"loc":2,"exported":false,"usedBy":[{"file":"src/intent/command.ts","line":156,"name":"loadBearing"}],"usedByCount":1,"reaches":[],"reachesCount":0,"findings":[]},{"id":"src/intent/command.ts#USAGE","name":"USAGE","kind":"variable","line":9,"loc":10,"exported":false,"usedBy":[{"file":"src/intent/command.ts","line":67,"name":"runIntentCommand"}],"usedByCount":1,"reaches":[{"file":"src/util/term.ts","line":6,"name":"bold"}],"reachesCount":1,"findings":[]      if (records.length === 0) {","        console.log(`\\nNo intent records yet. ${cyan('instantiate intent draft')} proposes some.\\n`);","        return 0;","      }","      console.log('');","      for (const record of records) {","        const badge = record.status === 'confirmed' ? green('✓') : yellow('draft');","        console.log(`  ${badge} ${bold(record.symbol)}`);","        console.log(`      ${record.purpose}`);","        if (record.notFor) console.log(`      ${dim(`not for: ${record.notFor}`)}`);","      }","      console.log('');","      return 0;","    }","","    case 'show': {","      const record = store.get(rest[0]) ?? store.search(rest[0] ?? '', 1)[0];","      if (!record) {","        console.log(`\\nNo record for ${bold(rest[0] ?? '')}.\\n`);","        return 1;","      }","      console.log(`\\n${bold(record.symbol)}\\n  ${record.purpose}\\n  ${dim(`not for: ${record.notFor || '(unstated)'}`)}\\n  ${dim(record.status)}\\n`);","      return 0;","    }","","    case 'set': {","      const symbol = rest[0];","      const notForIndex = rest.indexOf('--not-for');","      const purpose = (notForIndex === -1 ? rest.slice(1) : rest.slice(1, notForIndex)).join(' ');","      const notFor = notForIndex === -1 ? '' : rest.slice(notForIndex + 1).join(' ');","      if (!symbol || !purpose) {","        console.error(USAGE);","        return 1;","      }","      // A record the human typed is confirmed by definition.","      store.set({ symbol, purpose, notFor, status: 'confirmed' });","      store.save();","      console.log(`${green('✓')} recorded`);","      return 0;","    }","","    case 'confirm': {","      if (!store.confirm(rest[0])) {","        console.error(`No draft for ${rest[0]}`);","        return 1;","      }","      store.save();","      console.log(`${green('✓')} confirmed`);","      return 0;","    }","","    case 'draft': {","      // `--limit` is stripped by the top-level parser before it reaches here,","      // so read the parsed value and fall back to scanning the raw arguments.","      const limitFlag = rest.indexOf('--limit');","      const limit = limitFlag === -1 ? (options.limit ?? 20) : Number(rest[limitFlag + 1]) || 20;","      const targets = loadBearing(result, limit).filter((s) =\u003e !store.get(s.symbol.id));","","      for (const { symbol, callers } of targets) {","        // A draft states what the code plainly does. The value is in the human","        // correcting it, which takes ten seconds and is the whole point: an","        // uncorrected draft is just the guesswork we are trying to remove.","        store.set({","          symbol: symbol.id,","          purpose: `${symbol.name}: ${describeShape(symbol)}. Used by ${callers} caller${callers === 1 ? '' : 's'}.`,","          notFor: '',","          status: 'draft',","        });","      }","      store.save();","      console.log(`\\n${green('✓')} drafted ${targets.length} record${targets.length === 1 ? '' : 's'}`);","      console.log(dim(`  Edit .instantiate/intent.json, then ${cyan('instantiate intent confirm \u003csymbol\u003e')}.`));","      console.log(dim('  A draft nobody confirms is worth nothing — that is the deal.\\n'));","      return 0;","    }","","    case 'gaps': {","      const gaps = loadBearing(result, 200).filter((s) =\u003e !store.get(s.symbol.id));","      console.log(`\\n${bold(`${gaps.length} load-bearing symbols with no recorded intent`)}\\n`);","      for (const { symbol, callers } of gaps.slice(0, options.limit ?? 25)) {","        console.log(`  ${bold(symbol.name.padEnd(30))} ${dim(`${symbol.file}:${symbol.line} · ${callers} callers`)}`);","      }","      console.log('');","      return 0;","    }","","    default:","      console.log(USAGE);","      return sub ? 1 : 0;","  }","}","","/**"," * Symbols where a wrong guess costs the most."," *"," * Not simply the most-referenced: every file in a project mentions its core"," * types and its logging helper, and neither is where an agent's assumption goes"," * wrong. What matters is how much behaviour hangs off a thing — how many"," * callers, weighted by how much it actually does — so a two-line colour helper"," * with sixty callers ranks below a sixty-line function with ten."," */","function loadBearing(result: ScanResult, limit: number): Array\u003c{ symbol: CodeSymbol; callers: number }\u003e {","  const callers = new Map\u003cstring, number\u003e();","  for (const edge of result.graph.edges) {","    callers.set(edge.to, (callers.get(edge.to) ?? 0) + 1);","  }","","  const weight = (symbol: CodeSymbol, count: number): number =\u003e","    count * Math.log2(symbol.loc + 2);","","  return [...result.graph.symbols.values()]","    .map((symbol) =\u003e ({ symbol, callers: callers.get(symbol.id) ?? 0 }))","    .filter(","      (s) =\u003e","        s.callers \u003e 0 \u0026\u0026","        s.symbol.kind !== 'module' \u0026\u0026","        // A one-liner carries no intent worth recording.","        s.symbol.loc \u003e= 4 \u0026\u0026","        // A test helper has many callers and no intent anyone needs written","        // down; it crowded out the library's own public surface.","        !TEST_FILE.test(s.symbol.file),","    )","    .sort(","      (a, b) =\u003e","        weight(b.symbol, b.callers) - weight(a.symbol, a.callers) ||","        a.symbol.id.localeCompare(b.symbol.id),","    )","    .slice(0, limit);","}","","function describeShape(symbol: CodeSymbol): string {","  if (symbol.kind === 'function' || symbol.kind === 'method') {","    return `a ${symbol.loc}-line ${symbol.kind} with signature ${symbol.signature}`;","  }","  return `a ${symbol.kind} declared over ${symbol.loc} lines`;","}",""]},{"path":"src/intent/store.ts","loc":82,"findings":[],"symbols":[{"id":"src/intent/store.ts#IntentStore","name":"IntentStore","kind":"class","line":13,"loc":69,"exported":true,"usedBy":[{"file":"src/intent/store.ts","line":18,"name":"constructor"},{"file":"src/intent/store.ts","line":23,"name":"load"},{"file":"src/intent/st e":"all"}],"reachesCount":2,"findings":[]}],"usedBy":[{"path":"src/intent/command.ts","count":9},{"path":"src/mcp/server.ts","count":7},{"path":"src/index/lookup.ts","count":4}],"uses":[{"path":"src/types.ts","count":10}],"marks":[],"source":["import { existsSync, mkdirSync, readFileSync, writeFileSync } from 'node:fs';","import { join } from 'node:path';","import type { IntentRecord } from '../types.js';","","/**"," * Per-symbol intent records: why a thing exists and what it is not for."," *"," * This is the half that code cannot express and humans rarely write down, which"," * is why an agent reaching for a helper guesses instead of reusing. Records live"," * beside the graph rather than in the source, and they are meant to be committed"," * and reviewed: they are the human contribution, not a derived artefact."," */","export class IntentStore {","  private readonly path: string;","  private records = new Map\u003cstring, IntentRecord\u003e();","","  constructor(private readonly root: string) {","    this.path = join(root, '.instantiate', 'intent.json');","    this.load();","  }","","  private load(): void {","    if (!existsSync(this.path)) return;","    try {","      const raw = JSON.parse(readFileSync(this.path, 'utf8')) as IntentRecord[];","      for (const record of raw) this.records.set(record.symbol, record);","    } catch {","      // A corrupt store must not stop a scan; it is an overlay, not the source.","    }","  }","","  save(): void {","    mkdirSync(join(this.root, '.instantiate'), { recursive: true });","    const sorted = [...this.records.values()].sort((a, b) =\u003e a.symbol.localeCompare(b.symbol));","    // Stable ordering keeps the diff readable, since this file is reviewed in PRs.","    writeFileSync(this.path, `${JSON.stringify(sorted, null, 2)}\\n`);","  }","","  get(symbol: string): IntentRecord | undefined {","    return this.records.get(symbol);","  }","","  set(record: Omit\u003cIntentRecord, 'updatedAt'\u003e): IntentRecord {","    const full: IntentRecord = { ...record, updatedAt: Date.now() };","    this.records.set(record.symbol, full);","    return full;","  }","","  confirm(symbol: string): IntentRecord | undefined {","    const record = this.records.get(symbol);","    if (!record) return undefined;","    record.status = 'confirmed';","    record.updatedAt = Date.now();","    return record;","  }","","  all(): IntentRecord[] {","    return [...this.records.values()];","  }","","  /**","   * Which symbols already claim a concept. This is what an agent should consult","   * before writing a new helper, and the only reliable way to stop the fourth","   * `formatDuration` being born.","   */","  search(query: string, limit = 5): IntentRecord[] {","    const words = query.toLowerCase().split(/\\W+/).filter(Boolean);","    if (words.length === 0) return [];","    return this.all()","      .map((record) =\u003e {","        const haystack = `${record.symbol} ${record.purpose} ${record.notFor}`.toLowerCase();","        const hits = words.filter((w) =\u003e haystack.includes(w)).length;","        // A confirmed record outranks a draft at equal relevance: it is trusted.","        return { record, score: hits + (record.status === 'confirmed' ? 0.5 : 0) };","      })","      .filter((r) =\u003e r.score \u003e 0)","      .sort((a, b) =\u003e b.score - a.score)","      .slice(0, limit)","      .map((r) =\u003e r.record);","  }","}",""]},{"path":"src/mcp/server.ts","loc":374,"findings":[],"symbols":[{"id":"src/mcp/server.ts#TOOLS","name":"TOOLS","kind":"variable","line":23,"loc":82,"exported":false,"usedBy":[{"file":"src/mcp/server.ts","line":126,"name":"runMcpServer"}],"usedByCount":1,"reaches":[],"reachesCount":0,"findings":[]},{"id":"src/mcp/server.ts#runMcpServer","name":"runMcpServer","kind":"function","line":106,"loc":48,"exported":true,"usedBy":[{"file":"src/cli.ts","line":111,"name":"main"}],"usedByCount":1,"reaches":[{"file":"src/api.ts","line":29,"name":"ScanResult"},{"file":"src/api.ts","line":3 -readable string\".',","        },","        signature: {","          type: 'string',","          description: 'Optional: the shape you have in mind, e.g. \"(ms: number) =\u003e string\".',","        },","      },","      required: ['description'],","    },","  },","  {","    name: 'find_symbol',","    description:","      'Where a symbol is declared, everything that calls it, and everything it reaches. ' +","      'Use this instead of grepping across files to understand what a change would break.',","    inputSchema: {","      type: 'object',","      properties: { name: { type: 'string', description: 'Symbol name or full id.' } },","      required: ['name'],","    },","  },","  {","    name: 'blast_radius',","    description:","      'Everything that transitively depends on a symbol. Call this before changing or ' +","      'deleting something, to see what else is affected.',","    inputSchema: {","      type: 'object',","      properties: {","        name: { type: 'string' },","        depth: { type: 'number', description: 'Hops to follow. Default 2.' },","      },","      required: ['name'],","    },","  },","  {","    name: 'list_concepts',","    description:","      'What this codebase is made of: the graph collapsed into a few dozen named groups. ' +","      'Use this to orient before working in an unfamiliar area.',","    inputSchema: { type: 'object', properties: {} },","  },","  {","    name: 'list_findings',","    description:","      'Current dead code, duplicate clusters, contradictions and convention drift, ranked. ' +","      'Use this to find the established convention in this codebase before adding code that ' +","      'picks a different one, and to see where the codebase already disagrees with itself.',","    inputSchema: {","      type: 'object',","      properties: {","        kind: { type: 'string', enum: ['all', 'dead', 'duplicate', 'drift', 'contradiction', 'unfinished'] },","        limit: { type: 'number' },","      },","    },","  },","  {","    name: 'get_intent',","    description:","      'The recorded intent for a symbol: why it exists and what it is explicitly not for. ' +","      'Read this before changing something, so a change does not quietly contradict the ' +","      'reason the code was written.',","    inputSchema: {","      type: 'object',","      properties: { symbol: { type: 'string' } },","      required: ['symbol'],","    },","  },","];","","export async function runMcpServer(root: string): Promise\u003cvoid\u003e {","  const server = new Server(","    { name: 'instantiate', version: '0.1.0' },","    { capabilities: { tools: {} } },","  );","","  // One scan on boot, refreshed lazily: an agent session asks many questions of","  // one codebase state, and re-indexing per call would make every answer slow.","  let cached: ScanResult | undefined;","  let scannedAt = 0;","  const MAX_AGE = 30_000;","","  const current = async (): Promise\u003cScanResult\u003e =\u003e {","    if (!cached || Date.now() - scannedAt \u003e MAX_AGE) {","      cached = await scan({ root });","      scannedAt = Date.now();","    }","    return cached;","  };","","  server.setRequestHandler(ListToolsRequestSchema, async () =\u003e ({ tools: TOOLS }));","","  server.setRequestHandler(CallToolRequestSchema, async (request) =\u003e {","    const args = (request.params.arguments ?? {}) as Record\u003cstring, unknown\u003e;","    try {","      const text = handle(request.params.name, args, await current(), root);","      return { content: [{ type: 'text' as const, text }] };","    } catch (error) {","      return {","        content: [","          { type: 'text' as const, text: error instanceof Error ? error.message : String(error) },","        ],","        isError: true,","      };","    }","  });","","  await server.connect(new StdioServerTransport());","","  // connect() resolves as soon as the transport is wired up, so returning here","  // would let the CLI exit and kill the server before it answers anything.","  // Stay alive until the client closes stdin, which is how an MCP host stops us.","  await new Promise\u003cvoid\u003e((resolve) =\u003e {","    process.stdin.on('close', resolve);","    process.stdin.on('end', resolve);","    server.onclose = resolve;","  });","}","","function handle(","  name: string,","  args: Record\u003cstring, unknown\u003e,","  result: ScanResult,","  root: string,","): string {","  switch (name) {","    case 'check_before_writing':","      return checkBeforeWriting(String(args.description ?? ''), result, root);","    case 'find_symbol':","      return findSymbol(String(args.name ?? ''), result, root);","    case 'blast_radius':","      return blastRadius(String(args.name ?? ''), Number(args.depth ?? 2), result);","    case 'list_concepts':","      return listConcepts(result);","    case 'list_findings':","      return listFindings(String(args.kind ?? 'all'), Number(args.limit ?? 15), result);","    case 'get_intent':","      return getIntent(String(args.symbol ?? ''), root);","    default:","      throw new Error(`Unknown tool: ${name}`);","  }","}","","function checkBeforeWriting(description: string, result: ScanResult, root: string): string {","  if (!description.trim()) return 'Describe what the new code would do.';","","  // Score the description against every function the same way duplicates are","  // scored against each other, so \"already exists\" means the same thing here as","  // it does in a finding.","  const wanted = vocabularyBag('', description);","  const scored: Array\u003c{ symbol: CodeSymbol; score: number }\u003e = [];","","  for (const symbol of result.graph.symbols.values()) {","    if (symbol.kind !== 'function' \u0026\u0026 symbol.kind !== 'method') continue;","    const nameWords = new Set(splitIdentifier(symbol.name));","    const asked = new Set(splitIdentifier(description));","    const nameOverlap = [...nameWords].filter((w) =\u003e asked.has(w)).length;","    const score =","      0.7 * cosine(wanted, vocabula atim into the report page.","/**"," * The report's page script."," *"," * It lives in its own file, rather than in a string inside html.ts, so that"," * it is code to every tool that reads code: the type checker parses it, and"," * instantiate indexes it. As a string it was invisible, and a search box whose"," * handler had been deleted went unnoticed because nothing could see that the"," * state it fed was never written."," *"," * Plain JavaScript with no imports or exports: html.ts inlines the file as a"," * classic script. `DATA` comes from the JSON block beside it."," */","const DATA = JSON.parse(document.getElementById('data').textContent);","const app = document.getElementById('app');","","const esc = (s) =\u003e String(s).replace(/[\u0026\u003c\u003e\"']/g, (c) =\u003e","  ({ '\u0026': '\u0026amp;', '\u003c': '\u0026lt;', '\u003e': '\u0026gt;', '\"': '\u0026quot;', \"'\": '\u0026#39;' }[c]));","","/*"," * Three bands, not a gradient."," *"," * A continuous scale across four hundred boxes produced four hundred shades of"," * almost-black, and the legend promised a distinction the map never showed."," * Clean, some, mostly — and nothing in between to squint at."," */","const SOME_FINDINGS = 0.08;","const MOSTLY_FINDINGS = 0.35;","","const heatColour = (heat) =\u003e","  heat \u003c SOME_FINDINGS ? 'var(--heat0)' : heat \u003c MOSTLY_FINDINGS ? 'var(--heat1)' : 'var(--heat2)';","","function treemap() {","  const boxes = DATA.treemap;","  if (!boxes.length) return '\u003cp class=\"lede\"\u003eNothing indexed.\u003c/p\u003e';","","  const dirs = boxes.filter((b) =\u003e !b.leaf);","  const leaves = boxes.filter((b) =\u003e b.leaf);","","  const parts = ['\u003csvg viewBox=\"0 0 ' + DATA.mapSize.width + ' ' + DATA.mapSize.height + '\" preserveAspectRatio=\"xMidYMid meet\" role=\"img\" aria-label=\"Map of the codebase by file size and findings\"\u003e'];","","  for (const b of dirs) {","    parts.push('\u003crect x=\"' + b.x + '\" y=\"' + b.y + '\" width=\"' + b.w + '\" height=\"' + b.h +","      '\" fill=\"none\" stroke=\"var(--line)\"/\u003e');","    if (b.h \u003e 22 \u0026\u0026 b.w \u003e 40) {","      parts.push('\u003ctext class=\"dir-label\" x=\"' + (b.x + 4) + '\" y=\"' + (b.y + 11) + '\"\u003e' +","        esc(b.name) + '\u003c/text\u003e');","    }","  }","","  for (const b of leaves) {","    parts.push('\u003crect class=\"box\" data-path=\"' + esc(b.path) + '\" x=\"' + b.x + '\" y=\"' + b.y +","      '\" width=\"' + b.w + '\" height=\"' + b.h + '\" fill=\"' + heatColour(b.heat) + '\"\u003e' +","      '\u003ctitle\u003e' + esc(b.path) + '\\n' + b.value + ' lines' +","      (b.findings ? ' · ' + b.findings + ' finding' + (b.findings === 1 ? '' : 's') : ' · clean') +","      '\u003c/title\u003e\u003c/rect\u003e');","    if (b.w \u003e 46 \u0026\u0026 b.h \u003e 13) {","      const chars = Math.floor((b.w - 6) / 5);","      const label = b.name.length \u003e chars ? b.name.slice(0, Math.max(1, chars - 1)) + '…' : b.name;","      parts.push('\u003ctext class=\"box-label\" x=\"' + (b.x + 3) + '\" y=\"' + (b.y + 10) + '\"\u003e' +","        esc(label) + '\u003c/text\u003e');","    }","  }","","  parts.push('\u003c/svg\u003e');","  return parts.join('');","}","","","/* ---------------------------------------------------------------------------"," * The explorer."," *"," * A developer's question is almost never \"what is this codebase made of\". It"," * is \"where does this live, who calls it, and what is wrong with it\" — which"," * wants a tree, a symbol and its call sites in one place, not a picture."," * ------------------------------------------------------------------------ */","","let openFile = null;","let openSymbol = null;","let query = '';","let symbolFilter = '';","let onlyFlagged = false;","let showMap = false;","/** Line numbers inside folds the reader has opened. */","let expandedFolds = new Set();","/** Folders the reader has opened, beyond those open because of the selection. */","let openFolders = new Set();","/** Findings whose reasoning the reader has opened. */","let expandedActions = new Set();","/** Whether the file-connection panel is open. */","let showLinks = false;","","/* ---------------------------------------------------------------------------"," * Navigation history."," *"," * Following a call site into another file, and another, is how anybody"," * actually reads unfamiliar code — and it is also how you lose your place."," * Every move is recorded, so the trail shows the path taken and each step on"," * it goes back there. Forward entries are discarded on a new move, which is"," * what a back button everywhere else does."," * ------------------------------------------------------------------------ */","","const history = [];","let cursor = -1;","","/* ---------------------------------------------------------------------------"," * Pane widths."," *"," * Deep folder names want a wide tree; reading code wants a narrow one. Which"," * is right changes from file to file, so it belongs to the reader. Remembered"," * per browser, and guarded: storage is unavailable in a private window and"," * throws rather than returning nothing."," * ------------------------------------------------------------------------ */","","const MIN_PANE = 140;","const MIN_LINKS = 90;","const sizes = { tree: 240, symbols: 280, links: 260 };","","try {","  const saved = JSON.parse(localStorage.getItem('instantiate:panes') || 'null');","  for (const key of ['tree', 'symbols', 'links']) {","    if (saved \u0026\u0026 typeof saved[key] === 'number') sizes[key] = saved[key];","  }","} catch { /* no storage, or it is blocked: the defaults are fine */ }","","function rememberPanes() {","  try {","    localStorage.setItem('instantiate:panes', JSON.stringify(sizes));","  } catch { /* nothing to do, and nothing worth telling the reader */ }","}","","/** The connections panel grows downwards; the side panes grow rightwards. */","const isVertical = (which) =\u003e which === 'links';","const floorFor = (which) =\u003e (isVertical(which) ? MIN_LINKS : MIN_PANE);","","/** Apply the current sizes without a repaint, so a drag stays smooth. */","function writeSizes() {","  const panes = document.querySelector('.ide-panes');","  if (panes) {","    panes.style.setProperty('--w-tree', sizes.tree + 'px');","    panes.style.setProperty('--w-symbols', sizes.symbols + 'px');","  }","  const links = document.querySelector('.links');","  if (links) links.style.height = sizes.links + 'px';","}","","function startResize(event, which) {","  const start = isVertical(which) ? event.clientY : event.clientX;","  const from = sizes[which];","  event.preventDefault();","  document.body.classList.add(isVertical(which) ? 'is-resizing-y' : 'is-resizing');","","  const onMove = (move) =\u003e {","    const now = isVertical(which) ? move.clientY : move.clientX;","    sizes[which] = Math.max(floorFor(which), from + (now - start));","    writeSizes();","  };","  const onUp = () =\u003e {","    document.removeEventListener('pointermove', onMove);","    document.removeEventListener('pointerup', onUp);","    document.body.classList.remove('is-resizing', 'is-resizing-y');","    rememberPanes();","  };","  document.addEventListener('pointermove', onMove);","  document.addEventListener('pointerup', onUp);","}","","function navigate(file, symbol) {","  if (!file) return;","  const current = history[cursor];","  // Re-selecting exactly where you already are is not a step.","  if (current \u0026\u0026 current.file === file \u0026\u0026 current.symbol === (symbol || null)) return;","","  history.length = cursor + 1;","  history.push({ file, symbol: symbol || null });","  cursor = history.length - 1;","  apply();","}","","function go(delta) {","  const next = cursor + delta;","  if (next \u003c 0 || next \u003e= history.length) return;","  cursor = next;","  apply();","}","","/** Put the panes where the current history entry says they should be. */","function apply() {","  const entry = history[cursor];","  if (!entry) return;","  openFile = entry.file;","  openSymbol = entry.symbol;","  symbolFilter = '';","  expandedFolds = new Set();","  showMap = false;","  revealInTree(openFile);","  repaintExplorer();","}","","/**"," * A file's name, with its folder when the name alone says nothing."," *"," * A trail reading \"index.ts › cookie.ts › index.ts\" tells you where you have"," * been only if you already remember, which is the thing the trail is for."," */","function shortPath(file) {","  const parts = file.split('/');","  const name = parts[parts.length - 1];","  const generic = /^(index|main|mod|init|__init__)./.test(name);","  return generic \u0026\u0026 parts.length \u003e 1 ? parts[parts.length - 2] + '/' + name : name;","}","","/** The path taken, most recent last, each step a way back to it. */","function trailHtml() {","  if (history.length \u003c= 1) return '';","  const start = Math.max(0, cursor - 5);","  const steps = history.slice(start, cursor + 1);","","  return '\u003cnav class=\"trail\" aria-label=\"Path taken\"\u003e' +","      (start \u003e 0 ? '\u003cspan class=\"trail-more\"\u003e…\u003c/span\u003e' : '') +","      steps.map((entry, i) =\u003e {","        const index = start + i;","        const label = entry.symbol","          ? esc(shortPath(entry.file)) + ' · ' + esc(entry.symbol.split('#')[1].split('.').pop())","          : esc(shortPath(entry.file));","        return '\u003cbutton class=\"trail-step' + (index === cursor ? ' is-here' : '') + '\" ' +","          'data-step=\"' + index + '\" title=\"' + esc(entry.file) + '\"\u003e' + label + '\u003c/button\u003e';","      }).join('\u003cspan class=\"trail-sep\"\u003e›\u003c/span\u003e') +","    '\u003c/nav\u003e';","}","","/**"," * Open on the file most worth looking at."," *"," * A tool that opens empty shows nothing of what it does, and the first file"," * alphabetically is almost always the least interesting — a benchmark, a"," * fixture. Rank by the worst thing in each file, then by how much of it."," */","function mostInteresting() {","  const rank = { high: 3, medium: 2, low: 1 };","  let best = null;","  let bestScore = 0;","  for (const file of DATA.files) {","    if (!file.findings.length) continue;","    const severity = worstSeverity(file.findings);","    const score = (rank[severity] || 0) * 100 + file.findings.length;","    if (score \u003e bestScore) {","      bestScore = score;","      best = file;","    }","  }","  return best ? best.path : (DATA.files[0] \u0026\u0026 DATA.files[0].path) || null;","}","","const FILES = new Map(DATA.files.map((f) =\u003e [f.path, f]));","const FINDINGS = new Map(DATA.findings.map((f) =\u003e [f.id, f]));","","const worstSeverity = (ids) =\u003e {","  let worst = null;","  for (const id of ids) {","    const f = FINDINGS.get(id);","    if (!f) continue;","    if (f.severity === 'high') return 'high';","    if (f.severity === 'medium') worst = 'medium';","    else if (!worst) worst = 'low';","  }","  return worst;","};","","/** Files matching the search, by path or by any symbol name. */","function matchingFiles() {","  if (!query) return DATA.files;","  const q = query.toLowerCase();","  return DATA.files.filter(","    (f) =\u003e f.path.toLowerCase().includes(q) || f.symbols.some((s) =\u003e s.name.toLowerCase().includes(q)),","  );","}","","/** Nest flat paths into folders, collapsing chains with a single child. */","function buildTree(files) {","  const root = { name: '', path: '', dirs: new Map(), files: [] };","  for (const file of files) {","    const parts = file.path.split('/');","    let node = root;","    for (let i = 0; i \u003c parts.length - 1; i++) {","      const path = parts.slice(0, i + 1).join('/');","      if (!node.dirs.has(path)) node.dirs.set(path, { name: parts[i], path, dirs: new Map(), files: [] });","      node = node.dirs.get(path);","    }","    node.files.push(file);","  }","  return root;","}","","/** Findings anywhere beneath a folder, and the worst severity among them  k: 'tok-keyword', n: 'tok-number',","               t: 'tok-type', f: 'tok-fn', p: 'tok-punct' };","","// Built from char codes so no quote or backslash has to survive nesting.","const DOUBLE = String.fromCharCode(34);","const SINGLE = String.fromCharCode(39);","const BACKTICK = String.fromCharCode(96);","const BACKSLASH = String.fromCharCode(92);","","/** Highlight one line, given and returning the multi-line state it is inside. */","function highlightLine(text, lang, state) {","  const keywords = lang === 'py' ? PY_KEYWORDS : KEYWORDS[lang] || JS_KEYWORDS;","  let out = '';","  let i = 0;","","  // Finish whatever ran past the end of the previous line.","  if (state.block) {","    const close = lang === 'py' ? state.block : '*/';","    const at = text.indexOf(close);","    if (at === -1) return { html: '\u003cspan class=\"' + SPAN.c + '\"\u003e' + esc(text) + '\u003c/span\u003e', state };","    out += '\u003cspan class=\"' + SPAN.c + '\"\u003e' + esc(text.slice(0, at + close.length)) + '\u003c/span\u003e';","    i = at + close.length;","    state = { block: null };","  }","","  while (i \u003c text.length) {","    const rest = text.slice(i);","","    // Line comment.","    const lineComment = lang === 'py' ? /^#.*/ : /^\\/\\/.*/;","    let m = rest.match(lineComment);","    if (m) { out += '\u003cspan class=\"' + SPAN.c + '\"\u003e' + esc(m[0]) + '\u003c/span\u003e'; break; }","","    // Block comment, or a Python docstring, which may not close on this line.","    if (lang !== 'py' \u0026\u0026 rest.slice(0, 2) === '/*') {","      const close = rest.indexOf('*/', 2);","      if (close === -1) {","        out += '\u003cspan class=\"' + SPAN.c + '\"\u003e' + esc(rest) + '\u003c/span\u003e';","        return { html: out, state: { block: '*/' } };","      }","      out += '\u003cspan class=\"' + SPAN.c + '\"\u003e' + esc(rest.slice(0, close + 2)) + '\u003c/span\u003e';","      i += close + 2;","      continue;","    }","    if (lang === 'py') {","      const triple = while (end \u003c= total \u0026\u0026 !keep.has(end)) end++;","    const length = end - n;","","    if (length \u003c MIN_FOLD) {","      // Too short to be worth hiding; show it and keep the highlighter in step.","      for (let k = n; k \u003c end; k++) {","        const highlighted = highlightLine(file.source[k - 1], lang, state);","        state = highlighted.state;","        rows.push(","          '\u003cdiv class=\"code-line\"\u003e\u003cspan class=\"code-n\"\u003e' + k + '\u003c/span\u003e' +","            '\u003cspan class=\"code-text\"\u003e' + (highlighted.html || ' ') + '\u003c/span\u003e\u003c/div\u003e',","        );","      }","    } else {","      // Folded lines still pass through the highlighter, or a block comment","      // opened inside the fold would colour everything after it.","      for (let k = n; k \u003c end; k++) state = highlightLine(file.source[k - 1], lang, state).state;","      rows.push(","        '\u003cbutton class=\"fold\" data-fold=\"' + n + '\" data-fold-end=\"' + (end - 1) + '\"\u003e' +","          '\u003cspan class=\"fold-mark\"\u003e' + icon('ellipsis') + '\u003c/span\u003e' +","          '\u003cspan class=\"fold-text\"\u003e' + length + ' unremarkable lines\u003c/span\u003e' +","        '\u003c/button\u003e',","      );","    }","    n = end;","  }","","  return head + '\u003cdiv class=\"pane-scroll code-scroll\"\u003e' + actions +","    '\u003cdiv class=\"code\"\u003e' + rows.join('') + '\u003c/div\u003e\u003c/div\u003e';","}","","/**"," * What reaches this file, and what it reaches."," *"," * Answered at the file level because that is the question people ask before"," * they ask about a function: is this change contained, or does it touch half"," * the codebase."," */","function connectionsHtml(file) {","  const column = (label, links, empty) =\u003e {","    if (links.length === 0) {","      return '\u003cdiv class=\"links-col\"\u003e\u003cspan class=\"refs-label\"\u003e' + label + '\u003c/span\u003e' +","        '\u003cs
