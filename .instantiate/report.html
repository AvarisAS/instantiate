mport type { Finding } from '../types.js';","import { layout, treeFromPaths, type LaidOut } from './treemap.js';","import { readFileSync } from 'node:fs';","import { join } from 'node:path';","import { snippet, type Snippet } from './snippets.js';","","/**"," * A single self-contained HTML file."," *"," * This is the format that travels: it gets attached to a PR, dropped in a"," * channel, opened by someone who will never install the CLI, and kept as a"," * record of what the repo looked like this month. A localhost UI is seen by one"," * person; a file is seen by ten."," *"," * It is a worklist with pictures, not an atlas. Every screen ends in something"," * to do, because an atlas gets one appreciative look and never opens again."," */","export function renderHtmlReport(result: ScanResult, findings: Finding[]): string {","  const shown = findings.slice(0, Math.max(result.config.maxFindings, 40));","  const data = buildData(result, shown);","  const title = basename(result.config.root) || 'codebase';","","  return `\u003c!doctype html\u003e","\u003chtml lang=\"en-GB\"\u003e","\u003chead\u003e","\u003cmeta charset=\"utf-8\"\u003e","\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\u003e","\u003ctitle\u003e${escapeHtml(title)} — instantiate\u003c/title\u003e","\u003cstyle\u003e${STYLE}\u003c/style\u003e","\u003c/head\u003e","\u003cbody\u003e","\u003cdiv id=\"app\"\u003e\u003c/div\u003e","\u003cscript id=\"data\" type=\"application/json\"\u003e${escapeJson(JSON.stringify(data))}\u003c/script\u003e","\u003cscript\u003e${SCRIPT}\u003c/script\u003e","\u003c/body\u003e","\u003c/html\u003e`;","}","","interface ReportData {","  title: string;","  generatedAt: string;","  /** Where the code lives, so every path in the report can link to it. */","  repo?: { url: string; label: string; blobBase?: string };","  stats: ScanResult['stats'];","  warnings: string[];","  treemap: SerialisedBox[];","  mapSize: { width: number; height: number };","  files: FileEntry[];","  findings: Array\u003cFinding \u0026 { snippets: Snippet[] }\u003e;","  fileFindings: Record\u003cstring, string[]\u003e;","}","","interface Ref {","  file: string;","  line: number;","  name: string;","}","","interface SymbolEntry {","  id: string;","  name: string;","  kind: string;","  line: number;","  loc: number;","  exported: boolean;","  /** Where this is used, and what it reaches. Both capped; counts are exact. */","  usedBy: Ref[];","  usedByCount: number;","  reaches: Ref[];","  reachesCount: number;","  findings: string[];","}","","interface LineMark {","  from: number;","  to: number;","  severity: string;","  finding: string;","}","","interface FileLink {","  path: string;","  /** How many distinct symbols of the other file are involved. */","  count: number;","}","","interface FileEntry {","  path: string;","  loc: number;","  symbols: SymbolEntry[];","  findings: string[];","  /** Files that reach into this one, and the ones it reaches into. */","  usedBy: FileLink[];","  uses: FileLink[];","  /** The file's real source, for the code pane. Absent when too large to embed. */","  source?: string[];","  /** Line ranges implicated in a finding, for highlighting. */","  marks: LineMark[];","}","","interface SerialisedBox {","  name: string;","  path: string;","  x: number;","  y: number;","  w: number;","  h: number;","  depth: number;","  leaf: boolean;","  heat: number;","  value: number;","  findings: number;","}","","const TREEMAP_WIDTH = 1000;","const TREEMAP_HEIGHT = 560;","","function buildData(result: ScanResult, findings: Finding[]): ReportData {","  const perFile = new Map\u003cstring, { loc: number; findings: string[]; weight: number }\u003e();","  for (const [path, record] of result.graph.files) {","    perFile.set(path, { loc: record.loc, findings: [], weight: 0 });","  }","  for (const finding of result.findings) {","    const files = new Set([finding.file, ...finding.symbols.map((s) =\u003e s.split('#')[0])]);","    for (const file of files) {","      const entry = perFile.get(file);","      if (!entry) continue;","      entry.findings.push(finding.id);","      entry.weight += finding.loc * finding.score;","    }","  }","","  const tree = treeFromPaths(","    basename(result.config.root) || 'root',","    [...perFile.entries()].map(([path, entry]) =\u003e ({","      path,","      value: Math.max(entry.loc, 1),","      // Heat is the share of a file implicated in findings, so a small bad file","      // still shows, and a large file is not punished for its size alone.","      heat: Math.min(1, entry.weight / Math.max(entry.loc, 1)),","      findings: entry.findings.length,","    })),","  );","","  const laid = layout(tree, { x: 0, y: 0, width: TREEMAP_WIDTH, height: TREEMAP_HEIGHT });","  const boxes: SerialisedBox[] = [];","  flatten(laid, boxes);","","  return {","    title: basename(result.config.root) || 'codebase',","    generatedAt: new Date().toISOString().slice(0, 16).replace('T', ' '),","    repo: describeRepo(result),","    stats: result.stats,","    warnings: result.warnings,","    treemap: boxes,","    mapSize: { width: TREEMAP_WIDTH, height: TREEMAP_HEIGHT },","    files: buildFileIndex(result, perFile),","    findings: findings.map((finding) =\u003e ({","      ...finding,","      snippets: snippetsFor(result, finding),","    })),","    fileFindings: Object.fromEntries(","      [...perFile.entries()].filter(([, e]) =\u003e e.findings.length \u003e 0).map(([path, e]) =\u003e [path, e.findings]),","    ),","  };","}","","/**"," * The remote, reduced to what the page needs: somewhere to point at, something"," * short to print, and the prefix that turns a path into a link."," */","function describeRepo(result: ScanResult): ReportData['repo'] {","  const repo = result.repo;","  if (!repo) return undefined;","  const linkable = /github\\.com|gitlab\\.com|bitbucket\\.org/.test(repo.url);","  return {","    url: repo.url,","    // Host and path, without the scheme: it is a label, not an address bar.","    label: repo.url.replace(/^https?:\\/\\//, ''),","    blobBase: linkable ? `${repo.url}/${repo.blobPath}/${repo.ref}` : undefined,","  };","}","","/** Cap on how many call sites travel with each symbol; the count stays exact. */","const MAX_REFS = 25;","","/**"," * Limits on embedded source."," *"," * The code pane is the point of the page, so source ships with it rather than"," * being fetched — a report is read offline. But a repository can be large, and"," * a page nobody can open helps nobody, so very large files are skipped and,"," * past a total budget, only files with something wrong with them keep theirs."," */","const MAX_FILE_LINES = 5000;","const SOURCE_BUDGET_BYTES = 9_000_000;","","/**"," * Every file, with its symbols and where each one is used."," *"," * This is what the page is actually for. A map of a codebase answers \"what is"," * in here\"; a developer's question is almost always \"where does this live, who"," * calls it, and what is wrong with it\" — which needs the tree, the symbol and"," * its call sites in one place, not a picture."," */","function buildFileIndex(","  result: ScanResult,","  perFile: Map\u003cstring, { loc: number; findings: string[]; weight: number }\u003e,","): FileEntry[] {","  const incoming = new Map\u003cstring, Ref[]\u003e();","  const outgoing = new Map\u003cstring, Ref[]\u003e();","","  for (const edge of result.graph.edges) {","    const from = result.graph.symbols.get(edge.from);","    const to = result.graph.symbols.get(edge.to);","    if (!from || !to || from.id === to.id) continue;","    // A module symbol stands for an import, which is not a call site.","    if (from.kind === 'module') continue;","","    const callers = incoming.get(edge.to) ?? [];","    if (!callers.some((r) =\u003e r.name === from.name \u0026\u0026 r.file === edge.file)) {","      callers.push({ file: edge.file, line: edge.line, name: from.name });","      incoming.set(edge.to, callers);","    }","    const callees = outgoing.get(edge.from) ?? [];","    if (!callees.some((r) =\u003e r.name === to.name \u0026\u0026 r.file === to.file)) {","      callees.push({ file: to.file, line: to.line, name: to.name });","      outgoing.set(edge.from, callees);","    }","  }","","  const findingsBySymbol = new Map\u003cstring, string[]\u003e();","  for (const finding of result.findings) {","    for (const id of finding.symbols) {","      const list = findingsBySymbol.get(id) ?? [];","      list.push(finding.id);","      findingsBySymbol.set(id, list);","    }","  }","","  const byFile = new Map\u003cstring, SymbolEntry[]\u003e();","  for (const symbol of result.graph.symbols.values()) {","    if (symbol.kind === 'module') continue;","    const usedBy = incoming.get(symbol.id) ?? [];","    const reaches = outgoing.get(symbol.id) ?? [];","    const entry: SymbolEntry = {","      id: symbol.id,","      name: symbol.name,","      kind: symbol.kind,","      line: symbol.line,","      loc: symbol.loc,","      exported: symbol.exported,","      usedBy: usedBy.slice(0, MAX_REFS),","      usedByCount: usedBy.length,","      reaches: reaches.slice(0, MAX_REFS),","      reachesCount: reaches.length,","      findings: findingsBySymbol.get(symbol.id) ?? [],","    };","    const list = byFile.get(symbol.file) ?? [];","    list.push(entry);","    byFile.set(symbol.file, list);","  }","","  const links = fileLinks(result);","  const entries: FileEntry[] = [...perFile.entries()]","    .map(([path, entry]) =\u003e ({","      path,","      loc: entry.loc,","      findings: entry.findings,","      symbols: (byFile.get(path) ?? []).sort((a, b) =\u003e a.line - b.line),","      usedBy: links.usedBy.get(path) ?? [],","      uses: links.uses.get(path) ?? [],","      marks: [],","    }))","    .sort((a, b) =\u003e a.path.localeCompare(b.path));","","  attachMarks(entries, result);","  attachSource(entries, result.config.root);","  return entries;","}","","/**"," * How the files connect."," *"," * A symbol graph answers \"who calls this function\"; the question before that"," * one is usually \"what depends on this file at all\" — which is what tells you"," * whether a change is contained or whether it reaches half the codebase."," *"," * Counted by distinct symbol pairs, so a file calling one helper forty times"," * does not look like a heavier dependency than one calling forty helpers once."," */","function fileLinks(result: ScanResult): {","  usedBy: Map\u003cstring, FileLink[]\u003e;","  uses: Map\u003cstring, FileLink[]\u003e;","} {","  const pairs = new Map\u003cstring, Set\u003cstring\u003e\u003e();","","  for (const edge of result.graph.edges) {","    const from = edge.from.split('#')[0];","    const to = edge.to.split('#')[0];","    if (from === to) continue;","    const key = from + '\\u0000' + to;","    const set = pairs.get(key) ?? new Set\u003cstring\u003e();","    set.add(edge.from + '\u003e' + edge.to);","    pairs.set(key, set);","  }","","  const usedBy = new Map\u003cstring, FileLink[]\u003e();","  const uses = new Map\u003cstring, FileLink[]\u003e();","","  for (const [key, involved] of pairs) {","    const [from, to] = key.split('\\u0000');","    const count = involved.size;","    (usedBy.get(to) ?? usedBy.set(to, []).get(to)!).push({ path: from, count });","    (uses.get(from) ?? uses.set(from, []).get(from)!).push({ path: to, count });","  }","","  const byWeight = (a: FileLink, b: FileLink) =\u003e b.count - a.count || a.path.localeCompare(b.path);","  for (const list of usedBy.values()) list.sort(byWeight);","  for (const list of uses.values()) list.sort(byWeight);","  return { usedBy, uses };","}","","/**"," * Which lines a finding covers, so the code pane can colour them."," *"," * A finding names symbols, and a symbol is a line range; that range is what a"," * reader needs shaded, not a single line they then have to search around."," */","function attachMarks(entries: FileEntry[], result: ScanResult): void {","  const byPath = new Map(entries.map((e) =\u003e [e.path, e]));","","  for (const finding of result.findings) {","    for (const id of finding.symbols) {","      const symbol = result.graph.symbols.get(id);","      const file = symbol ? byPath.get(symbol.file) : undefined;","      if (symbol \u0026\u0026 file) {","        file.marks.push({","          from: symbol.line,","          to: symbol.endLine,","          severity: finding.severity,","          finding: finding.id,","        });","        continue;","      }","      // A finding may point at module scope, where there is no symbol range.","      const path = id.split('#')[0];","      const fallback = byPath.get(path);","      if (fallback) {","        fallback.marks.push({","          from: finding.line,","          to: finding.line,","          severity: finding.severity,","          finding: finding.id,","        });","      }","    }","","    // A finding about a line rather than a symbol — unfinished work — marks","    // that line, and every condition it leaves frozen.","    if (finding.symbols.length === 0) {","      const file = byPath.get(finding.file);","      const lines = [finding.line, ...((finding.evidence?.reads ?? []) as number[])];","      for (const line of file ? lines : []) {","        file!.marks.push({ from: line, to: line, severity: finding.severity, finding: finding.id });","      }","    }","","    // Drift and contradictions carry their own per-site locations.","    const sites = [","      ...((finding.evidence?.deviants ?? []) as Array\u003c{ file: string; line: number }\u003e),","      ...((finding.evidence?.variants ?? []) as Array\u003c{ file: string; line: number }\u003e),","    ];","    for (const site of sites) {","      const file = byPath.get(site.file);","      if (file) {","        file.marks.push({","          from: site.line,","          to: site.line,","          severity: finding.severity,","          finding: finding.id,","        });","      }","    }","  }","}","","/** Read each file's real source, newest-severity-first within a size budget. */","function attachSource(entries: FileEntry[], root: string): void {","  // Files with findings get their source first: those are the ones a reader","  // opens, and if the budget runs out it should run out on the clean ones.","  const order = [...entries].sort((a, b) =\u003e b.findings.length - a.findings.length);","  let spent = 0;","","  for (const entry of order) {","    if (spent \u003e SOURCE_BUDGET_BYTES) break;","    let text: string;","    try {","      text = readFileSync(join(root, entry.path), 'utf8');","    } catch {","      continue;","    }","    if (text.length \u003e 400_000) continue;","    const lines = text.split('\\n');","    if (lines.length \u003e MAX_FILE_LINES) continue;","    entry.source = lines;","    spent += text.length;","  }","}","","function flatten(node: LaidOut, out: SerialisedBox[]): void {","  if (node.depth \u003e 0) {","    out.push({","      name: node.name,","      path: node.path,","      x: round(node.x),","      y: round(node.y),","      w: round(node.width),","      h: round(node.height),","      depth: node.depth,","      leaf: !node.children || node.children.length === 0,","      heat: Number((node.heat ?? 0).toFixed(3)),","      value: node.value,","      findings: node.findings ?? 0,","    });","  }","  for (const child of node.children ?? []) flatten(child, out);","}","","function round(n: number): number {","  return Math.round(n * 10) / 10;","}","","function snippetsFor(result: ScanResult, finding: Finding): Snippet[] {","  const root = result.config.root;","","  if (finding.kind === 'duplicate') {","    const members = (finding.evidence?.members ?? []) as Array\u003c{","      file: string;","      line: number;","      endLine: number;","    }\u003e;","    // Side by side is the entire argument for a duplicate: two functions that","    // look the same next to each other need no explanation.","    return members","      .map((m) =\u003e snippet(root, m.file, m.line, m.endLine))","      .filter((s): s is Snippet =\u003e !!s);","  }","","  if (finding.kind === 'contradiction') {","    const variants = (finding.evidence?.variants ?? []) as Array\u003c{ file: string; line: number }\u003e;","    return variants","      .slice(0, 6)","      .map((v) =\u003e snippet(root, v.file, Math.max(1, v.line), v.line + 8))","      .filter((s): s is Snippet =\u003e !!s);","  }","","  if (finding.kind === 'drift') {","    const deviants = (finding.evidence?.deviants ?? []) as Array\u003c{ file: string; line: number }\u003e;","    return deviants","      .slice(0, 4)","      .map((d) =\u003e snippet(root, d.file, Math.max(1, d.line - 1), d.line + 6))","      .filter((s): s is Snippet =\u003e !!s);","  }","","  const symbol = result.graph.symbols.get(finding.symbols[0]);","  const one = snippet(root, finding.file, finding.line, symbol?.endLine ?? finding.line + 12);","  return one ? [one] : [];","}","","function escapeHtml(text: string): string {","  return text.replace(/[\u0026\u003c\u003e\"']/g, (c) =\u003e","    ({ '\u0026': '\u0026amp;', '\u003c': '\u0026lt;', '\u003e': '\u0026gt;', '\"': '\u0026quot;', \"'\": '\u0026#39;' })[c]!,","  );","}","","/** Keep embedded JSON from terminating the script block early. */","function escapeJson(json: string): string {","  return json.replace(/\u003c/g, '\\\\u003c').replace(/\u003e/g, '\\\\u003e').replace(/\u0026/g, '\\\\u0026');","}","","const STYLE = `","/*"," * A report is read the way an instrument panel is read: severity first, then"," * scale, then the code. So severity is carried by shape as well as colour — a"," * stripe down the edge of every finding — and the semantic scale is kept"," * separate from the accent, which marks only what is interactive."," *"," * No web fonts: a report is opened offline, attached to a mail, read on a"," * plane. A font that fails to load silently would take the typography with it."," */",":root {","  /*","   * Flexoki, by Steph Ango. An ink-on-paper palette: warm neutrals that hold","   * their character in both themes, and colours picked to sit on them without","   * shouting. Chosen over the cool blue-greys because a page full of code","   * should read like a printed page, not like a control panel.","   */","  --bg: #FFFCF0;          /* paper */","  --panel: #FFFCF0;","  --sunk: #F2F0E5;        /* base-50 */","  --ink: #100F0F;         /* black */","  --ink-soft: #403E3C;    /* base-800 */","  --muted: #6F6E69;       /* base-600 */","  --line: #DAD8CE;        /* base-150 */","  --line-strong: #B7B5AC; /* base-300 */","  --accent: #205EA6;      /* blue-600 */","  --accent-soft: #E1ECF7;","  --high: #AF3029;        /* red-600 */","  --medium: #AD8301;      /* yellow-600 */","  --low: #878580;         /* base-500 */","  --good: #66800B;        /* green-600 */","","  /* Three bands, not a gradient: \"clean\", \"some\" and \"mostly\" have to be","     distinguishable at a glance in a map of four hundred boxes. */","  --heat0: #EDEBE0;","  --heat1: #E8C88A;","  --heat2: #C86A56;","","  --focus-tint: color-mix(in srgb, var(--accent) 10%, transparent);","  --tok-comment: #878580;  /* base-500 */","  --tok-string: #66800B;   /* green-600 */","  --tok-keyword: #5E409D;  /* purple-600 */","  --tok-number: #BC5215;   /* orange-600 */","  --tok-type: #205EA6;     /* blue-600 */","  --tok-fn: #24837B;       /* cyan-600 */","  --tok-punct: #6F6E69;","  --tint-high: color-mix(in srgb, var(--high) 10%, transparent);","  --tint-medium: color-mix(in srgb, var(--medium) 13%, transparent);","  --tint-low: color-mix(in srgb, var(--low) 9%, transparent);","","  --mono: ui-monospace, SFMono-Regular, \"SF Mono\", Menlo, Consolas, monospace;","  --sans: system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif;","  --step--1: 0.78rem;","  --step-0: 0.94rem;","  --step-1: 1.15rem;","  --step-2: 1.6rem;","  --step-3: 2.1rem;","}","","/* Flexoki's dark side: the same ink, inverted. */","@media (prefers-color-scheme: dark) {","  :root:not([data-theme=\"light\"]) {"," { background: var(--panel); border: 1px solid var(--line);","         padding: 16px; overflow: hidden; }","svg { display: block; width: 100%; height: auto; }",".box { stroke: var(--panel); stroke-width: 1; cursor: pointer; }",".box:hover { stroke: var(--accent); stroke-width: 2; }",".box-label { font-family: var(--mono); font-size: 9px; fill: var(--ink-soft);","             pointer-events: none; opacity: 0.8; }",".dir-label { font-size: 10px; fill: var(--muted); pointer-events: none; font-weight: 650; }","","/* Severity reads as a stripe before it reads as a word. */",".finding { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--low); margin: 7px 0; overflow: hidden; }",".finding[data-severity=\"high\"] { border-left-color: var(--high); }",".finding[data-severity=\"medium\"] { border-left-color: var(--medium); }",".finding summary { padding: 12px 16px; cursor: pointer; display: flex; gap: 12px;","                   align-items: baseline; list-style: none; }",".finding summary::-webkit-details-marker { display: none; }",".finding summary:hover { background: var(--accent-soft); }",".finding summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }",".sev { font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 700;","       flex: 0 0 auto; padding: 2px 7px; background: var(--sunk); color: var(--low); }",".sev.high { color: var(--high); } .sev.medium { color: var(--medium); }",".f-title { flex: 1 1 auto; font-weight: 500; }",".f-meta { color: var(--muted); font-size: var(--step--1); font-variant-numeric: tabular-nums;","          font-family: var(--mono); flex: 0 0 auto; }",".f-body { padding: 0 16px 16px; border-top: 1px solid var(--line); }",".f-detail { color: var(--ink-soft); margin: 12px 0; max-width: 72ch; }","",".snips { display: grid; gap: 10px; grid-template-columns: 1fr; }",".snips.side-by-side { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }","pre { margin: r, because they"," * drive the CI budget. The list below them shows everything, so the two can"," * legitimately disagree — which reads as a contradiction unless it is said out"," * loud."," */","export function renderSummary(stats: Stats, warnings: string[], shown = 0): string {","  const lines: string[] = [''];","  lines.push(","    `${bold('scanned')} ${plural(stats.files, 'file')}, ${plural(stats.symbols, 'symbol')}, ${plural(stats.edges, 'edge')} ` +","      dim(`(${stats.indexMs}ms index, ${stats.analyseMs}ms analyse)`),","  );","  lines.push('');","","  const rows: Array\u003c[string, number, string]\u003e = [","    ['dead', stats.deadLoc, `${stats.deadLoc} lines nothing reaches`],","    ['duplicate', stats.duplicateLoc, `${stats.duplicateLoc} lines of redundant re-implementation`],","    ['drift', stats.driftCount, `${plural(stats.driftCount, 'convention')} done more than one way`],","    ['conflict', stats.contradictionCount, `${plural(stats.contradictionCount, 'value')} stated two different ways`],","    ['unfinished', stats.unfinishedCount, `${plural(stats.unfinishedCount, 'thing')} started and never finished`],","  ];","","  for (const [label, value, description] of rows) {","    const share =","      label === 'drift' || label === 'conflict' || label === 'unfinished'","        ? Math.min(value / 5, 1)","        : value / Math.max(stats.loc, 1);","    lines.push(`  ${label.padEnd(10)} ${bar(share, 16)} ${description}`);","  }","","  if (stats.loc \u003e 0) {","    const clean = 1 - (stats.deadLoc + stats.duplicateLoc) / stats.loc;","    lines.push('');","    lines.push(`  ${bold('load-bearing')}  ${(clean * 100).toFixed(1)}% of ${stats.loc} lines`);","    if (stats.ignoredCount \u003e 0) {","      lines.push(`  ${dim(`${plural(stats.ignoredCount, 'finding')} hidden by instantiate-ignore comments`)}`);","    }","  }","","  const counted =","    stats.deadLoc + stats.duplicateLoc + stats.driftCount + stats.contradictionCount + stats.unfinishedCount;","  if (shown \u003e 0 \u0026\u0026 counted === 0) {","    lines.push('');","    lines.push(","      `  ${dim('Everything below is under 50% confidence, so none of it counts towards these numbers or the CI budget.')}`,","    );","  }","","  for (const warning of warnings) {","    lines.push('');","    lines.push(`  ${bold('!')} ${warning}`);","  }","","  return lines.join('\\n');","}","","/** What each analysis looked for, so an empty result is a result and not a shrug. */","const LOOKED_FOR: Record\u003cstring, string\u003e = {","  dead: 'Every symbol is reachable from an entrypoint.',","  'orphan-file': 'No file is unreachable in its entirety.',","  duplicate: 'No two implementations of one idea were found.',","  contradiction:","    'Checked for one environment variable with two fallbacks, one declared ' +","    'constant with different values across files, and dates read as UTC in one ' +","    'place and local time in another. None of those disagree here.',","  drift: 'Error handling, asynchrony, logging, exports and validation are each done one way.',","};","","export function renderFindings(findings: Finding[], limit: number, kind?: string): string {","  if (findings.length === 0) {","    const detail = kind ? LOOKED_FOR[kind] : undefined;","    return `\\n${green('Nothing to do.')} ${detail ?? 'No findings above the confidence cut-off.'}\\n`;","  }","","  const shown = findings.slice(0, limit);","  const lines = ['', bold(`${shown.length} of ${findings.length} findings`), ''];","","  shown.forEach((finding, i) =\u003e {","    const colour = severityColour(finding.severity);","    const rank = dim(String(i + 1).padStart(2));","    lines.push(`${rank} ${colour(finding.severity.padEnd(6))} ${bold(finding.title)}`);","    const unit =","      finding.kind === 'contradiction'","        ? plural(finding.loc, 'site')","        : finding.kind === 'unfinished' \u0026\u0026 finding.id.endsWith('@unset')","          ? plural(finding.loc, 'frozen branch', 'frozen branches')","          : `${finding.loc} lines`;","    lines.push(`   ${cyan(`${finding.file}:${finding.line}`)} ${dim(`· ${unit} · ${Math.round(finding.score * 100)}% confidence`)}`);","    lines.push(`   ${dim(finding.detail)}`);","    lines.push('');","  });","","  if (findings.length \u003e shown.length) {","    lines.push(","      dim(`   ${findings.length - shown.length} more below the noise budget. Raise it with --limit, or open the report.`),","    );","    lines.push('');","  }","","  return lines.join('\\n');","}",""]},{"path":"src/report/treemap.ts","loc":177,"findings":[],"symbols":[{"id":"src/report/treemap.ts#TreeNode","name":"TreeNode","kind":"interface","line":10,"loc":9,"exported":true,"usedBy":[{"file":"src/report/treemap.ts","line":20,"name":"LaidOut"},{"file":"src/report/treemap.ts","line":36,"name":"layout"},{"file":"src/report/treemap.ts","line":66,"name":"Scaled"},{"file":"src/report/treemap.ts","line":131,"name":"treeFromPaths"},{"file":"src/report/treemap.ts","line":159,"name":"rollUp"},{"file":"src/report/html.ts","line":416,"name":"flatten"}],"usedByCount":6,"reaches":[],"reachesCount":0,"findings":[]},{"id":"src/report/treemap.ts#LaidOut","name":"LaidOut","kind":"interface","line":20,"loc":8,"exported":true,"usedBy":[{"file":"src/report/treemap.ts","line":36,"name":"layout"},{"file":"src/report/treemap.ts","line":75,"name":"squarify"},{"file":"src/report/html.ts","line":413,"name":"flatten"},{"file":"test/treemap.test.ts","line":5,"name":"leaves"}],"usedByCount":4,"reaches":[{"file":"src/report/treemap.ts","line":10,"name":"TreeNode"}],"reachesCount":1,"findings":[]},{"id":"src/report/treemap.ts#Rect","name":"Rect","kind":"interface","line":29,"loc":6,"exported":true,"usedBy":[{"file":"src/report/treemap.ts","line":36,"name":"layout"},{"file":"src/report/treemap.ts","line":75,"name":"squarify"}],"usedByCount":2,"reaches":[],"reachesCount":0,"findings":[]},{"id":"src/report/treemap.ts#layout","name":"layout","kind":"function","line":36,"loc":28,"expor sCount":2,"findings":[]},{"id":"src/report/treemap.ts#rollUp","name":"rollUp","kind":"function","line":159,"loc":18,"exported":false,"usedBy":[{"file":"src/report/treemap.ts","line":155,"name":"treeFromPaths"}],"usedByCount":1,"reaches":[{"file":"src/report/treemap.ts","line":10,"name":"TreeNode"}],"reachesCount":1,"findings":[]}],"usedBy":[{"path":"src/report/html.ts","count":8},{"path":"test/treemap.test.ts","count":6}],"uses":[],"marks":[],"source":["/**"," * Squarified treemap layout."," *"," * The one whole-codebase picture that survives scale. 50,000 symbols as a"," * node-link graph is a hairball; as nested rectangles sized by lines and"," * coloured by severity it is a picture someone reads in a second, using a"," * mental model — the folder tree — they already have."," */","","export interface TreeNode {","  name: string;","  path: string;","  value: number;","  children?: TreeNode[];","  /** 0..1, drives colour. */","  heat?: number;","  findings?: number;","}","","export interface LaidOut extends TreeNode {","  x: number;","  y: number;","  width: number;","  height: number;","  depth: number;","  children?: LaidOut[];","}","","export interface Rect {","  x: number;","  y: number;","  width: number;","  height: number;","}","","export function layout(node: TreeNode, rect: Rect, depth = 0): LaidOut {","  const self: LaidOut = { ...node, ...rect, depth, children: undefined };","  if (!node.children || node.children.length === 0) return self;","","  // Leave room for the folder label, but only when the box can spare it.","  const padding = depth === 0 ? 0 : 1;","  const header = depth \u003e 0 \u0026\u0026 rect.height \u003e 22 \u0026\u0026 rect.width \u003e 40 ? 15 : 0;","  const inner: Rect = {","    x: rect.x + padding,","    y: rect.y + padding + header,","    width: Math.max(0, rect.width - padding * 2),","    height: Math.max(0, rect.height - padding * 2 - header),","  };","","  const children = node.children","    .filter((c) =\u003e c.value \u003e 0)","    .slice()","    .sort((a, b) =\u003e b.value - a.value);","","  if (children.length === 0 || inner.width \u003c= 0 || inner.height \u003c= 0) return self;","","  const total = children.reduce((sum, c) =\u003e sum + c.value, 0);","  const area = inner.width * inner.height;","  const scaled = children.map((c) =\u003e ({ node: c, area: (c.value / total) * area }));","","  self.children = squarify(scaled, inner, depth + 1);","  return self;","}","","interface Scaled {","  node: TreeNode;","  area: number;","}","","/**"," * Bruls, Huizing and van Wijk's squarified treemap: fill the shorter side with"," * a row, extending it while the worst aspect ratio keeps improving. Boxes close"," * to square are the whole point — long slivers are unreadable and unclickable."," */","function squarify(items: Scaled[], rect: Rect, depth: number): LaidOut[] {","  const out: LaidOut[] = [];","  let remaining = rect;","  let queue = items.slice();","","  while (queue.length \u003e 0) {","    const short = Math.min(remaining.width, remaining.height);","    if (short \u003c= 0) break;","","    const row: Scaled[] = [];","    let best = Infinity;","","    for (const item of queue) {","      const candidate = [...row, item];","      const ratio = worstRatio(candidate, short);","      if (row.length \u003e 0 \u0026\u0026 ratio \u003e best) break;","      row.push(item);","      best = ratio;","    }","","    const rowArea = row.reduce((sum, item) =\u003e sum + item.area, 0);","    const horizontal = remaining.width \u003e= remaining.height;","    const thickness = rowArea / short || 0;","","    let offset = horizontal ? remaining.y : remaining.x;","    for (const item of row) {","      const length = (item.area / rowArea) * short || 0;","      const box: Rect = horizontal","        ? { x: remaining.x, y: offset, width: thickness, height: length }","        : { x: offset, y: remaining.y, width: length, height: thickness };","      out.push(layout(item.node, box, depth));","      offset += length;","    }","","    remaining = horizontal","      ? { x: remaining.x + thickness, y: remaining.y, width: remaining.width - thickness, height: remaining.height }","      : { x: remaining.x, y: remaining.y + thickness, width: remaining.width, height: remaining.height - thickness };","    queue = queue.slice(row.length);","  }","","  return out;","}","","function worstRatio(row: Scaled[], short: number): number {","  const sum = row.reduce((total, item) =\u003e total + item.area, 0);","  if (sum === 0) return Infinity;","  const max = Math.max(...row.map((item) =\u003e item.area));","  const min = Math.min(...row.map((item) =\u003e item.area));","  const side = short * short;","  return Math.max((side * max) / (sum * sum), (sum * sum) / (side * min));","}","","/** Build a folder tree from flat file paths. */","export function treeFromPaths(","  root: string,","  files: Array\u003c{ path: string; value: number; heat: number; findings: number }\u003e,","): TreeNode {","  const tree: TreeNode = { name: root, path: '', value: 0, children: [] };","","  for (const file of files) {","    const parts = file.path.split('/');","    let current = tree;","    for (let i = 0; i \u003c parts.length - 1; i++) {","      const path = parts.slice(0, i + 1).join('/');","      let next = current.children!.find((c) =\u003e c.path === path);","      if (!next) {","        next = { name: parts[i], path, value: 0, children: [] };","        current.children!.push(next);","      }","      current = next;","    }","    current.children!.push({","      name: parts[parts.length - 1],","      path: file.path,","      value: file.value,","      heat: file.heat,","      findings: file.findings,","    });","  }","","  rollUp(tree);","  return tree;","}","","function rollUp(node: TreeNode): number {","  if (!node.children || node.children.length === 0) return node.value;","  let total = 0;","  let weighted = 0;","  let findings = 0;","  for (const child of node.children) {","    const value = rollUp(child);","    total += value;","    weighted += (child.heat ?? 0) * value;","    findings += child.findings ?? 0;","  }","  node.value = total;","  // A folder's heat is the size-weighted mean of its children, so one bad file","  // in a large clean folder does not paint the whole folder red.","  node.heat = total \u003e 0 ? weighted / total : 0;","  node.findings = findings;","  return total;","}",""]},{"path":"src/report/trend.ts","loc":88,"findings":[],"symbols":[{"id":"src/report/trend.ts#runTrend","name":"runTrend","kind":"function","line":15,"loc":69,"exported":true,"usedBy":[{"file":"src/cli.ts","line":117,"name":"main"}],"usedByCount":1,"reaches":[{"file":"src/analysis/history.ts","line":77,"name":"isGitRepo"},{"file":"src/util/term.ts","line":9,"name":"yellow"},{"file":"src/analysis/history.ts","line":163,"name":"isShallow"},{"file":"src/util/term.ts","line":10,"name":"cyan"},{"file":"src/analysis/history.ts","line":59,"name":"readHistory"},{"file":"src/util/term.ts","line":5,"name":"dim"},{"file":"src/analysis/history.ts","line":171,"name":"buildHistory"},{"file":"src/util/term.ts","line":6,"name":"bold"},{"file":"src/analysis/history.ts","line":28,"name":"HistoryPoint"},{"file":"src/analysis/history.ts","line":261,"name":"summarise"},{"file":"src/analysis/history.ts","line":250,"name":"TrendSummary"},{"file":"src/util/term.ts","line":7,"name":"red"},{"file":"src/util/term.ts","line":8,"name":"green"},{"file":"src/report/trend.ts","line":85,"name":"round"},{"file":"src/analysis/history.ts","line":233,"name":"sparkline"}],"reachesCount":15,"findings":[]},{"id":"src/report/trend.ts#round","name":"round","kind":"function","line":85,"loc":3,"exported":false,"usedBy":[{"file":"src/report/trend.ts","line":63,"name":"runTrend"}],"usedByCount":1,"reaches":[],"reachesCount":0,"findings":[]}],"usedBy":[{"path":"src/cli.ts","count":2}],"uses":[{"path":"src/analysis/history.ts","count":15},{"path":"src/util/term.ts","count":13}],"marks":[],"source":["import {","  buildHistory,","  readHistory,","  sparkline,","  summarise,","  isGitRepo,","  isShallow,","} from '../analysis/history.js';","import { bold, dim, cyan, green, red, yellow } from '../util/term.js';","","/**"," * The trend screen. A rising line is the most motivating artefact this tool"," * produces, and a falling one is the only proof that the work paid off."," */","export async function runTrend(root: string, days: number, points: number, json: boolean): Promise\u003cnumber\u003e {","  if (!isGitRepo(root)) {","    console.error(`\\n${yellow('!')} Not a git repository, so there is no history to walk.\\n`);","    return 1;","  }","","  if (isShallow(root)) {","    console.error(","      `\\n${yellow('!')} This is a shallow clone, so there is only one commit to measure.\\n` +","        `  Run ${cyan('git fetch --unshallow')} first — a trend drawn through one point is a straight line that means nothing.\\n`,","    );","    return 1;","  }","","  const cached = readHistory(root);","  if (!json) {","    console.log(","      `\\n${dim(`walking ${points} points across ${days} days` + (cached.length ? ` (${cached.length} already cached)` : ''))}`,","    );","  }","","  const series = await buildHistory(root, {","    days,","    points,","    onProgress: (done, total, sha) =\u003e {","      if (!json) process.stderr.write(`\\r${dim(`  ${done}/${total}  ${sha.slice(0, 8)}`)}   `);","    },","  });","  if (!json) process.stderr.write('\\r' + ' '.repeat(40) + '\\r');","","  if (series.length === 0) {","    console.error(`\\n${yellow('!')} No commits found in that window. Try a larger --days.\\n`);","    return 1;","  }","","  if (json) {","    console.log(JSON.stringify(series, null, 2));","    return 0;","  }","","  console.log(","    `\\n${bold(`${series.length} points`)} ${dim(`· ${series[0].date} → ${series[series.length - 1].date}`)}\\n`,","  );","","  for (const trend of summarise(series)) {","    const worse = trend.growthIsBad ? trend.delta \u003e 0 : trend.delta \u003c 0;","    const colour = trend.delta === 0 ? dim : worse ? red : green;","    const sign = trend.delta \u003e 0 ? '+' : '';","    const change = trend.delta === 0 ? 'no change' : `${sign}${round(trend.delta)}`;","","    console.log(","      `  ${trend.label.padEnd(18)} ${cyan(sparkline(trend.values))}  ` +","        `${String(round(trend.first)).padStart(7)} → ${String(round(trend.last)).padStart(7)}  ${colour(change)}`,","    );","  }","","  const dead = summarise(series).find((t) =\u003e t.label === 'dead lines');","  console.log('');","  if (dead \u0026\u0026 dead.delta \u003e 0) {","    console.log(","      `  ${red('↑')} Dead code grew by ${round(dead.delta)} lines over this window. ` +","        dim(`Run ${cyan('instantiate dead')} to see what.`),","    );","  } else if (dead \u0026\u0026 dead.delta \u003c 0) {","    console.log(`  ${green('↓')} Dead code fell by ${round(-dead.delta)} lines. ${dim('Keep going.')}`);","  }","  console.log(dim(`\\n  Cached in .instantiate/history.json — commit it to keep the line going.\\n`));","  return 0;","}","","function round(n: number): number {","  return Math.round(n * 10) / 10;","}",""]},{"path":"src/report/why.ts","loc":98,"findings":[],"symbols":[{"id":"src/report/why.ts#renderWhy","name":"renderWhy","kind":"function","line":11,"loc":13,"exported":true,"usedBy":[{"file":"src/cli.ts","line":190,"name":"main"}],"usedByCount":1,"reaches":[{"file":"src/types.ts","line":69,"name":"CodeGraph"},{"file":"src/index/lookup.ts","line":30,"name":"lookup"},{"file":"src/util/term.ts","line":6,"name":"bold"},{"file":"src/util/term.ts","line":10,"name":"cyan"},{"file":"src/types.ts","line":13,"name":"CodeSymbol"},{"file":"src/util/term.ts","line":5,"name":"dim"},{"file":"src/report/why.ts","line":25,"name":"renderOne"}],"reachesCount":7,"findings":[]},{"id":"src/report/why.ts#renderOne","name":"renderOne","kind":"function","line":25,"loc":43,"exported":false,"usedBy":[{"file":"src/report/why.ts","line":22,"name":"renderWhy"}],"used aph: CodeGraph, query: string, root: string): string {","  const { contexts, suggestions } = lookup(graph, query, root);","","  if (contexts.length === 0) {","    if (suggestions.length === 0) return `\\nNo symbol named ${bold(query)}.\\n`;","    const list = suggestions","      .map((s) =\u003e `  ${cyan(s.name)} ${dim(`${s.file}:${s.line}`)}`)","      .join('\\n');","    return `\\nNo exact match for ${bold(query)}. Did you mean:\\n${list}\\n`;","  }","","  return contexts.map((context) =\u003e renderOne(context, graph)).join('\\n');","}","","function renderOne(context: SymbolContext, graph: CodeGraph): string {","  const { symbol, intent } = context;","  const out: string[] = [''];","","  out.push(`${bold(symbol.name)} ${dim(`· ${symbol.kind}${symbol.exported ? ' · exported' : ''}`)}`);","  out.push(`${dim('declared')}  ${cyan(`${symbol.file}:${symbol.line}`)} ${dim(`(${symbol.loc} lines)`)}`);","","  if (intent) {","    const badge = intent.status === 'confirmed' ? green('confirmed') : yellow('draft');","    out.push(`${dim('intent')}    ${intent.purpose} ${dim(`[${badge}]`)}`);","    if (intent.notFor) out.push(`${dim('not for')}   ${intent.notFor}`);","  }","","  out.push('');","  out.push(","    section(","      'used by',","      uniqueCallers(context, graph).map((c) =\u003e ({ name: c.symbol.name, file: c.file, line: c.line })),","    ),","  );","  if (context.importedBy.length \u003e 0) {","    // Importing is not using; a file may import a symbol and pass it straight on.","    out.push(","      `  ${bold('imported by')} ${dim(`(${context.importedBy.length})`)}\\n` +","        `    ${dim(context.importedBy.slice(0, 6).join(', '))}` +","        (context.importedBy.length \u003e 6 ? dim(` and ${context.importedBy.length - 6} more`) : '') +","        '\\n',","    );","  }","  out.push(","    section(","      'reaches',","      context.reaches.map((s) =\u003e ({ name: s.name, file: s.file, line: s.line })),","    ),","  );","","  if (context.orphaned) {","    out.push(`  ${yellow('!')} Nothing calls this and it is not exported. It is a deletion candidate.`);","    out.push('');","  }","","  return out.join('\\n');","}","","interface Ref {","  name: string;","  file: string;","  line: number;","}","","function section(label: string, refs: Ref[]): string {","  if (refs.length === 0) return `  ${dim(label.padEnd(12))} ${dim('nothing')}\\n`;","","  const grouped = new Map\u003cstring, Ref[]\u003e();","  for (const ref of refs) {","    const list = grouped.get(ref.file);","    if (list) list.push(ref);","    else grouped.set(ref.file, [ref]);","  }","","  // Count what is listed: rows are files, so a count of edges disagreed with","  // the list underneath it.","  const lines = [","    `  ${bold(label)} ${dim(`(${refs.length} in ${grouped.size} file${grouped.size === 1 ? '' : 's'})`)}`,","  ];","","  for (const [file, group] of [...grouped].slice(0, 12)) {","    lines.push(`    ${cyan(`${file}:${group[0].line}`)} ${dim(group.map((r) =\u003e r.name).join(', '))}`);","  }","  if (grouped.size \u003e 12) lines.push(`    ${dim(`… and ${grouped.size - 12} more files`)}`);","","  return `${lines.join('\\n')}\\n`;","}",""]},{"path":"src/types.ts","loc":197,"findings":[],"symbols":[{"id":"src/types.ts#SymbolKind","name":"SymbolKind","kind":"type","line":3,"loc":9,"exported":true,"usedBy":[{"file":"src/types.ts","line":17,"name":"CodeSymbol"},{"file":"src/index/symbol.ts","line":13,"name":"SymbolInput"},{"file":"src/index/extract.ts","line":412,"name":"record"},{"file":"src/index/python.ts","line":291,"name":"record"},{"file":"src/index/go.ts","line":219,"name":"declare"},{"file":"src/index/go.ts","line":271,"name":"record"},{"file":"src/index/swift.ts","line":124,"name":"buildSwiftGraph"},{"file":"src/index/swift.ts","line":282,"name":"record"}],"usedByCount":8,"reaches":[],"reachesCount":0,"findings":[]},{"id":"src/types.ts#CodeSymbol","name":"CodeSymbol","kind":"interface","line":13,"loc":37,"exported":true,"usedBy":[{"file":"src/t ** Reachable from an entrypoint or public API surface. */","  loc: number;","  /** Normalised source used for duplicate detection. */","  body: string;","  /** Shape signature: parameter count/kinds and return, resolution-free. */","  signature: string;","  /** Concept cluster id, assigned by the concept analysis. */","  conceptId?: number;","}","","export type EdgeKind = 'calls' | 'imports' | 'extends' | 'implements' | 'references';","","export interface Edge {","  from: string;","  to: string;","  kind: EdgeKind;","  file: string;","  line: number;","}","","export interface FileRecord {","  path: string;","  loc: number;","  hash: string;","  /** Epoch millis of last index. */","  indexedAt: number;","}","","export interface CodeGraph {","  root: string;","  /**","   * Comment-stripped source per file.","   *","   * Analyses that look for patterns rather than for symbols need the whole","   * file: a great deal of real code — module-level configuration, anything","   * inside a `describe()` callback — belongs to no recorded symbol, and reading","   * only symbol bodies made those analyses blind to it.","   */","  sources: Map\u003cstring, string\u003e;","  symbols: Map\u003cstring, CodeSymbol\u003e;","  edges: Edge[];","  files: Map\u003cstring, FileRecord\u003e;","  entrypoints: string[];","  /** Places that reach code by a name computed at run time, which no static graph follows. */","  dynamicSites: DynamicSite[];","  /** Symbols a language runtime or framework calls by itself, found while indexing. */","  roots?: string[];","  createdAt: number;","}","","/**"," * `handlers[type]()`, `import(\\`./locales/${lang}\\`)`, `getattr(obj, name)`."," *"," * Kept rather than discarded because it is the honest boundary of the"," * analysis: an unreachable symbol near one of these is a question, not a"," * finding, and the list says exactly where a plugin rule or a coverage report"," * would settle it."," */","export interface DynamicSite {","  file: string;","  line: number;","  kind: 'import' | 'member' | 'reflection';","  /** The expression, trimmed, as written. */","  text: string;","}","","export type FindingKind = 'dead' | 'duplicate' | 'drift' | 'contradiction' | 'orphan-file' | 'unfinished';","","export type Severity = 'high' | 'medium' | 'low';","","export interface Finding {","  id: string;","  kind: FindingKind;","  severity: Severity;","  title: string;","  detail: string;","  /** Primary location, for navigation. */","  file: string;","  line: number;","  /** Symbols this finding is about. Duplicates have several. */","  symbols: string[];","  /** Lines of code this finding covers; drives ranking and the budget. */","  loc: number;","  /** 0..1 confidence, drives ranking and the noise budget cut-off. */","  score: number;","  /**","   * What to do about it, in one imperative sentence.","   *","   * A finding that states a problem and stops leaves the reader to invent the","   * remedy, which is the step most people skip.","   */","  action: string;","  /** Extra payload, shaped per finding kind, rendered by the report. */","  evidence?: Record\u003cstring, unknown\u003e;","}","","export interface Concept {","  id: number;","  name: string;","  description: string;","  symbols: string[];","  loc: number;","  /** Concept ids this one depends on, with edge weight. */","  couples: Array\u003c{ to: number; weight: number }\u003e;","}","","export interface IntentRecord {","  symbol: string;","  /** Why this exists. */","  purpose: string;","  /** What it is explicitly not for. Guards against scope drift. */","  notFor: string;","  /** 'human' records are trusted; 'draft' ones await confirmation. */","  status: 'draft' | 'confirmed';","  updatedAt: number;","}","","export interface Budget {","  dead: number;","  duplicate: number;","  drift: number;","  contradiction: number;","  unfinished?: number;","  ignored?: number;","  createdAt: number;","}","","export interface RepoInfo {","  url: string;","  ref: string;","  blobPath: string;","}","","export interface AnalysisResult {","  graph: CodeGraph;","  findings: Finding[];","  concepts: Concept[];","  stats: Stats;","}","","export interface Stats {","  files: number;","  symbols: number;","  edges: number;","  loc: number;","  deadLoc: number;","  duplicateLoc: number;","  driftCount: number;","  contradictionCount: number;","  /** State nothing sets and bodies that only say they are not written yet. */","  unfinishedCount: number;","  /** `instantiate-ignore` comments that hid a finding. A budget line, so it only grows on purpose. */","  ignoredCount: number;","  indexMs: number;","  analyseMs: number;","}",""]},{"path":"src/util/glob.ts","loc":69,"findings":[],"symbols":[{"id":"src/util/glob.ts#cache","name":"cache","kind":"variable","line":6,"loc":1,"exported":false,"usedBy":[{"file":"src/util/glob.ts","line":9,"name":"globToRegExp"}],"usedByCount":1,"reaches":[],"reachesCount":0,"findings":[]},{"id":"src/util/glob.ts#globToRegExp","name":"globToRegExp","kind":"function","line":8,"loc":57,"exported":true,"usedBy":[{"file":"src/util/glob.ts","line":67,"name":"matchesAny"}],"usedByCount":1,"reaches":[{"file":"src/util/glob.ts","line":6,"name":"cache"}],"reachesCount":1,"findings":[]},{"id":"src/util/glob.ts#matchesAny","name":"matchesAny","kind":"function","line":66,"loc":3,"exported":true,"usedBy":[{"file":"src/index/extract.ts","line":324,"name":"discoverFiles"},{"file":"src/analysis/dead.ts","line":31,"name":"findDeadCode"}],"usedByCount":2,"reaches":[{"file":"src/util/glob.ts","line":8,"name":"globToRegExp"}],"reachesCount":1,"findings":[]}],"usedBy":[{"path":"src/analysis/dead.ts","count":3},{"path":"src/index/extract.ts","count":3},{"path":"test/glob.test.ts","count":3}],"uses":[],"marks":[],"source":["/**"," * Minimal glob matcher: `**`, `*`, `?`, `{a,b}`, character classes."," * Paths are always `/`-separated and relative to the project root."," */","","const cache = new Map\u003cstring, RegExp\u003e();","","export function globToRegExp(glob: string): RegExp {","  const cached = cache.get(glob);","  if (cached) return cached;","","  let re = '';","  let i = 0;","  const braces: number[] = [];","","  while (i \u003c glob.length) {","    const c = glob[i];","    if (c === '*') {","      if (glob[i + 1] === '*') {","        // `**/` may match zero directories, so the slash is part of the optional group.","        if (glob[i + 2] === '/') {","          re += '(?:.*/)?';","          i += 3;","          continue;","        }","        re += '.*';","        i += 2;","        continue;","      }","      re += '[^/]*';","      i++;","    } else if (c === '?') {","      re += '[^/]';","      i++;","    } else if (c === '{') {","      braces.push(i);","      re += '(?:';","      i++;","    } else if (c === '}') {","      braces.pop();","      re += ')';","      i++;","    } else if (c === ',' \u0026\u0026 braces.length \u003e 0) {","      re += '|';","      i++;","    } else if (c === '[') {","      const close = glob.indexOf(']', i);","      if (close === -1) {","        re += '\\\\[';","        i++;","      } else {","        re += glob.slice(i, close + 1);","        i = close + 1;","      }","    } else {","      re += c.replace(/[.+^${}()|[\\]\\\\]/g, '\\\\$\u0026');","      i++;","    }","  }","","  const compiled = new RegExp(`^${re}$`);","  cache.set(glob, compiled);","  return compiled;","}","","export function matchesAny(path: string, globs: string[]): boolean {","  return globs.some((g) =\u003e globToRegExp(g).test(path));","}",""]},{"path":"src/util/repo.ts","loc":60,"findings":[],"symbols":[{"id":"src/util/repo.ts#Repo","name":"Repo","kind":"interface","line":11,"loc":8,"exported":true,"usedBy":[{"file":"src/util/repo.ts","line":20,"name":"detectRepo"}],"usedByCount":1,"reaches":[],"reachesCount":0,"findings":[]},{"id":"src/util/repo.ts#detectRepo","name":"detectRepo","kind":"function","line":20,"loc":14,"exported":true,"usedBy":[{"file":"src/api.ts","line":109,"name":"scan"}],"usedByCou return { url, ref, blobPath: url.includes('bitbucket.org') ? 'src' : 'blob' };","}","","function git(root: string, args: string[]): string | undefined {","  try {","    return execFileSync('git', args, {","      cwd: root,","      encoding: 'utf8',","      stdio: ['ignore', 'pipe', 'ignore'],","    }).trim();","  } catch {","    return undefined; // Not a repository, or no remote: neither is an error here.","  }","}","","/** SSH and https forms of the same remote, reduced to something browsable. */","function normalise(remote: string): string | undefined {","  let url = remote.trim().replace(/\\.git$/, '');","","  // git@host:org/name  -\u003e  https://host/org/name","  const ssh = url.match(/^[\\w.-]+@([^:]+):(.+)$/);","  if (ssh) url = `https://${ssh[1]}/${ssh[2]}`;","  else if (url.startsWith('ssh://')) url = url.replace(/^ssh:\\/\\/(?:[^@]+@)?/, 'https://');","  else if (url.startsWith('git://')) url = url.replace(/^git:\\/\\//, 'https://');","","  // Anything that is not a URL by now is a local path, which nobody can open.","  return /^https?:\\/\\/[^/]+\\/.+/.test(url) ? url : undefined;","}",""]},{"path":"src/util/term.ts","loc":25,"findings":[],"symbols":[{"id":"src/util/term.ts#enabled","name":"enabled","kind":"variable","line":1,"loc":1,"exported":false,"usedBy":[{"file":"src/util/term.ts","line":3,"name":"wrap"}],"usedByCount":1,"reaches":[],"reachesCount":0,"findings":[]},{"id":"src/util/term.ts#wrap","name":"wrap","kind":"function","line":3,"loc":1,"exported":false,"usedBy":[{"file":"src/util/term.ts","line":5,"name":"dim"},{"file":"src/util/term.ts","line":6,"name":"bold"},{"file":"src/util/term.ts","line":7,"name":"red"},{"file":"src/util/term.ts","line":8,"name":"green"},{"file":"src/util/term.ts","line":9,"name":"yellow"},{"file":"src/util/term.ts","line":10,"name":"cyan"}],"usedByCount":6,"reaches":[{"file":"src/util/term.ts","line":1,"name":"enabled"}],"reachesCount":1,"findings":[]},{"id":"src/util/term.ts#dim","name":"dim","kind":"variable","lin rtainty, got ${dead[0].score}`);","  assert.match(dead[0].detail, /no test executed it/);","});","","test('coverage.py reports are understood too', () =\u003e {","  const path = join(scratch, 'python.json');","  writeFileSync(","    path,","    JSON.stringify({ files: { 'src/pkg/base.py': { executed_lines: [1, 2, 3] } } }),","  );","  const coverage = readCoverage(join(here, 'fixtures', 'python2'), path);","  assert.equal(coverage.format, 'coverage.py');","  assert.deepEqual([...(coverage.executed.get('src/pkg/base.py') ?? [])], [1, 2, 3]);","});","","test('an unreadable report fails with something actionable', () =\u003e {","  const path = join(scratch, 'nonsense.json');","  writeFileSync(path, JSON.stringify({ nothing: 'useful' }));","  assert.throws(() =\u003e readCoverage(root, path), /coverage-final\\.json|coverage json/);","});",""]},{"path":"test/dupe-shapes.test.ts","loc":74,"findings":[],"symbols":[{"id":"test/dupe-shapes.test.ts#here","name":"here","kind":"variable","line":7,"loc":1,"exported":false,"usedBy":[{"file":"test/dupe-shapes.test.ts","line":8,"name":"result"}],"usedByCount":1,"reaches":[],"reachesCount":0,"findings":[]},{"id":"test/dupe-shapes.test.ts#result","name":"result","kind":"variable","line":8,"loc":1,"exported":false,"usedBy":[{"file":"test/dupe-shapes.test.ts","line":9,"name":"clusters"}],"usedByCount":1,"reaches":[{"file":"src/api.ts","line":36,"name":"scan"},{"file":"test/dupe-shapes.test.ts","line":7,"name":"here"}],"reachesCount":2,"findings":[]},{"id":"test/dupe-shapes.test.ts#clusters","name":"clusters","kind":"variable","line":9,"loc":1,"exported":false,"usedBy":[{"file":"test/dupe-shapes.test.ts","line":10,"name":"names"}],"usedByCount":1,"reaches":[{"file":"test/dupe-shapes.test.ts","line":8,"name":"result"},{"file":"src/types.ts","line":174,"name":"AnalysisResult"},{"file":"src/types.ts","line":111,"name":"Finding"}],"reachesCount":3,"findings":[]},{"id":"test/dupe-shapes.test.ts#names","name":"names","kind":"variable","line": ry other');","noCluster('head', 'a named door onto one shared function');","noCluster('options', 'a named door onto one shared function');","noCluster('checksRequired', 'a test file repeats its scaffolding on purpose');","noCluster('helpOption', 'a designed set differing in exactly one word');","","test('mirrored API surfaces are demoted, not reported as redundancy', () =\u003e {","  // Two directories sharing most of their symbol names are two views of one","  // idea — zod's classic and mini — where matching structure is the design.","  const parallel = clusters.filter((c) =\u003e c.title.includes('parallel'));","  assert.ok(parallel.length \u003e 0, 'expected the mirrored directories to be recognised');","  for (const cluster of parallel) {","    assert.ok(cluster.score \u003c 0.5, `${cluster.title} should be low confidence, got ${cluster.score}`);","  }","});","","test('a genuine accidental duplicate is still caught', () =\u003e {","  // Suppressing all of the above must not suppress the case this tool is for.","  const genuine = names.find(","    (group) =\u003e group.includes('renderInvoiceTotal') \u0026\u0026 group.includes('formatReceiptTotal'),","  );","  assert.ok(genuine, `expected the real duplicate to be found; got ${JSON.stringify(names)}`);","  const finding = clusters.find((c) =\u003e c.symbols.some((s) =\u003e s.endsWith('#renderInvoiceTotal')))!;","  assert.ok(finding.score \u003e= 0.6, `expected reasonable confidence, got ${finding.score}`);","});","","test('one name implemented by several classes is polymorphism', () =\u003e {","  // Each class must supply its own; that is the design, not a repetition.","  const finding = clusters.find((c) =\u003e c.symbols.every((s) =\u003e s.endsWith('.extract')));","  assert.ok(finding, 'expected the two extract implementations to be recognised');","  assert.ok(finding.score \u003c 0.4, `expected strong demotion, got ${finding.score}`);","});","","test('test files are excluded by default and surfaced on request', async () =\u003e {","  const { scan: rescan } = await import('../src/api.js');","  const { loadConfig } = await import('../src/config.js');","  const root = join(here, 'fixtures', 'dupe-shapes');","  const withTests = await rescan({","    root,","    config: { ...loadConfig(root), includeTests: true },","  });","  const named = (r: typeof withTests): string[] =\u003e","    r.findings.filter((f) =\u003e f.kind === 'duplicate').flatMap((f) =\u003e f.symbols.map((s) =\u003e s.split('#')[1]));","","  assert.ok(!named(result).includes('checksRequired'), 'tests should be hidden by default');","  assert.ok(named(withTests).includes('checksRequired'), '--include-tests should surface them');","});","","test('parallel sets do not inflate the headline number', () =\u003e {","  // Only the genuine duplicate should count towards the CI budget.","  assert.ok(result.stats.duplicateLoc \u003e 0, 'the genuine duplicate should count');","  assert.ok(result.stats.duplicateLoc \u003c 30, `parallel sets leaked into the total: ${result.stats.duplicateLoc}`);","});",""]},{"path":"test/dupes.test.ts","loc":52,"findings":[],"symbols":[{"id":"test/dupes.test.ts#here","name":"here","kind":"variable","line":7,"loc":1,"exported":false,"usedBy":[{"file":"test/dupes.test.ts","line":9,"name":"parallel"},{"file":"test/dupes.test.ts","line":10,"name":"messy"}],"usedByCount":2,"reaches":[],"reachesCount":0,"findings":[]},{"id":"test/dupes.test.ts#parallel","name":"parallel","kind":"variable","line":9,"loc":1,"exported":false,"usedBy":[],"usedByCount":0,"reaches":[{"file":"src/api.ts","line":36,"name":"scan"},{"file":"test/dupes.test.ts","line":7,"name":"here"}],"reachesCount":2,"findings":[]},{"id":"test/dupes.test.ts#messy","name":"messy","kind":"variable","line":10,"loc":1,"exported":false,"usedBy":[],"usedByCount":0,"reaches":[{"file":"src/api.ts","line":36,"name":"scan"},{"file":"test/dupes.test.ts","line":7,"name":"here"}],"reachesCount":2,"findings":[]}],"usedBy":[],"uses":[{"path":"src/api.ts","count":4},{"path":"src/types.ts","count":3}],"marks":[],"source":["import { test } from 'node:test';","import assert from 'node:assert/strict';","import { fileURLToPath } from 'node:url';","import { dirname, join } from 'node:path';","import { scan } from '../src/api.js';","","const here = dirname(fileURLToPath(import.meta.url));","","const parallel = await scan({ root: join(here, 'fixtures', 'parallel') });","const messy = await scan({ root: join(here, 'fixtures', 'messy') });","","test('one implementation per file is a parallel set, not redundancy', () =\u003e {","  // zod's sixty translations were reported as \"60 implementations of the same","  // thing\" at 98% confidence. Identical structure is the point of a locale file.","  const clusters = parallel.findings.filter((f) =\u003e f.kind === 'duplicate');","  assert.equal(clusters.length, 1, 'expected the translations to form one cluster');","","  const cluster = clusters[0];","  assert.ok(cluster.score \u003c 0.5, `expected low confidence, got ${cluster.score}`);","  assert.equal(cluster.severity, 'low');","  assert.match(cluster.title, /parallel implementations/);","});","","test('a parallel set does not count towards the headline number', () =\u003e {","  // The headline drives the CI budget, so it must not be inflated by a finding","  // the analysis does not itself stand behind.","  assert.equal(parallel.stats.duplicateLoc, 0);","});","","test('a title never lists more than a few names', () =\u003e {","  for (const finding of [...parallel.findings, ...messy.findings]) {","    assert.ok(finding.title.length \u003c 140, `title too long: ${finding.title.slice(0, 80)}…`);","  }","});","","test('genuine re-implementations are still caught at high confidence', () =\u003e {","  // Suppressing parallel sets must not suppress the case this tool exists for.","  const cluster = messy.findings.find((f) =\u003e f.kind === 'duplicate' \u0026\u0026 f.symbols.length \u003e= 3);","  assert.ok(cluster, 'expected the three time formatters to still cluster');","  assert.ok(cluster.score \u003e= 0.7, `expected high confidence, got ${cluster.score}`);","});","","test('constructors are never duplicate candidates', () =\u003e {","  // Every Error subclass constructor is `super(message); this.name = '...'`.","  for (const finding of [...parallel.findings, ...messy.findings]) {","    if (finding.kind !== 'duplicate') continue;","    for (const id of finding.symbols) {","      assert.ok(!id.endsWith('.constructor'), `constructor reported as duplicate: ${id}`);","    }","  }","});",""]},{"path":"test/dynamic.test.ts","loc":122,"findings":[],"symbols":[{"id":"test/dynamic.test.ts#here","name":"here","kind":"variable","line":12,"loc":1,"exported":false,"usedBy":[{"file":"test/dynamic.test.ts","line":13,"name":"root"}],"usedByCount":1,"reaches":[],"reachesCount":0,"findings":[]},{"id":"test/dynamic.test.ts#root","name":"root","kind":"variable","line":13,"loc":1,"exported":false,"usedBy":[{"file":"test/dynamic.test.ts","line":14,"name":"result"}],"usedByCount":1,"reaches":[{"file":"test/dynamic.test.ts","line":12,"name":"here"}],"reachesCount":1,"findings":[]},{"id":"test/dynamic.test.ts#result","name":"result","kind":"variable","line":14,"loc":1,"exported":false,"usedBy":[{"file":"test/dynamic.test.ts","line":16,"name":"dead"}],"usedByCount":1,"reaches":[{"file":"src/api.ts","line":36,"name":"scan"},{"file":"test/dynamic.test.ts","line":13,"name":"root"}],"reachesCount":2,"findings":[]},{"id":"test/dynamic.test.ts#dead","name":"dead","kind":"variable","line":16,"loc":1,"exported":false,"usedBy":[{"file":"test/dynamic.test.ts","line":18,"name":"verdictOf"}],"usedByCount":1,"reaches":[{"file":"test/dynamic.test.ts","line":14,"name":"result"},{"file":"src/types.ts","line":174,"name":"AnalysisResult"},{"file":"src/types.ts","line":111,"name":"Finding"}],"reachesCount":3,"findings":[]},{"id":"test/dynamic.test.ts#verdictOf","name":"verdictOf","kind":"function","line":17,"loc":4,"exported":false,"usedBy":[],"usedByCount":0,"reaches":[{"file":"test/dynamic.test.ts","line":16,"name":"dead"},{"file":"src/types.ts","line":111,"name":"Finding"}],"reachesCount":2,"findings":[]}],"usedBy":[],"uses":[{"path":"src/types.ts","count":7},{"path":"src/api.ts","count":4},{"path":"src/plugins.ts","count":4},{"path":"src/analysis/coverage.ts","count":3},{"path":"src/config.ts","count":1}],"marks":[],"source":["import { test } from 'node:test';","import assert from 'node:assert/strict';","import { fileURLToPath } from 'node:url';","import { dirname, join } from 'node:path';","import { execFileSync } from 'node:child_process';","import { mkdtempSync, writeFileSync } from 'node:fs';","import { tmpdir } from 'node:os';","import { scan } from '../src/api.js';","import { readCoverage } from '../src/analysis/coverage.js';","import { activePlugins, rootingPlugin } from '../src/plugins.js';","","const here = dirname(fileURLToPath(import.meta.url));","const root = join(here, 'fixtures', 'dynamic');","const result = await scan({ root });","","const dead = result.findings.filter((f) =\u003e f.kind === 'dead' || f.kind === 'orphan-file');","const verdictOf = (name: string): string | undefined =\u003e {","  const finding = dead.find((f) =\u003e f.symbols.some((s) =\u003e s.split('#')[1].split('.').pop() === name));","  return finding ? String(finding.evidence?.verdict ?? 'orphan') : undefined;","};","","test('a framework plugin turns on only when the project depends on it', () =\u003e {","  const names = result.config.plugins.map((p) =\u003e p.name);","  assert.ok(names.includes('nestjs'), 'package.json depends on @nestjs/core');","  assert.ok(names.includes('flask'), 'requirements.txt lists flask');","  assert.ok(!names.includes('django'), 'nothing depends on django');","});","","test('decorated framework code is alive though nothing names it', () =\u003e {","  assert.equal(verdictOf('CatsController'), undefined);","  assert.equal(verdictOf('findAll'), undefined, '@Get() registers the method');","  assert.equal(verdictOf('listCats'), undefined, 'reached through the rooted method');","  assert.equal(verdictOf('health'), undefined, '@app.route registers the view');","});","","test('undecorated code beside framework code is still reported', () =\u003e {","  assert.equal(verdictOf('forgotten_view'), 'dead');","});","","test('a project rule roots a one-off symbol and what it calls', () =\u003e {","  assert.equal(verdictOf('loadedByTheOldShell'), undefined);","  assert.equal(verdictOf('helperOnlyTheShellPathUses'), undefined);","});","","test('a key typed as a union of literals reaches exactly those members', () =\u003e {","  assert.equal(verdictOf('get'), undefined);","  assert.equal(verdictOf('post'), undefined);","  assert.equal(verdictOf('purge'), 'dead', 'not a value the key can take');","});","","test('a computed import reaches every file its prefix completes to', () =\u003e {","  assert.equal(verdictOf('greetEnglish'), undefined);","  assert.equal(verdictOf('greetNorwegian'), undefined);","});","","test('python reflection: literal getattr and prefixed import_module resolve', () =\u003e {","  assert.equal(verdictOf('refresh'), undefined, 'getattr(obj, \"refresh\")');","  assert.equal(verdictOf('export_csv'), undefined, 'import_module(f\"app.plugins.{name}\")');","  assert.equal(verdictOf('unused_task'), 'dead');","});","","test('a name written in a data file is a question, not a verdict', () =\u003e {","  const finding = dead.find((f) =\u003e f.title.startsWith('NightlyInvoiceJob'));","  assert.ok(finding, 'still shown');","  assert.equal(finding.evidence?.verdict, 'unknown');","  assert.equal(finding.evidence?.nameAppearsIn, 'jobs.yml');","  assert.ok(finding.score \u003c 0.5, 'kept out of the headline number');","  // Its members go wherever the class goes, and the file is not rolled up","  // into a confident \"delete this file\".","  assert.equal(verdictOf('run'), 'unknown');","  assert.ok(!dead.some((f) =\u003e f.kind === 'orphan-file' \u0026\u0026 f.file === 'src/jobs.ts'));","});","","test('what cannot be followed is listed, not silently hedged', () =\u003e {","  const places = result.graph.dynamicSites.map((s) =\u003e `${s.file}:${s.kind}`);","  assert.ok(places.includes('src/handlers.ts:member'), 'handlers[kind]()');","  assert.ok(places.includes('app/web.py:reflection'), 'getattr(plugin, name)');","  assert.ok(result.warnings.some((w) =\u003e w.includes('computed at run time')));","});","","test('plugin names match functions and methods, never variables', () =\u003e {","  const [react] = activePlugins(root, [{ name: 'react', names: ['render'] }]).filter((p) =\u003e p.name === 'react');","  const symbol = { id: 'a.ts#render', name: 'render', file: 'a.ts', line: 1, endLine: 1, exported: false, loc: 1, body: '', signature: '' };","  assert.ok(rootingPlugin({ ...symbol, kind: 'function' }, [react]));","  assert.equal(rootingPlugin({ ...symbol, kind: 'variable' }, [react]), undefined);","});","","test('a raw V8 trace from a real run counts as coverage', async () =\u003e {","  // A production trace is the same idea as test coverage with better data:","  // whatever users exercised is alive, including paths no test tried.","  const project = mkdtempSync(join(tmpdir(), 'instantiate-v8-'));","  writeFileSync(join(project, 'package.json'), '{ \"name\": \"v8\", \"private\": true }\\n');","  writeFileSync(join(project, '.instantiate.yml'), 'entrypoints: [\"main.js\"]\\n');","  writeFileSync(","    join(project, 'lib.js'),","    [","      'function used() {',","      \"  return 'ran';\",","      '}',","      'function unused() {',","      \"  return 'never';\",","      '}',","      'module.exports = { used };',","      '',","    ].join('\\n'),","  );","  writeFileSync(join(project, 'main.js'), \"const lib = require('./lib.js');\\nlib[process.argv[2]]();\\n\");","  const traces = join(project, 'traces');","  execFileSync(process.execPath, ['main.js', 'used'], { cwd: project, env: { ...process.env, NODE_V8_COVERAGE: traces } });","","  const coverage = readCoverage(project, traces);","  assert.equal(coverage.format, 'v8');","  assert.ok(coverage.executed.get('lib.js')?.has(2), 'the body of used() ran');","  assert.ok(!coverage.executed.get('lib.js')?.has(5), 'the body of unused() did not');","","  const traced = await scan({ root: project, coverage });","  const names = traced.findings.filter((f) =\u003e f.kind === 'dead').map((f) =\u003e f.title);","  assert.ok(!names.some((t) =\u003e t.startsWith('used ')), 'used() ran in the trace');","  const unused = traced.findings.find((f) =\u003e f.title.startsWith('unused '));","  assert.ok(unused \u0026\u0026 unused.score \u003e 0.9, 'unused() was watched and never ran');","});",""]},{"path":"test/glob.test.ts","loc":31,"findings":[],"symbols":[],"usedBy":[],"uses":[{"path":"src/util/glob.ts","count":3}],"marks":[],"source":["import { test } from 'node:test';","import assert from 'node:assert/strict';","import { globToRegExp, matchesAny } from '../src/util/glob.js';","","test('star does not cross directory boundaries', () =\u003e {","  assert.ok(globToRegExp('src/*.ts').test('src/a.ts'));","  assert.ok(!globToRegExp('src/*.ts').test('src/deep/a.ts'));","});","","test('globstar matches zero or more directories', () =\u003e {","  const re = globToRegExp('src/**/*.ts');","  assert.ok(re.test('src/a.ts'), 'zero directories');","  assert.ok(re.test('src/deep/nested/a.ts'), 'several directories');","});","","test('braces expand to alternatives', () =\u003e {","  const re = globToRegExp('**/*.{test,spec}.ts');","  assert.ok(re.test('test/glob.test.ts'));","  assert.ok(re.test('a/b/x.spec.ts'));","  assert.ok(!re.test('a/b/x.ts'));","});","","test('exclude globs match node_modules at any depth', () =\u003e {","  assert.ok(matchesAny('node_modules/foo/index.js', ['**/node_modules/**']));","  assert.ok(matchesAny('packages/a/node_modules/b/i.js', ['**/node_modules/**']));","});","","test('dots in the pattern are literal', () =\u003e {","  as ive('DocsOnlyComponent', 'imported from an .mdx page that is never itself indexed');","alive('neverUsedButVendored', 'vendored code is somebody else\\'s contract, not our finding');","","test('genuinely unreachable code is still reported', () =\u003e {","  // The whole point: suppressing false positives must not suppress true ones.","  assert.ok(","    deadNames.includes('nothingCallsThisAtAll'),","    `expected the one dead function to be found, got: ${deadNames.join(', ') || 'nothing'}`,","  );","});","","test('this fixture yields exactly one dead finding', () =\u003e {","  assert.equal(dead.length, 1, `unexpected findings: ${deadNames.join(', ')}`);","});","","test('a subpath import resolves through package.json imports', () =\u003e {","  const edges = result.graph.edges.filter((e) =\u003e e.to.startsWith('vendor/lib/index.ts#'));","  assert.ok(edges.length \u003e 0, 'expected #vendored to resolve to the vendored module');","});","","test('satellite files become graph roots', () =\u003e {","  const satellite = result.graph.edges.filter((e) =\u003e e.from.endsWith('#\u003csatellite\u003e'));","  assert.ok(satellite.length \u003e 0, 'expected the .mdx page to contribute edges');","});",""]},{"path":"test/patterns2.test.ts","loc":68,"findings":[],"symbols":[{"id":"test/patterns2.test.ts#here","name":"here","kind":"variable","line":7,"loc":1,"exported":false,"usedBy":[{"file":"test/patterns2.test.ts","line":14,"name":"ts"},{"file":"test/patterns2.test.ts","line":15,"name":"py"}],"usedByCount":2,"reaches":[],"reachesCount":0,"findings":[]},{"id":"test/patterns2.test.ts#ts","name":"ts","kind":"variable","line":14,"loc":1,"exported":false,"usedBy":[{"file":"test/patterns2.test.ts","line":17,"name":"deadIn"},{"file":"test/patterns2.test.ts","line":20,"name":"tsDead"}],"usedByCount":2,"reaches":[{"file":"src/api.ts","line":36,"name":"scan"},{"file":"test/patterns2.test.ts","line":7,"name":"here"}],"reachesCount":2,"findings":[]},{"id":"test/patterns2.test.ts#py","name":"p dirname, join } from 'node:path';","import { scan } from '../src/api.js';","","const here = dirname(fileURLToPath(import.meta.url));","","/**"," * The third validation round used three repositories the tool had never seen"," * and scored 1/26, because it had been fitted to the ones it was tuned against."," * Every pattern below is one of those false positives."," */","const ts = await scan({ root: join(here, 'fixtures', 'patterns2') });","const py = await scan({ root: join(here, 'fixtures', 'python2') });","","const deadIn = (result: typeof ts): string[] =\u003e","  result.findings.filter((f) =\u003e f.kind === 'dead').map((f) =\u003e f.symbols[0].split('#')[1]);","","const tsDead = deadIn(ts);","const pyDead = deadIn(py);","","const alive = (result: 'ts' | 'py', member: string, why: string): void =\u003e {","  test(`${result}: ${member} is reachable — ${why}`, () =\u003e {","    const dead = result === 'ts' ? tsDead : pyDead;","    assert.ok(","      !dead.some((d) =\u003e d === member || d.endsWith(`.${member}`)),","      `${member} was reported dead; ${why}`,","    );","  });","};","","alive('ts', 'readable', 'object shorthand: `{ readable }` means `{ readable: readable }`');","alive('ts', 'writable', 'object shorthand');","alive('ts', 'duplex', 'object shorthand');","alive('ts', '~internalRender', 'named with a string, so no identifier refers to it');","alive('ts', 'toJSON', 'the runtime calls it when the value is serialised');","alive('ts', 'render', 'calls resolve to the ambient declaration, not this implementation');","alive('ts', 'resize', 'calls resolve to the ambient declaration, not this implementation');","alive('ts', 'Registry', 'augmented by a `declare module` block');","","alive('py', 'format', 'an override; the base calls self.format() and that is what runs');","alive('py', 'register', 'called from a nested function inside a decorator factory');","alive('py', 'shorten', 'reached through `from . import helpers`, a submodule import');","alive('py', '__getattr__', \"Python's module attribute hook, called by the import machinery\");","alive('py', 'example_only', 'examples are run directly, and the glob must cover .py');","alive('py', 'entry', 'called under the __main__ guard');","","test('each fixture still reports its one genuinely dead symbol', () =\u003e {","  // Suppressing false positives must never suppress the true ones.","  assert.deepEqual(tsDead, ['trulyUnreachable']);","  assert.deepEqual(pyDead, ['never_used_at_all']);","});","","test('a file where nothing is reachable is one finding, not one per symbol', () =\u003e {","  // Seventeen of zod's top twenty findings were two dead files between them,","  // reported per symbol, which pushed every independent finding out of view.","  const orphans = ts.findings.filter((f) =\u003e f.kind === 'orphan-file');","  assert.equal(orphans.length, 1, `expected one orphan file, got ${orphans.length}`);","  assert.match(orphans[0].file, /unused-module\\.ts$/);","  assert.ok(orphans[0].symbols.length \u003e= 3, 'the finding should carry every symbol in the file');","","  // And its symbols must not also appear as separate findings.","  for (const name of ['abandonedBuild', 'abandonedParse']) {","    assert.ok(!tsDead.includes(name), `${name} should be rolled up into the file finding`);","  }","});",""]},{"path":"test/python.test.ts","loc":55,"findings":[],"symbols":[{"id":"test/python.test.ts#here","name":"here","kind":"variable","line":7,"loc":1,"exported":false,"usedBy":[{"file":"test/python.test.ts","line":8,"name":"result"}],"usedByCount":1,"reaches":[],"reachesCount":0,"findings":[]},{"id":"test/python.test.ts#result","name":"result","kind":"variable","line":8,"loc":1,"exported":false,"usedBy":[{"file":"test/python.test.ts","line":10,"name":"deadNames"}],"usedByCount":1,"reaches":[{"file":"src/api.ts","line":36,"name":"scan"},{"file":"test/python.test.ts","line":7,"name":"here"}],"reachesCount":2,"findings":[]},{"id":"test/python.test.ts#deadNames","name":"deadName
