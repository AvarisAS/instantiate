 calling something a duplicate."," */","","export type Bag = Map\u003cstring, number\u003e;","","const KEYWORDS = new Set([","  'const', 'let', 'var', 'function', 'return', 'if', 'else', 'for', 'while', 'do',","  'switch', 'case', 'break', 'continue', 'new', 'try', 'catch', 'finally', 'throw',","  'typeof', 'instanceof', 'async', 'await', 'yield', 'class', 'extends', 'super',","  'this', 'null', 'undefined', 'true', 'false', 'in', 'of', 'delete', 'void',","]);","","/** Words that carry no intent, so including them makes everything look alike. */","const STOPWORDS = new Set([","  'get', 'set', 'to', 'from', 'the', 'a', 'an', 'is', 'of', 'value', 'data',","  'result', 'item', 'items', 'obj', 'object', 'arg', 'args', 'opt', 'opts',","  'options', 'param', 'params', 'fn', 'cb', 'callback', 'tmp', 'temp', 'x', 'y', 'i',","]);","","/**"," * Abbreviations, expanded to their long form. Without this, `secs`/`seconds` and"," * `ms`/`milliseconds` look like unrelated words, and near-identical functions"," * written by different sessions score far too low to surface."," */","/**"," * Null-prototype, deliberately. A plain object literal inherits from"," * Object.prototype, so a lookup of a word like `constructor`, `toString` or"," * `valueOf` returns an inherited function instead of undefined — which crashed"," * concept naming on the first real codebase that had a symbol called"," * `constructor`."," */","const ABBREVIATIONS: Record\u003cstring, string\u003e = Object.assign(Object.create(null), {","  ms: 'millisecond', msec: 'millisecond', millis: 'millisecond',","  sec: 'second', secs: 'second', s: 'second',","  min: 'minute', mins: 'minute',","  hr: 'hour', hrs: 'hour',","  ts: 'timestamp', dt: 'datetime',","  num: 'number', cnt: 'count', amt: 'amount', qty: 'quantity',","  str: 'string', bool: 'boolean', int: 'integer',","  msg: 'message', err: 'error', ex: 'exception',","  req: 'request', res: 'response', resp: 'response',","  cfg: 'config', conf: 'config', config: 'config', env: 'environment',","  auth: 'authenticate', usr: 'user', acct: 'account', addr: 'address',","  db: 'database', repo: 'repository', svc: 'service', ctx: 'context',","  init: 'initialise', calc: 'calculate', conv: 'convert',","  fmt: 'format', len: 'length', idx: 'index', buf: 'buffer',","  dir: 'directory', pkg: 'package', dep: 'dependency', util: 'utility',","});","","const SHINGLE = 4;","","/** Token skeleton: identifiers, numbers and strings collapse to placeholders. */","export function structuralBag(body: string): Bag {","  const tokens = tokenise(body).map((t) =\u003e {","    if (KEYWORDS.has(t)) return t;","    if (/^[0-9]/.test(t)) return 'N';","    if (/^['\"`]/.test(t)) return 'S';","    if (/^[A-Za-z_$]/.test(t)) return 'ID';","    return t;","  });","","  const bag: Bag = new Map();","  for (let i = 0; i + SHINGLE \u003c= tokens.length; i++) {","    const key = tokens.slice(i, i + SHINGLE).join(' ');","    bag.set(key, (bag.get(key) ?? 0) + 1);","  }","  return bag;","}","","/** Word bag from identifiers and string literals: what the code is *about*. */","export function vocabularyBag(name: string, body: string): Bag {","  const bag: Bag = new Map();","  const add = (word: string, weight: number): void =\u003e {","    if (word.length \u003c 2 || STOPWORDS.has(word)) return;","    bag.set(word, (bag.get(word) ?? 0) + weight);","  };","","  // The symbol's own name is the strongest statement of intent it has.","  for (const word of splitIdentifier(name)) add(word, 3);","","  for (const token of tokenise(body)) {","    if (KEYWORDS.has(token)) continue;","    if (/^['\"`]/.test(token)) {","      for (const word of splitIdentifier(token.slice(1, -1))) add(word, 1);","    } else if (/^[A-Za-z_$]/.test(token)) {","      for (const word of splitIdentifier(token)) add(word, 1);","    }","  }","  return bag;","}","","/** camelCase, PascalCase, snake_case and kebab-case all become lowercase words. */","export function splitIdentifier(identifier: string): string[] {","  return identifier","    .replace(/([a-z0-9])([A-Z])/g, '$1 $2')","    .replace(/([A-Z]+)([A-Z][a-z])/g, '$1 $2')","    .split(/[^A-Za-z0-9]+/)","    .map((w) =\u003e w.toLowerCase())","    .filter(Boolean)","    .map(stem);","}","","/** Expand abbreviations, then stem, so that all spellings of one idea collapse. */","function stem(word: string): string {","  const expanded = ABBREVIATIONS[word];","  if (expanded) return expanded;","  let base = word;","  if (base.length \u003e 5 \u0026\u0026 base.endsWith('ing')) base = base.slice(0, -3);","  else if (base.length \u003e 4 \u0026\u0026 base.endsWith('ed')) base = base.slice(0, -2);","  else if (base.length \u003e 3 \u0026\u0026 base.endsWith('s') \u0026\u0026 !base.endsWith('ss')) base = base.slice(0, -1);","  // `secs` -\u003e `sec` -\u003e `second`: stemming can expose a further abbreviation.","  return ABBREVIATIONS[base] ?? base;","}","","function tokenise(source: string): string[] {","  return source.match(/'[^']*'|\"[^\"]*\"|`[^`]*`|[A-Za-z_$][\\w$]*|\\d+(?:\\.\\d+)?|[^\\s\\w]/g) ?? [];","}","","export function cosine(a: Bag, b: Bag): number {","  if (a.size === 0 || b.size === 0) return 0;","  // Iterate the smaller bag: the intersection is all that contributes.","  const [small, large] = a.size \u003c= b.size ? [a, b] : [b, a];","  let dot = 0;","  for (const [key, weight] of small) {","    const other = large.get(key);","    if (other !== undefined) dot += weight * other;","  }","  if (dot === 0) return 0;","  return dot / (norm(a) * norm(b));","}","","const normCache = new WeakMap\u003cBag, number\u003e();","","function norm(bag: Bag): number {","  const cached = normCache.get(bag);","  if (cached !== undefined) return cached;","  let sum = 0;","  for (const weight of bag.values()) sum += weight * weight;","  const value = Math.sqrt(sum) || 1;","  normCache.set(bag, value);","  return value;","}",""]},{"path":"src/analysis/unfinished.ts","loc":526,"findings":[],"symbols":[{"id":"src/analysis/unfini ted":false,"usedBy":[{"file":"src/analysis/unfinished.ts","line":85,"name":"findUnfinished"}],"usedByCount":1,"reaches":[{"file":"src/analysis/unfinished.ts","line":33,"name":"Site"},{"file":"src/types.ts","line":111,"name":"Finding"}],"reachesCount":2,"findings":[]}],"usedBy":[{"path":"src/api.ts","count":4}],"uses":[{"path":"src/types.ts","count":16},{"path":"src/config.ts","count":5},{"path":"src/index/extract.ts","count":3}],"marks":[],"source":["import ts from 'typescript';","import { readFileSync } from 'node:fs';","import { join } from 'node:path';","import type { CodeGraph, CodeSymbol, Finding } from '../types.js';","import type { Config } from '../config.js';","import { discoverFiles } from '../index/extract.js';","import { relPath } from '../config.js';","","/**"," * Work that was started and not finished."," *"," * Nothing here is unreachable or duplicated, so the other analyses pass it:"," * the code is called and it runs. It just does not do anything yet. Two"," * shapes are reliable enough to report:"," *"," * - **State nothing sets.** A `let` or private field that is read in a"," *   condition and never assigned. Every branch on it always goes the same"," *   way, so whatever was meant to change it — an input handler, a setter —"," *   is missing. This is how a search box that filtered nothing shipped: its"," *   listener had been deleted, and `query` stayed `''` forever."," * - **Stubs.** A body that only says it is not implemented. Abstract methods"," *   and base-class hooks that something overrides are left alone; those are"," *   meant to be empty."," *"," * Both are read from the syntax of one file at a time, which is also what"," * lets this run on scripts embedded in HTML that no indexer ever sees."," */","export interface UnfinishedResult {","  findings: Finding[];","  count: number;","}","","interface Site {","  file: string;","  line: number;","  name: string;","  kind: 'unset' | 'stub';","  /** Lines where the unset value is read, or the stub's size. */","  loc: number;","  detail: string;","  reads?: number[];","}","","/** An inline script in an HTML page: code no indexer reads. */","const SCRIPT_TAG = /\u003cscript\\b([^\u003e]*)\u003e([\\s\\S]*?)\u003c\\/script\u003e/gi;","","export function findUnfinished(graph: CodeGraph, config: Config): UnfinishedResult {","  const overridden = namesDefinedTwice(graph);","  const sites: Site[] = [];","","  for (const file of graph.files.keys()) {","    let text: string;","    try {","      text = readFileSync(join(config.root, file), 'utf8');","    } catch {","      continue;","    }","    if (file.endsWith('.py')) {","      sites.push(...pythonStubs(graph, file, text, overridden));","    } else if (/\\.(go|swift)$/.test(file)) {","      sites.push(...braceStubs(graph, file, text, overridden));","    } else if (/\\.[cm]?[jt]sx?$/.test(file)) {","      sites.push(...scriptSites(file, text, 0, overridden));","    }","  }","","  for (const absolute of discoverFiles(config, ['**/*.html', '**/*.htm'])) {","    const file = relPath(config.root, absolute);","    let html: string;","    try {","      html = readFileSync(absolute, 'utf8');","    } catch {","      continue;","    }","    for (const match of html.matchAll(SCRIPT_TAG)) {","      const attributes = match[1];","      // External scripts have no body, and JSON or template blocks are data.","      if (/\\bsrc\\s*=/.test(attributes)) continue;","      if (/\\btype\\s*=\\s*[\"']?(?!(text\\/javascript|module|application\\/javascript)[\"'\\s\u003e])/i.test(attributes)) continue;","      const offset = html.slice(0, match.index! + match[0].indexOf('\u003e') + 1).split('\\n').length - 1;","      sites.push(...scriptSites(file, match[2], offset, overridden));","    }","  }","","  const findings = sites.map(toFinding);","  return { findings, count: findings.filter((f) =\u003e f.score \u003e= 0.5).length };","}","","/** Method names defined in more than one place: overridable hooks, not stubs. */","function namesDefinedTwice(graph: CodeGraph): Set\u003cstring\u003e {","  const seen = new Set\u003cstring\u003e();","  const twice = new Set\u003cstring\u003e();","  for (const symbol of graph.symbols.values()) {","    if (symbol.kind !== 'method') continue;","    if (seen.has(symbol.name)) twice.add(symbol.name);","    seen.add(symbol.name);","  }","  return twice;","}","","function scriptSites(file: string, text: string, lineOffset: number, overridden: Set\u003cstring\u003e): Site[] {","  const kind = file.endsWith('.tsx') ? ts.ScriptKind.TSX : file.endsWith('.jsx') ? ts.ScriptKind.JSX : ts.ScriptKind.TS;","  const sf = ts.createSourceFile(file, text, ts.ScriptTarget.Latest, true, kind);","  const lineOf = (node: ts.Node): number =\u003e sf.getLineAndCharacterOfPosition(node.getStart(sf)).line + 1 + lineOffset;","  const sites: Site[] = [];","","  const visit = (node: ts.Node): void =\u003e {","    if (ts.isVariableDeclarationList(node) \u0026\u0026 !(node.flags \u0026 ts.NodeFlags.Const) \u0026\u0026 !isLoopHead(node)) {","      for (const declaration of node.declarations) {","        if (!ts.isIdentifier(declaration.name)) continue;","        const unset = unsetVariable(declaration, declaration.name.text, sf, lineOf);","        if (unset) sites.push({ ...unset, file });","      }","    }","","    if (ts.isPropertyDeclaration(node) \u0026\u0026 isPrivateMutable(node) \u0026\u0026 !node.questionToken) {","      const name = node.name.getText(sf);","      const unset = unsetField(node, name, sf, lineOf);","      if (unset) sites.push({ ...unset, file });","    }","","    if (isFunctionWithBody(node)) {","      const stub = stubOf(node, sf, overridden);","      if (stub) {","        const start = lineOf(node);","        const end = sf.getLineAndCharacterOfPosition(node.getEnd()).line + 1 + lineOffset;","        sites.push({ file, line: start, name: stub.name, kind: 'stub', loc: end - start + 1, detail: stub.detail });","      }","    }","","    ts.forEachChild(node, visit);","  };","  visit(sf);","  return sites;","}","","function isLoopHead(list: ts.VariableDeclarationList): boolean {","  const parent = list.parent;","  return ts.isForStatement(parent) || ts.isForInStatement(parent) || ts.isForOfStatement(parent);","}","","/**"," * A variable read in a condition and assigned nowhere in its scope."," *"," * Reads outside conditions are not enough: `let x = 5; return x * 2` is a"," * missing `const`, not missing work. It is the branch that gives it away —"," * code written to react to a change that never comes."," */","function unsetVariable(","  declaration: ts.VariableDeclaration,","  name: string,","  sf: ts.SourceFile,","  lineOf: (node: ts.Node) =\u003e number,","): Omit\u003cSite, 'file'\u003e | undefined {","  // `let x!: T` promises an assignment the checker cannot see; take it at its word.","  if (declaration.exclamationToken) return undefined;","  const scope = scopeOf(declaration);","  let writes = 0;","  const conditions: number[] = [];","  let reads = 0;","","  const scan = (node: ts.Node): void =\u003e {","    // A nested function with its own `name` is talking about something else.","    if (node !== scope \u0026\u0026 ts.isFunctionLike(node) \u0026\u0026 declaresOwn(node, name, declaration)) return;","    if (ts.isIdentifier(node) \u0026\u0026 node.text === name \u0026\u0026 node !== declaration.name \u0026\u0026 !isPropertyName(node)) {","      if (isWrite(node)) writes++;","      else {","        reads++;","        if (inCondition(node)) conditions.push(lineOf(node));","      }","    }","    ts.forEachChild(node, scan);","  };","  scan(scope);","","  if (writes \u003e 0 || reads === 0) return undefined;","  // Declared with no value and read anyway: it is always `undefined`.","  const neverGiven = !declaration.initializer;","  if (conditions.length === 0 \u0026\u0026 !neverGiven) return undefined;","","  const initial = declaration.initializer ? declaration.initializer.getText(sf).slice(0, 40) : 'undefined';","  return {","    line: lineOf(declaration),","    name,","    kind: 'unset',","    loc: Math.max(conditions.length, 1),","    reads: conditions,","    detail:","      `\\`${name}\\` is declared to change (\\`let\\`) and nothing ever assigns it, so it is always ${initial}. ` +","      (conditions.length","        ? `${conditions.length === 1 ? 'The condition' : `All ${conditions.length} conditions`} reading it ` +","          `(line${conditions.length === 1 ? '' : 's'} ${conditions.join(', ')}) always go the same way.`","        : 'Every read of it gets the same value.'),","  };","}","","/** A private, writable class field: only this file can assign it, so absent writes are conclusive. */","function isPrivateMutable(node: ts.PropertyDeclaration): boolean {","  const modifiers = ts.getModifiers(node) ?? [];","  if (modifiers.some((m) =\u003e m.kind === ts.SyntaxKind.ReadonlyKeyword || m.kind === ts.SyntaxKind.DeclareKeyword)) {","    return false;","  }","  return ts.isPrivateIdentifier(node.name) || modifiers.some((m) =\u003e m.kind === ts.SyntaxKind.PrivateKeyword);","}","","function unsetField(","  field: ts.PropertyDeclaration,","  name: string,","  sf: ts.SourceFile,","  lineOf: (node: ts.Node) =\u003e number,","): Omit\u003cSite, 'file'\u003e | undefined {","  const owner = field.parent;","  let writes = 0;","  let reads = 0;","  const conditions: number[] = [];","","  const scan = (node: ts.Node): void =\u003e {","    if (ts.isPropertyAccessExpression(node) \u0026\u0026 node.name.getText(sf) === name) {","      if (isWrite(node)) writes++;","      else {","        reads++;","        if (inCondition(node)) conditions.push(lineOf(node));","      }","    }","    ts.forEachChild(node, scan);","  };","  scan(owner);","","  if (writes \u003e 0 || conditions.length === 0) return undefined;","  const initial = field.initializer ? field.initializer.getText(sf).slice(0, 40) : 'undefined';","  return {","    line: lineOf(field),","    name,","    kind: 'unset',","    loc: conditions.length,","    reads: conditions,","    detail:","      `\\`${name}\\` is a private, writable field that nothing assigns, so it is always ${initial}. ` +","      `The condition${conditions.length === 1 ? '' : 's'} reading it (line${conditions.length === 1 ? '' : 's'} ` +","      `${conditions.join(', ')}) always go the same way.`,","  };","}","","/** Whether a function binds `name` itself, as a parameter or a local, shadowing the outer one. */","function declaresOwn(fn: ts.SignatureDeclaration, name: string, outer: ts.VariableDeclaration): boolean {","  let found = false;","  const visit = (node: ts.Node): void =\u003e {","    if (found) return;","    if (","      (ts.isParameter(node) || ts.isVariableDeclaration(node) || ts.isBindingElement(node)) \u0026\u0026","      node !== outer \u0026\u0026","      ts.isIdentifier(node.name) \u0026\u0026","      node.name.text === name","    ) {","      found = true;","      return;","    }","    // Deeper functions shadow only their own bodies, and are checked when reached.","    if (node !== fn \u0026\u0026 ts.isFunctionLike(node)) return;","    ts.forEachChild(node, visit);","  };","  ts.forEachChild(fn, visit);","  return found;","}","","/** `let` is block-scoped and `var` function-scoped; the enclosing function covers both, erring towards finding writes. */","function scopeOf(node: ts.Node): ts.Node {","  let current: ts.Node | undefined = node.parent;","  while (current) {","    if (ts.isSourceFile(current) || ts.isFunctionLike(current) || ts.isModuleBlock(current)) return current;","    current = current.parent;","  }","  return node.getSourceFile();","}","","function isPropertyName(node: ts.Identifier): boolean {","  const parent = node.parent;","  return (","    (ts.isPropertyAccessExpression(parent) \u0026\u0026 parent.name === node) ||","    (ts.isPropertyAssignment(parent) \u0026\u0026 parent.name === node) ||","    (ts.isPropertyDeclaration(parent) \u0026\u0026 parent.name === node) ||","    (ts.isMethodDeclaration(parent) \u0026\u0026 parent.name === node)","  );","}","","const ASSIGNMENTS = new Set([","  ts.SyntaxKind.EqualsToken, ts.SyntaxKind.PlusEqualsToken, ts.SyntaxKind.MinusEqualsToken,","  ts.SyntaxKind.AsteriskEqualsToken, ts.SyntaxKind.SlashEqualsToken, ts.SyntaxKind.PercentEqualsToken,","  ts.SyntaxKind.AmpersandAmpersandEqualsToken, ts.SyntaxKind.BarBarEqualsToken,","  ts.SyntaxKind.QuestionQuestionEqualsToken, ts.SyntaxKind.BarEqualsToken, ts.SyntaxKind.AmpersandEqualsToken,","  ts.SyntaxKind.CaretEqualsToken, ts.SyntaxKind.LessThanLessThanEqualsToken,","  ts.SyntaxKind.GreaterThanGreaterThanEqualsToken, ts.SyntaxKind.AsteriskAsteriskEqualsToken,","]);","","/** Assigned, incremented, destructured into, or the target of a `for…of`. */","function isWrite(node: ts.Expression): boolean {","  let child: ts.Node = node;","  let parent = node.parent;","  // Climb out of destructuring patterns: `[a, b] = pair`, `({ a } = obj)`.","  while (","    ts.isParenthesizedExpression(parent) ||","    ts.isArrayLiteralExpression(parent) ||","    ts.isObjectLiteralExpression(parent) ||","    ts.isShorthandPropertyAssignment(parent) ||","    (ts.isPropertyAssignment(parent) \u0026\u0026 parent.initializer === child) ||","    ts.isSpreadElement(parent) ||","    ts.isSpreadAssignment(parent)","  ) {","    child = parent;","    parent = parent.parent;","  }","  if (ts.isBinaryExpression(parent) \u0026\u0026 parent.left === child \u0026\u0026 ASSIGNMENTS.has(parent.operatorToken.kind)) return true;","  if (","    (ts.isPrefixUnaryExpression(parent) || ts.isPostfixUnaryExpression(parent)) \u0026\u0026","    (parent.operator === ts.SyntaxKind.PlusPlusToken || parent.operator === ts.SyntaxKind.MinusMinusToken)","  ) {","    return true;","  }","  if ((ts.isForOfStatement(parent) || ts.isForInStatement(parent)) \u0026\u0026 parent.initializer === child) return true;","  return false;","}","","/** Whether a read decides which way the code goes. */","function inCondition(node: ts.Node): boolean {","  let child = node;","  let parent = node.parent;","  while (","    ts.isParenthesizedExpression(parent) ||","    (ts.isPropertyAccessExpression(parent) \u0026\u0026 parent.expression === child) ||","    (ts.isPrefixUnaryExpression(parent) \u0026\u0026 parent.operator === ts.SyntaxKind.ExclamationToken) ||","    (ts.isBinaryExpression(parent) \u0026\u0026 isTest(parent.operatorToken.kind))","  ) {","    child = parent;","    parent = parent.parent;","  }","  return (","    (ts.isIfStatement(parent) \u0026\u0026 parent.expression === child) ||","    (ts.isWhileStatement(parent) \u0026\u0026 parent.expression === child) ||","    (ts.isDoStatement(parent) \u0026\u0026 parent.expression === child) ||","    (ts.isForStatement(parent) \u0026\u0026 parent.condition === child) ||","    (ts.isConditionalExpression(parent) \u0026\u0026 parent.condition === child) ||","    (ts.isSwitchStatement(parent) \u0026\u0026 parent.expression === child) ||","    // `query \u0026\u0026 render()` decides as surely as an `if`.","    (ts.isBinaryExpression(parent) \u0026\u0026","      parent.left === child \u0026\u0026","      (parent.operatorToken.kind === ts.SyntaxKind.AmpersandAmpersandToken ||","        parent.operatorToken.kind === ts.SyntaxKind.BarBarToken))","  );","}","","function isTest(kind: ts.SyntaxKind): boolean {","  return (","    kind === ts.SyntaxKind.AmpersandAmpersandToken ||","    kind === ts.SyntaxKind.BarBarToken ||","    kind === ts.SyntaxKind.EqualsEqualsEqualsToken ||","    kind === ts.SyntaxKind.ExclamationEqualsEqualsToken ||","    kind === ts.SyntaxKind.EqualsEqualsToken ||","    kind === ts.SyntaxKind.ExclamationEqualsToken ||","    kind === ts.SyntaxKind.LessThanToken ||","    kind === ts.SyntaxKind.GreaterThanToken ||","    kind === ts.SyntaxKind.LessThanEqualsToken ||","    kind === ts.SyntaxKind.GreaterThanEqualsToken","  );","}","","type FunctionWithBody = ts.FunctionLikeDeclaration \u0026 { body: ts.Block };","","function isFunctionWithBody(node: ts.Node): node is FunctionWithBody {","  return (","    (ts.isFunctionDeclaration(node) ||","      ts.isMethodDeclaration(node) ||","      ts.isFunctionExpression(node) ||","      ts.isArrowFunction(node) ||","      ts.isGetAccessorDeclaration(node) ||","      ts.isSetAccessorDeclaration(node)) \u0026\u0026","    !!node.body \u0026\u0026","    ts.isBlock(node.body)","  );","}","","const NOT_DONE = /\\b(not\\s+(yet\\s+)?implemented|unimplemented|todo|tbd|fixme|stub)\\b/i;","const MARKER = /\\b(TODO|FIXME|XXX|HACK)\\b/;","","/**"," * A body that is nothing but a refusal: `throw new Error('not implemented')`,"," * or empty apart from a TODO. An empty body with no marker is left alone —"," * no-op callbacks are everywhere and deliberate."," */","function stubOf(","  node: FunctionWithBody,","  sf: ts.SourceFile,","  overridden: Set\u003cstring\u003e,","): { name: string; detail: string } | undefined {","  const name = functionName(node, sf);","  if (!name) return undefined;","  const modifiers = ts.canHaveModifiers(node) ? (ts.getModifiers(node) ?? []) : [];","  if (modifiers.some((m) =\u003e m.kind === ts.SyntaxKind.AbstractKeyword)) return undefined;","  // A hook subclasses fill in is empty on purpose.","  if (ts.isMethodDeclaration(node) \u0026\u0026 overridden.has(name)) return undefined;","","  const statements = node.body.statements;","  if (statements.length === 1 \u0026\u0026 ts.isThrowStatement(statements[0])) {","    const thrown = statements[0].expression?.getText(sf) ?? '';","    if (NOT_DONE.test(thrown) || /NotImplemented/.test(thrown)) {","      return { name, detail: `\\`${name}\\` only throws: ${thrown.slice(0, 80)}. Anything that calls it fails.` };","    }","  }","  if (statements.length === 0) {","    const inside = node.body.getFullText(sf);","    const marker = MARKER.exec(inside);","    if (marker) {","      const note = inside.slice(marker.index).split('\\n')[0].replace(/\\*\\/.*/, '').trim();","      return { name, detail: `\\`${name}\\` has an empty body with a note left in it: \"${note.slice(0, 80)}\".` };","    }","  }","  return undefined;","}","","function functionName(node: FunctionWithBody, sf: ts.SourceFile): string | undefined {","  if (node.name) return node.name.getText(sf);","  const parent = node.parent;","  if (ts.isVariableDeclaration(parent) || ts.isPropertyAssignment(parent) || ts.isPropertyDeclaration(parent)) {","    return parent.name.getText(sf);","  }","  return undefined;","}","","/**"," * Python stubs: `raise NotImplementedError`, or `pass` / `...` beside a TODO."," * Read from the raw lines, since the indexed body has its comments removed."," */","function pythonStubs(graph: CodeGraph, file: string, text: string, overridden: Set\u003cstring\u003e): Site[] {","  const lines = text.split('\\n');","  const sites: Site[] = [];","  for (const symbol of graph.symbols.values()) {","    if (symbol.file !== file || (symbol.kind !== 'function' \u0026\u0026 symbol.kind !== 'method')) continue;","    if (symbol.kind === 'method' \u0026\u0026 overridden.has(symbol.name)) continue;","    if (symbol.decorators?.some((d) =\u003e /abstract/.test(d))) continue;","    const body = bodyLines(lines, symbol);","    const code = body.filter((l) =\u003e l \u0026\u0026 !l.startsWith('#'));","    if (code.length === 1 \u0026\u0026 /^raise\\s+NotImplemented(Error)?\\b/.test(code[0])) {","      sites.push(stubSite(symbol, `\\`${symbol.name}\\` only raises ${code[0]}. Anything that calls it fails.`));","    } else if (code.length === 1 \u0026\u0026 /^(pass|\\.\\.\\.)$/.test(code[0]) \u0026\u0026 body.some((l) =\u003e MARKER.test(l))) {","      const note = body.find((l) =\u003e MARKER.test(l))!;","      sites.push(stubSite(symbol, `\\`${symbol.name}\\` does nothing and carries a note: \"${note.slice(0, 80)}\".`));","    }","  }","  return sites;","}","","/** A body that only refuses: Go's `panic(\"not implemented\")`, Swift's `fatalError(\"TODO\")`. */","const REFUSAL = /^(panic|fatalError|preconditionFailure)\\(\\s*\"[^\"]*\\b(not\\s+(yet\\s+)?implemented|unimplemented|todo|tbd|stub)\\b[^\"]*\"\\s*\\)$/i;","","/**"," * Go and Swift stubs, read from the raw lines between the braces: the same two"," * shapes as elsewhere, a refusal or an empty body holding a TODO."," */","function braceStubs(graph: CodeGraph, file: string, text: string, overridden: Set\u003cstring\u003e): Site[] {","  const lines = text.split('\\n');","  const sites: Site[] = [];","  for (const symbol of graph.symbols.values()) {","    if (symbol.file !== file || (symbol.kind !== 'function' \u0026\u0026 symbol.kind !== 'method')) continue;","    if (symbol.kind === 'method' \u0026\u0026 overridden.has(symbol.name)) continue;","    const raw = lines.slice(symbol.line - 1, symbol.endLine).join('\\n');","    const open = raw.indexOf('{');","    const close = raw.lastIndexOf('}');","    if (open === -1 || close \u003c= open) continue;","    const body = raw.slice(open + 1, close).split('\\n').map((l) =\u003e l.trim()).filter(Boolean);","    const code = body.filter((l) =\u003e !l.startsWith('//'));","    if (code.length === 1 \u0026\u0026 REFUSAL.test(code[0])) {","      sites.push(stubSite(symbol, `\\`${symbol.name}\\` only calls ${code[0]}. Anything that calls it stops there.`));","    } else if (code.length === 0 \u0026\u0026 body.some((l) =\u003e MARKER.test(l))) {","      const note = body.find((l) =\u003e MARKER.test(l))!.replace(/^\\/\\/\\s*/, '');","      sites.push(stubSite(symbol, `\\`${symbol.name}\\` has an empty body with a note left in it: \"${note.slice(0, 80)}\".`));","    }","  }","  return sites;","}","","/** The statements after the `def` line, trimmed, with a leading docstring removed. */","function bodyLines(lines: string[], symbol: CodeSymbol): string[] {","  const raw = lines.slice(symbol.line - 1, symbol.endLine).join('\\n');","  const afterSignature = raw.replace(/^[\\s\\S]*?\\)\\s*(-\u003e[^:]*)?:/, '');","  return afterSignature","    .replace(/^\\s*(\"\"\"[\\s\\S]*?\"\"\"|'''[\\s\\S]*?'' './index/extract.js';","import { findDeadCode } from './analysis/dead.js';","import { findDuplicates } from './analysis/dupes.js';","import { findConcepts } from './analysis/concepts.js';","import { findDrift } from './analysis/drift.js';","import { findContradictions } from './analysis/contradiction.js';","import { findUnfinished } from './analysis/unfinished.js';","import { applyIgnores } from './analysis/ignores.js';","import { UserError } from './errors.js';","import type { Coverage } from './analysis/coverage.js';","import type { RepoInfo } from './types.js';","import { detectRepo } from './util/repo.js';","import { BACKENDS } from './index/backends.js';","import { discoverFiles } from './index/extract.js';","","export interface ScanOptions {","  root?: string;","  config?: Config;","  /** A coverage report, which turns guesses about dynamic dispatch into facts. */","  coverage?: Coverage;","  /** Reuse a cached graph when no file has changed. */","  cache?: boolean;","}","","export interface ScanResult extends AnalysisResult {","  config: Config;","  warnings: string[];","  /** The remote this code lives on, when there is one. */","  repo?: RepoInfo;","}","","export async function scan(options: ScanOptions = {}): Promise\u003cScanResult\u003e {","  const root = options.root ?? process.cwd();","  // Reporting a clean scan of a directory that does not exist is worse than","  // failing: it looks like a verdict.","  if (!existsSync(root) || !statSync(root).isDirectory()) {","    throw new UserError(`No such directory: ${root}`);","  }","  const config = options.config ?? loadConfig(root);","  const warnings: string[] = [];","","  const indexStart = Date.now();","  const graph = buildGraph(config);","  await mergeBackends(graph, config);","  const indexMs = Date.now() - indexStart;","","  const analyseStart = Date.now();","  const dead = findDeadCode(graph, config, options.coverage);","  const dupes = findDuplicates(graph, config);","  const drift = findDrift(graph);","  const contradictions = findContradictions(graph);","  const unfinished = findUnfinished(graph, config);","  const concepts = findConcepts(graph, config.concepts);","  const analyseMs = Date.now() - analyseStart;","","  if (options.coverage) {","    warnings.push(","      `Merged a ${options.coverage.format} coverage report covering ${options.coverage.files} files. ` +","        'Anything the tests executed counts as reached, however it was reached.',","    );","  }","  if (dead.pluginRoots.size \u003e 0) {","    const applied = [...dead.pluginRoots].map(([name, count]) =\u003e `${name} (${count})`).join(', ');","    warnings.push(`Framework conventions kept symbols alive that nothing names: ${applied}.`);","  }","  const sites = graph.dynamicSites;","  if (sites.length \u003e 0) {","    const first = sites.slice(0, 3).map((site) =\u003e `${site.file}:${site.line}`).join(', ');","    warnings.push(","      `${sites.length} place${sites.length === 1 ? '' : 's'} reach code by a name computed at run time (${first}` +","        `${sites.length \u003e 3 ? ', …' : ''}), which static analysis cannot follow. ` +","        'A coverage report (--coverage) or a plugin rule in .instantiate.yml settles what they reach.',","    );","  }","  if (dead.noEntrypoints) {","    warnings.push(","      'No entrypoint matched a file, so dead-code detection was skipped. ' +","        'Set `entrypoints` in .instantiate.yml — without it the result would be meaningless, not empty.',","    );","  }","  if (graph.files.size === 0) {","    warnings.push(","      `No source files were found under ${root}. Check that this is the right directory, ` +","        'and that `include` and `exclude` in .instantiate.yml are not excluding everything.',","    );","  } else if (graph.symbols.size === 0) {","    warnings.push('Files were read but no symbols were indexed, which usually means a parse failure.');","  }","","  const stats: Stats = {","    files: graph.files.size,","    symbols: graph.symbols.size,","    edges: graph.edges.length,","    loc: [...graph.files.values()].reduce((sum, f) =\u003e sum + f.loc, 0),","    deadLoc: dead.deadLoc,","    duplicateLoc: dupes.duplicateLoc,","    driftCount: drift.count,","    contradictionCount: contradictions.count,","    unfinishedCount: unfinished.count,","    ignoredCount: 0,","    indexMs,","    analyseMs,","  };","","  const repo = detectRepo(root);","","  const found = [","    ...dead.findings,","    ...dupes.findings,","    ...drift.findings,","    ...contradictions.findings,","    ...unfinished.findings,","  ];","  const ignores = applyIgnores(found, graph);","  // What was ignored was judged fine, so it leaves the headline numbers too.","  const before = headline(found);","  const after = headline(ignores.findings);","  stats.deadLoc -= before.dead - after.dead;","  stats.duplicateLoc -= before.duplicate - after.duplicate;","  stats.driftCount -= before.drift - after.drift;","  stats.contradictionCount -= before.contradiction - after.contradiction;","  stats.unfinishedCount -= before.unfinished - after.unfinished;","  stats.ignoredCount = ignores.applied.length;","","  const where = (list: Array\u003c{ file: string; line: number }\u003e): string =\u003e","    list.slice(0, 3).map((i) =\u003e `${i.file}:${i.line}`).join(', ') + (list.length \u003e 3 ? ', …' : '');","  if (ignores.malformed.length \u003e 0) {","    warnings.push(","      `${ignores.malformed.length} instantiate-ignore comment${ignores.malformed.length === 1 ? ' is' : 's are'} ` +","        `missing a kind or a reason, so ${ignores.malformed.length === 1 ? 'it hides' : 'they hide'} nothing ` +","        `(${where(ignores.malformed)}). Write it as \\`instantiate-ignore dead: why this is fine\\`.`,","    );","  }","  if (ignores.stale.length \u003e 0) {","    warnings.push(","      `${ignores.stale.length} instantiate-ignore comment${ignores.stale.length === 1 ? ' no longer hides' : 's no longer hide'} ` +","        `anything (${where(ignores.s    write a standalone HTML report","  ${bold('serve')} [--port n]     live UI on localhost","  ${bold('dismiss')} \u003cid\u003e \u003cwhy\u003e  hide a finding, with a reason, permanently","  ${bold('budget')}               record the current numbers as the baseline","  ${bold('check')}                fail if the numbers grew past the baseline","  ${bold('intent')} \u003ccmd\u003e         draft, confirm and read intent records","  ${bold('mcp')}                  run as an MCP server for coding agents","  ${bold('config')}               show the resolved configuration","","  ${dim('--root \u003cdir\u003e     project root (default: cwd)')}","  ${dim('--limit \u003cn\u003e      findings to show (default: the noise budget, 20)')}","  ${dim('--days \u003cn\u003e       history window for trend (default: 90)')}","  ${dim('--points \u003cn\u003e     samples across that window (default: 10)')}","  ${dim('--json           machine-readable output')}","  ${dim('--all            ignore dismissals')}","  ${dim('--include-tests  look for duplicates inside test files too')}","  ${dim('--coverage \u003cf\u003e   merge a coverage report or V8 trace dir (repeatable), so dynamically reached code counts')}","`;","","interface Args {","  command: string;","  positional: string[];","  root: string;","  limit?: number;","  json: boolean;","  all: boolean;","  includeTests: boolean;","  out?: string;","  coverage?: string[];","  port: number;","  days: number;","  points: number;","}","","function parseArgs(argv: string[]): Args {","  const args: Args = {","    command: 'scan',","    positional: [],","    root: process.cwd(),","    json: false,","    all: false,","    includeTests: false,","    port: 4321,","    days: 90,","    points: 10,","  };","","  const rest: string[] = [];","  for (let i = 0; i \u003c argv.length; i++) {","    const arg = argv[i];","    if (arg === '--root') args.root = resolve(argv[++i] ?? '.');","    else if (arg === '--limit') args.limit = Number(argv[++i]);","    else if (arg === '--out') args.out = argv[++i];","    else if (arg === '--coverage') (args.coverage ??= []).push(argv[++i]);","    else if (arg === '--port') args.port = Number(argv[++i]);","    else if (arg === '--days') args.days = Number(argv[++i]);","    else if (arg === '--points') args.points = Number(argv[++i]);","    else if (arg === '--json') args.json = true;","    else if (arg === '--all') args.all = true;","    else if (arg === '--include-tests') args.includeTests = true;","    else if (arg === '--help' || arg === '-h') args.command = 'help';","    else rest.push(arg);","  }","","  if (args.command !== 'help' \u0026\u0026 rest.length \u003e 0) args.command = rest.shift()!;","  args.positional = rest;","  return args;","}","","function loadConfigFor(args: Args): Config {","  const config = loadConfig(args.root);","  return args.includeTests ? { ...config, includeTests: true } : config;","}","","function visible(findings: Finding[], args: Args): Finding[] {","  return args.all ? findings : applyDismissals(findings, loadDismissals(args.root));","}","","async function main(): Promise\u003cnumber\u003e {","  const args = parseArgs(process.argv.slice(2));","","  if (args.command === 'help') {","    console.log(HELP);","    return 0;","  }","","  if (args.command === 'mcp') {","    const { runMcpServer } = await import('./mcp/server.js');","    await runMcpServer(args.root);","    return 0;","  }","","  if (args.command === 'trend') {","    const { runTrend } = await import('./report/trend.js');","    return await runTrend(args.root, args.days, args.points, args.json);","  }","","  if (args.command === 'config') {","    console.log(describeConfig(loadConfig(args.root)));","    return 0;","  }","","  const config = loadConfigFor(args);","  const coverage = args.coverage","    ? (await import('./analysis/coverage.js')).readCoverages(args.root, args.coverage)","    : undefined;","  const result = await scan({ root: args.root, config, coverage });","  const all = rn 0;","    }","","    case 'why': {","      const query = args.positional[0];","      if (!query) {","        console.error('Usage: instantiate why \u003csymbol name\u003e');","        return 1;","      }","      const { renderWhy } = await import('./report/why.js');","      console.log(renderWhy(result.graph, query, args.root));","      return 0;","    }","","    case 'report': {","      const { renderHtmlReport } = await import('./report/html.js');","      const html = renderHtmlReport(result, all);","      const out = args.out ?? join(args.root, '.instantiate', 'report.html');","      mkdirSync(join(args.root, '.instantiate'), { recursive: true });","      writeFileSync(out, html);","      console.log(`\\n${green('✓')} ${out} ${dim(`(${(html.length / 1024).toFixed(0)} KB, self-contained)`)}\\n`);","      return 0;","    }","","    case 'serve': {","      const { serve } = await import('./report/serve.js');","      await serve(args.root, args.port);","      return 0;","    }","","    case 'budget': {","      const budget = writeBudget(args.root, result.stats);","      console.log(`\\n${green('✓')} baseline recorded — dead ${budget.dead}, duplicate ${budget.duplicate}, drift ${budget.drift}`);","      console.log(dim('  CI now fails only if these grow. Commit .instantiate/budget.json.\\n'));","      return 0;","    }","","    case 'check': {","      const budget = readBudget(args.root);","      if (!budget) {","        console.error(`\\n${yellow('!')} No baseline. Run ${cyan('instantiate budget')} first.\\n`);","        return 1;","      }","      const check = checkBudget(budget, result.stats);","      console.log('');","      console.log(check.lines.join('\\n'));","      console.log('');","      if (!check.ok) {","        console.error(`${red('✗')} This change adds to the mess. Run ${cyan('instantiate scan')} to see what.\\n`);","        return 1;","      }","      console.log(`${green('✓')} within budget\\n`);","      return 0;","    }","","    case 'dismiss': {","      const [id, ...rest] = args.positional;","      const reason = rest.join(' ');","      if (!id || !reason) {","        console.error('Usage: instantiate dismiss \u003cfinding id\u003e \u003cwhy it does not matter\u003e');","        console.error(","          dim('  A reason is required. Without one, nobody reviewing the diff can tell a'),","        );","        console.error(dim('  considered decision from a finding somebody did not understand.'));","        return 1;","      }","      const store = loadDismissals(args.root);","      store.dismissed.push({ id, reason, at: new Date().toISOString().slice(0, 10) });","      saveDismissals(args.root, store);","      console.log(`${green('✓')} dismissed — it will stay hidden across runs`);","      console.log(dim('  Commit .instantiate/dismissed.json so the reason is reviewable.'));","      return 0;","    }","","    case 'intent': {","      const { runIntentCommand } = await import('./intent/command.js');","      return runIntentCommand(args.positional, result, args.root, { limit: args.limit });","    }","","    default:","      console.error(`Unknown command: ${args.command}`);","      console.log(HELP);","      return 1;","  }","}","","main()","  .then((code) =\u003e {","    // Never process.exit() here: on a pipe, stdout is buffered and exiting","    // discards whatever has not flushed, which silently truncated large","    // --json output midway through.","    process.exitCode = code;","  })","  .catch((error: unknown) =\u003e {","    const message = error instanceof Error ? error.message : String(error);","    console.error(`\\n${red('✗')} ${message}`);","","    // An unexpected failure needs a stack, or there is nothing to act on and","    // nothing to report. Only errors raised deliberately stay quiet.","    if (error instanceof Error \u0026\u0026 !(error instanceof UserError)) {","      console.error(dim(error.stack?.split('\\n').slice(1).join('\\n') ?? ''));","      console.error(","        dim('\\nT "  include: string[];","  exclude: string[];","  /** Non-code files scanned for imports, so what they use is not reported dead. */","  satellites: string[];","  /** Python sources, indexed by the tree-sitter backend rather than by tsc. */","  python: string[];","  go: string[];","  swift: string[];","  /**","   * Look for duplicates inside test files.","   *","   * Off by default: a test suite repeats its scaffolding on purpose, each case","   * setting up the same shape and asserting something different. Measured","   * precision on real Python test suites was zero.","   */","  includeTests: boolean;","  /** Cosine cut-off for the duplicate clusters. Calibrated per project on first scan. */","  dupeThreshold: number;","  /** Minimum lines before a symbol is a duplicate candidate. Kills trivial-adapter noise. */","  dupeMinLoc: number;","  /** Findings shown in a report. The noise budget. */","  maxFindings: number;","  /** Target number of concept clusters on the map. */","  concepts: number;","  /**","   * Framework conventions in force: the built-ins whose package this project","   * depends on, then the project's own. In `.instantiate.yml` this lists only","   * the project's own; the built-ins are added on load.","   */","  plugins: Plugin[];","}","","const DEFAULTS: Omit\u003cConfig, 'root' | 'entrypoints' | 'publicApi' | 'plugins'\u003e = {","  include: ['**/*.ts', '**/*.tsx', '**/*.js', '**/*.jsx', '**/*.mts', '**/*.cts'],","  exclude: [","    '**/node_modules/**',","    '**/dist/**',","    '**/build/**',","    '**/.next/**',","    '**/coverage/**',","    '**/*.d.ts',","    '**/*.min.js',","    '**/__pycache__/**',","    '**/.venv/**',","    '**/venv/**',","    '**/site-packages/**',","    '**/generated/**',","    '**/__generated__/**',","    '**/*.pb.ts',","    // Go's vendored dependencies and fixtures, and Swift's package caches.","    '**/vendor/**/*.go',","    '**/testdata/**',","    '**/*.pb.go',","    '**/Pods/**',","    '**/Carthage/**',","    '**/DerivedData/**',","  ],","  // Measured, not guessed: genuine re-implementations of one idea land at 0.81","  // and above, while the nearest unrelated pair sits below 0.50. The cut-off","  // goes in that gap, nearer the noise floor, because calibration raises it per","  // project and nothing can rescue a finding that was never generated.","  // Files that are not code but do import it: MDX docs, single-file components,","  // templates. They are never indexed, yet what they import is very much alive.","  satellites: ['**/*.{mdx,md,vue,svelte,astro,html}'],","  python: ['**/*.py'],","  go: ['**/*.go'],","  swift: ['**/*.swift'],","  includeTests: false,","  dupeThreshold: 0.72,","  dupeMinLoc: 4,","  maxFindings: 20,","  concepts: 30,","};","","const CONFIG_NAMES = ['.instantiate.yml', '.instantiate.yaml', 'instantiate.yml'];","","/**"," * Entrypoint autodetection. Dead-code findings are only as good as this set,"," * so when we detect nothing we say so loudly rather than declaring the repo dead."," */","export function detectEntrypoints(root: string): { entrypoints: string[]; publicApi: string[] } {","  const entrypoints: string[] = [];","  const publicApi: string[] = [];","","  readPackage(root, '.', entrypoints, publicApi);","","  // A monorepo's root package.json describes the repository, not the code.","  // Without reading each workspace, every package's public surface looks","  // unreachable and the dead-code report becomes meaningless rather than empty.","  const workspaces = workspaceDirs(root);","  for (const dir of workspaces) {","    readPackage(root, dir, entrypoints, publicApi);","  }","","  for (const guess of [","    'src/index.ts', 'src/index.tsx', 'src/main.ts', 'src/main.tsx',","    'src/cli.ts', 'src/server.ts', 'src/app.ts',","    'index.ts', 'main.ts', 'app/page.tsx', 'src/app/page.tsx',","  ]) {","    if (existsSync(join(root, guess))) entrypoints.push(guess);","  }","","  // Framework conventions: files the framework calls, that nothing in-repo","  // imports. Checked per workspace as well as at the root, since a monorepo","  // keeps its site in packages/docs rather than at the top level.","  for (const base of ['.', ...workspaces]) {","    const prefix = base === '.' ? '' : `${base}/`;","    for (const dir of ['app', 'src/app', 'pages', 'src/pages']) {","      if (existsSync(join(root, prefix + dir))) {","        entrypoints.push(`${prefix}${dir}/**/{page,layout,route,loading,error,not-found,middleware,template,default,sitemap,robots,opengraph-image,icon}.{ts,tsx,js,jsx,mts}`);","      }","    }","  }","  // Python: the files an interpreter is pointed at, plus the test conventions.","  entrypoints.push('**/{__main__,main,manage,app,wsgi,asgi,conftest,setup}.py');","  entrypoints.push('**/{test_*,*_test}.py');","  entrypoints.push('{test,tests}/**/*.py');","  // Go: `go test` runs every _test.go file.","  entrypoints.push('**/*_test.go');","  // Swift: the package manifest, a top-level main.swift, and XCTest targets.","  entrypoints.push('**/Package.swift', '**/main.swift', '**/*Tests/**/*.swift', '**/*Tests.swift');","","  entrypoints.push('{test,tests,spec,__tests__,test-d,type-tests,types-test}/**/*.{ts,tsx,js,jsx,mts,cts,py}');","  entrypoints.push('**/*.{test-d,typetest}.{ts,tsx}');","  entrypoints.push('**/*.{test,spec}.{ts,tsx,js,jsx}');","","  // Scripts, benchmarks and examples are executed directly rather than imported.","  // They are unreachable by construction, so reporting them is pure noise.","  // Matched at any depth, since a monorepo keeps them in packages/bench and the","  // like rather than at the root.","  // Every language, not just the TypeScript ones: click's examples are Python,","  // and a glob listing only JS extensions made them unreachable by construction.","  entrypoints.push(`**/{${SCRIPT_DIRS.join(',')}}/**/*.{ts,tsx,js,jsx,mts,cts,py,go,swift}`);","","  // A package's `__init__.py` re-exports are its published surface, exactly as a","  // barrel is in TypeScript: absent callers inside the repo are the point.","  if (","    existsSync(join(root, 'pyproject.toml')) ||","    existsSync(join(root, 'setup.py')) ||","    existsSync(join(root, 'setup.cfg'))","  ) {","    publicApi.push('**/__init__.py');","  }","","  // Vendored and generated code is somebody else's contract. Its unused exports","  // are real, and they are not this repository's problem to act on.","  publicApi.push('**/{vendor,vendored,third_party,third-party}/**/*.{ts,tsx,js,jsx,mts,cts}');","","  return { entrypoints: unique(entrypoints), publicApi: unique(publicApi) };","}","","/** Directories whose files are run, not imported. */","const SCRIPT_DIRS = [","  'scripts', 'script', 'bench', 'benchmark', 'benchmarks', 'perf', 'perf-measures',","  'examples', 'example', 'tools', 'build', 'e2e', 'fixtures', 'docs', 'doc',","];","","/** Workspace package directories, from `workspaces` or the usual layout. */","export function workspaceDirs(root: string): string[] {","  const dirs = new Set\u003cstring\u003e();","  const patterns: string[] = [];","","  try {","    const pkg = JSON.parse(readFileSync(join(root, 'package.json'), 'utf8'));","    const workspaces = Array.isArray(pkg.workspaces) ? pkg.workspaces : pkg.workspaces?.packages;","    if (Array.isArray(workspaces)) patterns.push(...workspaces.filter((w) =\u003e typeof w === 'string'));","  } catch {","    // No or malformed root package.json; fall back to the conventional layout.","  }","  if (existsSync(join(root, 'pnpm-workspace.yaml'))) patterns.push('packages/*', 'apps/*');","  if (patterns.length === 0) patterns.push('packages/*', 'apps/*');","","  for (const pattern of patterns) {","    // Only the single-level `dir/*` form is worth expanding; anything deeper is","    // rare enough that an explicit config entry is the better answer.","    const base = pattern.endsWith('/*') ? pattern.slice(0, -2) : undefined;","    if (!base) {","      if (existsSync(join(root, pattern, 'package.json'))) dirs.add(pattern);","      continue;","    }","    let entries: string[];","    try {","      entries = readdirSync(join(root, base));","    } catch {","      continue;","    }","    for (const entry of entries) {","      const dir = `${base}/${entry}`;","      if (existsSync(join(root, dir, 'package.json'))) dirs.add(dir);","    }","  }","  return [...dirs];","}","","/** Read one package.json and add whatever entrypoints and public surface it declares. */","function readPackage(root: string, dir: string, entrypoints: string[], publicApi: string[]): void {","  const prefix = dir === '.' ? '' : `${dir}/`;","  const pkgPath = join(root, dir, 'package.json');","  const resolve = (p: string): string | undefined =\u003e sourceOf(root, prefix + p.replace(/^\\.\\//, ''));","","  if (existsSync(pkgPath)) {","    try {","      const pkg = JSON.parse(readFileSync(pkgPath, 'utf8'));","      // A published package's exports ARE the contract: never dead by definition.","      for (const field of ['main', 'module', 'browser'] as const) {","        if (typeof pkg[field] === 'string') push(publicApi, resolve(pkg[field]));","      }","      if (pkg.exports) collectExports(root, prefix, pkg.exports, publicApi);","      if (pkg.bin) {","        const bins = typeof pkg.bin === 'string' ? [pkg.bin] : Object.values(pkg.bin);","        for (const b of bins) if (typeof b === 'string') push(entrypoints, resolve(b));","      }","      // A private package has no consumers, so its entry is a true entrypoint.","      if (pkg.private \u0026\u0026 typeof pkg.main === 'string') push(entrypoints, resolve(pkg.main));","    } catch {","      // Malformed package.json is not fatal; fall through to conventions.","    }","  }","}","","/**"," * Map a published artefact path back to the source file we actually index."," *"," * A package's `exports` point at build output, and the shape of that output"," * varies: `dist/index.js`, `dist/cjs/index.js`, `dist/types/index.d.ts`, or a"," * plain `source/index.js` that is already the source. Rewriting blindly to"," * `.ts` produced paths that exist in no repository, so every public export"," * looked unreachable and the whole dead-code report became noise."," *"," * So: generate candidates, keep the first that exists on disk, and fall back to"," * the literal path only if nothing matches."," */","function sourceOf(root: string, published: string): string | undefined {","  const clean = published.replace(/^\\.\\//, '');","  const roots = new Set\u003cstring\u003e([clean]);","","  // Build directory to source directory.","  const withoutBuildDir = clean.replace(/^(dist|build|lib|out|esm|cjs)\\//, '');","  roots.add(withoutBuildDir);","  roots.add(`src/${withoutBuildDir}`);","  roots.add(`source/${withoutBuildDir}`);","","  // Output layouts that nest by module format or by declarations.","  const withoutFormatDir = withoutBuildDir.replace(/^(cjs|esm|mjs|types|typings)\\//, '');","  roots.add(`src/${withoutFormatDir}`);","  roots.add(`source/${withoutFormatDir}`);","","  const candidates: string[] = [];","  for (const base of roots) {","    // A declaration file's implementation carries the same stem.","    const stem = base.replace(/\\.d\\.ts$/, '').replace(/\\.(js|mjs|cjs|jsx)$/, '');","    if (base !== stem) {","      for (const extension of ['.ts', '.tsx', '.js', '.jsx', '.mts', '.cts']) {","        candidates.push(stem + extension);","      }","      candidates.push(`${stem}/index.ts`, `${stem}/index.js`);","    }","    // The published path may already be the source, as it is for a package","    // that ships plain JavaScript.","    candidates.push(base);","  }","","  for (const candidate of candidates) {","    if (!candidate || !/\\.(ts|tsx|mts|cts|js|jsx|mjs|cjs)$/.test(candidate)) continue;","    if (existsSync(join(root, candidate))) return candidate;","  }","  return undefined;","}","","function collectExports(root: string, prefix: string, node: unknown, out: string[]): void {","  if (typeof node === 'string') {","    push(out, source t declaration, while the code that actually runs is an override"," * in a subclass the caller never mentions."," *"," * Both are real edges in the running program, so both are edges here."," */","/** Members the language or a host calls implicitly, never by name in source. */","const PROTOCOL_MEMBERS = new Set([","  'toString', 'toJSON', 'valueOf', 'toValue', 'then', 'catch', 'finally',","  'next', 'return', 'throw', 'dispose', 'asyncDispose',","  'toPrimitive', 'inspect', 'iterator', 'asyncIterator',","]);","","function linkClassMembers(symbols: Map\u003cstring, CodeSymbol\u003e, edges: Edge[]): void {","  const methodsOf = new Map\u003cstring, Map\u003cstring, string\u003e\u003e();","  for (const symbol of symbols.values()) {","    if (symbol.kind !== 'method') continue;","    const [file, qualified] = symbol.id.split('#');","    const dot = qualified.lastIndexOf('.');","    if (dot === -1) continue;","    const classId = `${file}#${qualified.slice(0, dot)}`;","    const name = qualified.slice(dot + 1);","    const map = methodsOf.get(classId);","    if (map) map.set(name, symbol.id);","    else methodsOf.set(classId, new Map([[name, symbol.id]]));","  }","","  // Constructing a class runs its constructor, and the runtime calls its","  // protocol members: `toString` when it is concatenated, `toJSON` when it is","  // serialised, `then` when it is awaited. Nothing in the source names them.","  for (const [classId, methods] of methodsOf) {","    const owner = symbols.get(classId);","    if (!owner) continue;","    for (const [name, memberId] of methods) {","      const isProtocol =","        name === 'constructor' ||","        PROTOCOL_MEMBERS.has(name) ||","        name.startsWith('[Symbol.') ||","        (name.startsWith('__') \u0026\u0026 name.endsWith('__'));","      if (isProtocol) {","        edges.push({ from: classId, to: memberId, kind: 'calls', file: owner.file, line: owner.line });","      }","    }","  }","","  // A declaration and its implementation.","  //","  // A library often describes its API as `declare class H3` in one file while","  // the real `class H3` lives in another, and a call resolves to whichever the","  // type system sees — the declaration. The implementation is then reachable","  // from nothing. Same class name plus same member name in two files is that","  // pair, so each side reaches the other.","  const byQualifiedName = new Map\u003cstring, string[]\u003e();","  for (const [classId, methods] of methodsOf) {","    const className = classId.split('#')[1];","    for (const [memberName, memberId] of methods) {","      const key = `${className}.${memberName}`;","      const list = byQualifiedName.get(key);","      if (list) list.push(memberId);","      else byQualifiedName.set(key, [memberId]);","    }","  }","  for (const ids of byQualifiedName.values()) {","    if (ids.length \u003c 2) continue;","    const files = new Set(ids.map((id) =\u003e id.split('#')[0]));","    if (files.size \u003c 2) continue; // Overloads in one file, not a second declaration.","    for (const from of ids) {","      for (const to of ids) {","        if (from === to) continue;","        const owner = symbols.get(from);","        if (owner) edges.push({ from, to, kind: 'references', file: owner.file, line: owner.line });","      }","    }","  }","","  // A reached base member reaches every override of it, in either direction of","  // the relationship: `extends` links the subclass to the base.","  const hierarchy = edges.filter((e) =\u003e e.kind === 'extends' || e.kind === 'implements');","  for (const edge of hierarchy) {","    const derived = methodsOf.get(edge.from);","    const base = methodsOf.get(edge.to);","    if (!derived || !base) continue;","    for (const [name, baseId] of base) {","      const override = derived.get(name);","      if (override \u0026\u0026 override !== baseId) {","        edges.push({ from: baseId, to: override, kind: 'calls', file: edge.file, line: edge.line });","      }","    }","  }","}","","/**"," * Imports written in files we do not index: MDX pages, single-file components,"," * templates."," *"," * A documentation site imports its React components from `.mdx`, and a Vue app"," * imports helpers from `.vue`. Neither is TypeScript, so neither appears in the"," * program, and everything they use looks unreachable. Reading just the import"," * statements is cheap and turns a large class of false positives into edges."," */","function collectSatelliteEdges(","  config: Config,","  byFileName: Map\u003cstring, ts.SourceFile\u003e,","  checker: ts.TypeChecker,","  declToId: Map\u003cts.Node, string\u003e,","  edges: Edge[],","): void {","  const importPattern = /(?:^|\\n)\\s*import\\s+(?:[\\s\\S]*?\\s+from\\s+)?['\"]([^'\"]+)['\"]/g;","","  for (const file of discoverFiles(config, config.satellites)) {","    let text: string;","    try {","      text = readFileSync(file, 'utf8');","    } catch {","      continue;","    }","    const rel = relPath(config.root, file);","    let match: RegExpExecArray | null;","    importPattern.lastIndex = 0;","","    while ((match = importPattern.exec(text)) !== null) {","      const specifier = match[1];","      // A bare package name cannot reach this repository's code, but an alias","      // can, so anything the alias map knows about is worth resolving.","      if (!specifier.startsWith('.') \u0026\u0026 expandAlias(specifier, file, config).length === 0) {","        continue;","      }","      const target = resolveSatellite(specifier, file, config, byFileName);","      if (!target) continue;","","      const line = text.slice(0, match.index).split('\\n').length;","      const from = `${rel}#\u003csatellite\u003e`;","      // Which named export is used cannot be told apart reliably here, so treat","      // the whole module as used — the same over-approximation as `import()`.","      for (const exported of exportsOf(target, checker, declToId)) {","        edges.push({ from, to: exported, kind: 'references', file: rel, line });","      }","      edges.push({","        from,","        to: `${relPath(config.root, target.fileName)}#\u003cmodule\u003e`,","        kind: 'imports',","        file: rel,","        line,","      });","    }","  }","}","","function resolveSatellite(","  specifier: string,","  from: string,","  config: Config,","  byFileName: Map\u003cstring, ts.SourceFile\u003e,","): ts.SourceFile | undefined {","  const bases = specifier.startsWith('.')","    ? [join(dirname(from), specifier)]","    : expandAlias(specifier, from, config);","","  for (const base of bases) {","    const stem = base.replace(/\\.(js|mjs|cjs|jsx)$/, '');","    for (const extension of ['', '.ts', '.tsx', '.js', '.jsx', '/index.ts', '/index.tsx', '/index.js']) {","      const hit = byFileName.get(stem + extension);","      if (hit) return hit;","    }","  }","  return undefined;","}","","/**"," * Every file gets a symbol standing for the module itself."," *"," * Without one, any reference in top-level code — an import specifier, a"," * re-export clause, a call at module scope — has no enclosing symbol, so it"," * produces no edge at all. That single gap made reachability near-vacuous:"," * a test file whose whole body sits inside a `describe()` callback rooted"," * nothing, and a barrel of `export … from` rooted nothing either."," *"," * Registering the SourceFile node itself means enclosingSymbolId() walks up to"," * the module and attributes the reference to it, with no other change needed."," */","/**"," * Does this file run code at module scope, beyond declaring things?"," *"," * A declaration-only module is a library. One with a call, a loop or an"," * assignment at the top level performs work on load, which is the signature of"," * something executed directly rather than imported."," */","function markSideEffects(sf: ts.SourceFile, file: string, symbols: Map\u003cstring, CodeSymbol\u003e): void {","  const executable = sf.statements.some(","    (statement) =\u003e","      ts.isExpressionStatement(statement) ||","      ts.isIfStatement(statement) ||","      ts.isForStatement(statement) ||","      ts.isForOfStatement(statement) ||","      ts.isWhileStatement(statement) ||","      ts.isTryStatement(statement),","  );","  const module = symbols.get(moduleId(file));","  if (module) module.sideEffects = executable;","}","","function declareModule(","  sf: ts.SourceFile,","  file: string,","  text: string,","  symbols: Map\u003cstring, CodeSymbol\u003e,","  declToId: Map\u003cts.Node, string\u003e,","): void {","  declToId.set(sf, recordModule(symbols, file, countLines(text)));","}","","function createProgram(config: Config, files: string[]): ts.Program {","  const tsconfigPath = ts.findConfigFile(config.root, ts.sys.fileExists, 'tsconfig.json');","  let options: ts.CompilerOptions = {","    allowJs: true,","    checkJs: false,","    target: ts.ScriptTarget.ESNext,","    module: ts.ModuleKind.ESNext,","    moduleResolution: ts.ModuleResolutionKind.Bundler,","    jsx: ts.JsxEmit.Preserve,","    noEmit: true,","    allowNonTsExtensions: true,","    skipLibCheck: true,","  };","","  if (tsconfigPath \u0026\u0026 dirname(tsconfigPath).startsWith(config.root)) {","    const raw = ts.readConfigFile(tsconfigPath, ts.sys.readFile);","    if (!raw.error) {","      const parsed = ts.parseJsonConfigFileContent(raw.config, ts.sys, dirname(tsconfigPath));","      // Keep the project's paths/baseUrl (they drive resolution) but never its emit","      // settings, since we only ever type-check.","      options = { ...parsed.options, noEmit: true, allowJs: true, skipLibCheck: true };","    }","  }","","  return ts.createProgram({ rootNames: files, options });","}","","export function discoverFiles(config: Config, include: string[] = config.include): string[] {","  const out: string[] = [];","","  const walk = (dir: string): void =\u003e {","    let entries: string[];","    try {","      entries = readdirSync(dir);","    } catch {","      return; // Unreadable directory is skipped, not fatal.","    }","    for (const entry of entries) {","      if (entry.startsWith('.') \u0026\u0026 entry !== '.') continue;","      const abs = join(dir, entry);","      const rel = relPath(config.root, abs);","      if (matchesAny(rel, config.exclude)) continue;","      let st: ReturnType\u003ctypeof statSync\u003e;","      try {","        st = statSync(abs);","      } catch {","        continue;","      }","      if (st.isDirectory()) {","        walk(abs);","      } else if (matchesAny(rel, include)) {","        out.push(abs);","      }","    }","  };","","  walk(config.root);","  return out;","}","","function countLines(text: string): number {","  let n = 0;","  for (let i = 0; i \u003c text.length; i++) if (text.charCodeAt(i) === 10) n++;","  return n + 1;","}","","/**"," * An ambient declaration: inside `declare module`/`declare global`, or carrying"," * the `declare` modifier itself."," *"," * `declare class H3 { mount(...): void }` describes an API whose implementation"," * lives elsewhere. Nothing calls the declaration — calls resolve *to* it — so"," * it can never be reached, and it can never be deleted either."," */","function isAmbient(node: ts.Node): boolean {","  let current: ts.Node | undefined = node;","  while (current) {","    if (ts.isModuleDeclaration(current)) return true;","    if (ts.isSourceFile(current)) return current.isDeclarationFile;","    const modifiers = ts.canHaveModifiers(current) ? ts.getModifiers(current) : undefined;","    if (modifiers?.some((m) =\u003e m.kind === ts.SyntaxKind.DeclareKeyword)) return true;","    current = current.parent;","  }","  return false;","}","","function isExported(node: ts.Node): boolean {","  const mods = ts.canHaveModifiers(node) ? ts.getModifiers(node) : undefined;","  return !!mods?.some(","    (m) =\u003e m.kind === ts.SyntaxKind.ExportKeyword || m.kind === ts.SyntaxKind.DefaultKeyword,","  );","}","","function signatureOf(node: ts.Node): string {","  if (","    ts.isFunctionDeclaration(node) ||","    ts.isMethodDeclaration(node) ||","    ts.isArrowFunction(node) ||","    ts.isFunctionExpression(node)","  ) {","    const params = node.parameters","      .map((p) =\u003e (p.type ? p.type.getText() : p.dotDotDotToken ? '...any' : 'any'))","      .join(',');","    const ret = node.type ? node.type.getText() : 'infer';","    return `(${params})=\u003e${ret}`;","  }","  return node.kind.toString();","}","","/** Comments removed, line structure kept, so line numbers still mean something. */","function stripComments(text: string): string {","  return text","    .replace(/\\/\\*[\\s\\S]*?\\*\\//g, (m) =\u003e m.replace(/[^\\n]/g, ' '))","    .replace(/(^|[^:])\\/\\/[^\\n]*/g, (m, p) =\u003e p + ' '.repeat(Math.max(0, m.length - p.length)));","}","","/** Comment-free, whitespace-normalised source. The input to duplicate detection. */","function normaliseBody(node: ts.Node, sf: ts.SourceFile): string {","  const text = node.getText(sf);","  return text","    .replace(/\\/\\*[\\s\\S]*?\\*\\//g, ' ')","    .replace(/\\/\\/[^\\n]*/g, ' ')","    .replace(/\\s+/g, ' ')","    .trim();","}","","function record(","  node: ts.Node,","  name: string,","  kind: SymbolKind,","  file: string,","  sf: ts.SourceFile,","  symbols: Map\u003cstring, CodeSymbol\u003e,","  declToId: Map\u003cts.Node, string\u003e,","  container?: string,","): void {","  const start = sf.getLineAndCharacterOfPosition(node.getStart(sf));","  const end = sf.getLineAndCharacterOfPosition(node.getEnd());","  const id = recordSymbol(","    symbols,","    {","      name,","      kind,","      file,","      line: start.line + 1,","      endLine: end.line + 1,","      // A class member is part of its class's surface unless it is `#private`.","      exported: isExported(node) || (!!container \u0026\u0026 !name.startsWith('#')),","      ambient: isAmbient(node),","      decorators: decoratorsOf(node, sf),","      body: normaliseBody(node, sf),","      signature: signatureOf(node),","    },","    container,","  );","  declToId.set(node, id);","}","","/** `@Controller('x')` -\u003e `Controller`, `@app.route('/')` -\u003e `app.route`. */","function decoratorsOf(node: ts.Node, sf: ts.SourceFile): string[] | undefined {","  if (!ts.canHaveDecorators(node)) return undefined;","  const decorators = ts.getDecorators(node);","  if (!decorators?.length) return undefined;","  return decorators.map((d) =\u003e {","    const expression = ts.isCallExpression(d.expression) ? d.expression.expression : d.expression;","    return expression.getText(sf);","  });","}","","/**"," * Only module-scope bindings are symbols. A local inside a function body is not"," * something anyone navigates to, and recording them floods the graph with"," * thousands of never-referenced nodes that every analysis then has to filter."," */","function isModuleScope(node: ts.VariableDeclaration): boolean {","  const statement = node.parent?.parent;","  if (!statement || !ts.isVariableStatement(statement)) return false;","  const scope = statement.parent;","  return !!scope \u0026\u0026 (ts.isSourceFile(scope) || ts.isModuleBlock(scope));","}","","function collectDeclarations(","  node: ts.Node,","  file: string,","  sf: ts.SourceFile,","  symbols: Map\u003cstring, CodeSymbol\u003e,","  declToId: Map\u003cts.Node, string\u003e,","  container?: string,","): void {","  if (ts.isFunctionDeclaration(node) \u0026\u0026 node.name) {","    record(node, node.name.text, 'function', file, sf, symbols, declToId, container);","  } else if (ts.isClassDeclaration(node) \u0026\u0026 node.name) {","    const className = node.name.text;","    record(node, className, 'class', file, sf, symbols, declToId, container);","    for (const member of node.members) {","      // An `abstract` member has no body, and neither does an overload","      // signature. Skipping them meant a polymorphic `this.method()` resolved","      // to nothing at all, so every override looked unreachable.","      const isMethodLike =","        ts.isMethodDeclaration(member) ||","        ts.isConstructorDeclaration(member) ||","        ts.isMethodSignature(member) ||","        ts.isGetAccessor(member) ||","        ts.isSetAccessor(member);","      if (!isMethodLike) continue;","","      const memberName = ts.isConstructorDeclaration(member)","        ? 'constructor'","        : member.name.getText(sf);","      record(member, memberName, 'method', file, sf, symbols, declToId, className);","    }","    return; // Members are handled above; do not double-visit them.","  } else if (ts.isInterfaceDeclaration(node)) {","    record(node, node.name.text, 'interface', file, sf, symbols, declToId, container);","  } else if (ts.isTypeAliasDeclaration(node)) {","    record(node, node.name.text, 'type', file, sf, symbols, declToId, container);","  } else if (ts.isEnumDeclaration(node)) {","    record(node, node.name.text, 'enum', file, sf, symbols, declToId, container);","  } else if (","    ts.isVariableDeclaration(node) \u0026\u0026","    ts.isIdentifier(node.name) \u0026\u0026","    isModuleScope(node)","  ) {","    const init = node.initializer;","    const isFn = !!init \u0026\u0026 (ts.isArrowFunction(init) || ts.isFunctionExpression(init));","    // `const f = () =\u003e {}` is a function to every reader, so treat it as one.","    const target = isFn ? init : node;","    const statement = node.parent.parent;","    const exported = ts.isVariableStatement(statement) \u0026\u0026 isExported(statement);","    const id = symbolId(file, node.name.text, container);","    if (!symbols.has(id)) {","      const start = sf.getLineAndCharacterOfPosition(node.getStart(sf));","      const end = sf.getLineAndCharacterOfPosition(target.getEnd());","      symbols.set(id, {","        id,","        name: node.name.text,","        kind: isFn ? 'function' : 'variable',","        file,","        line: start.line + 1,","        endLine: end.line + 1,","        exported,","        loc: end.line - start.line + 1,","        body: normalis `x_windows.go` both declare"," * it and the build picks one. A reference reaches every variant: which one is"," * compiled depends on the platform, not on this repository."," */","type Scope = Map\u003cstring, Map\u003cstring, string[]\u003e\u003e;","","function bind(names: Map\u003cstring, string[]\u003e, name: string, id: string): void {","  const list = names.get(name) ?? [];","  if (!list.includes(id)) list.push(id);","  names.set(name, list);","}","","async function buildGoGraph(config: Config, files: string[]): Promise\u003cLanguageGraph\u003e {","  const parser = await parserFor('go');","  const symbols = new Map\u003cstring, CodeSymbol\u003e();","  const edges: Edge[] = [];","  const records = new Map\u003cstring, FileRecord\u003e();","  const sources = new Map\u003cstring, string\u003e();","  const dynamicSites: DynamicSite[] = [];","  const scripts: string[] = [];","  const publicApi: string[] = [];","  const modules = goModules(config.root);","","  const indexes: FileIndex[] = [];","  const scope: Scope = new Map();","  /** Directory -\u003e package keys in it, for resolving an import to its files. */","  const byDir = new Map\u003cstring, Set\u003cstring\u003e\u003e();","  /** Receiver type -\u003e (method name -\u003e id), across every file of a package. */","  const methods = new Map\u003cstring, Map\u003cstring, string\u003e\u003e();","  /** Method names some interface in this repository requires. */","  const required = new Set\u003cstring\u003e();","","  for (const absolute of files) {","    let text: string;","    try {","      text = readFileSync(absolute, 'utf8');","    } catch {","      continue;","    }","    const tree = parser.parse(text);","    if (!tree) continue;","    const file = relative(config.root, absolute).split('\\\\').join('/');","    const dir = dirname(file);","    const root = tree.rootNode;","    const packageName = root.namedChildren.find((n) =\u003e n?.type === 'package_clause')?.namedChild(0)?.text ?? '';","    const pkg = `${dir}|${packageName}`;","","    records.set(file, fileRecord(file, text));","    sources.set(file, stripCStyleComments(text));","    recordModule(symbols, file, text.split('\\n').length);","    if (!byDir.has(dir)) byDir.set(dir, new Set());","    byDir.get(dir)!.add(pkg);","    if (!scope.has(pkg)) scope.set(pkg, new Map());","","    const index: FileIndex = { file, tree: root, pkg, packageName, imports: new Map() };","    declare(index, symbols, scope.get(pkg)!, methods, required);","    indexes.push(index);","","    // `package main` with a `func main` is a program: something runs it.","    if (packageName === 'main' \u0026\u0026 symbols.has(symbolId(file, 'main'))) scripts.push(file);","    // Exported names of a non-main package outside `internal/` are importable","    // by other modules: the package's contract, whether or not this repo uses them.","    const isTest = file.endsWith('_test.go');","    if (packageName !== 'main' \u0026\u0026 !isTest \u0026\u0026 !/(^|\\/)internal(\\/|$)/.test(dir)) publicApi.push(file);","  }","","  for (const index of indexes) collectImports(index, modules, byDir);","","  // Files of one package load together, and loading runs every init().","  const filesOf = new Map\u003cstring, string[]\u003e();","  for (const index of indexes) {","    const list = filesOf.get(index.pkg) ?? [];","    list.push(index.file);","    filesOf.set(index.pkg, list);","  }","  for (const list of filesOf.values()) {","    for (const file of list) {","      for (const sibling of list) {","        if (sibling !== file) edges.push({ from: moduleId(file), to: moduleId(sibling), kind: 'imports', file, line: 1 });","      }","      const init = symbolId(file, 'init');","      if (symbols.has(init)) edges.push({ from: moduleId(file), to: init, kind: 'calls', file, line: 1 });","    }","  }","","  // Using a type brings the methods that may satisfy an interface.","  for (const [key, members] of methods) {","    const cut = key.lastIndexOf('|');","    for (const typeId of scope.get(key.slice(0, cut))?.get(key.slice(cut + 1)) ?? []) {","      const owner = symbols.get(typeId);","      if (!owner) continue;","      for (const [name, id] of members) {","        if (isExported(name) || required.has(name)) {","          edges.push({ from: typeId, to: id, kind: 'calls', file: owner.file, line: owner.line });","        }","      }","    }","  }","","  const methodsByName = new Map\u003cstring, string[]\u003e();","  for (const members of methods.values()) {","    for (const [name, id] of members) methodsByName.set(name, [...(methodsByName.get(name) ?? []), id]);","  }","","  for (const index of indexes) {","    connect(index, symbols, edges, scope, filesOf, methodsByName, dynamicSites);","  }","","  return { symbols, edges, files: records, sources, scripts, dynamicSites, publicApi };","}","","/** Every go.mod in the repository: module path -\u003e its directory. */","function goModules(root: string): Map\u003cstring, string\u003e {","  const out = new Map\u003cstring, string\u003e();","  const walk = (dir: string, depth: number): void =\u003e {","    if (depth \u003e 6) return;","    let entries: string[];","    try {","      entries = readdirSync(join(root, dir));","    } catch {","      return;","    }","    if (entries.includes('go.mod')) {","      const text = readFileSync(join(root, dir, 'go.mod'), 'utf8');","      const name = /^module\\s+(\\S+)/m.exec(text)?.[1];","      if (name) out.set(name, dir === '.' ? '' : dir);","    }","    for (const entry of entries) {","      if (entry.startsWith('.') || entry === 'vendor' || entry === 'node_modules' || entry === 'testdata') continue;","      const next = dir === '.' ? entry : `${dir}/${entry}`;","      try {","        if (existsSync(join(root, next, '.')) \u0026\u0026 !entry.includes('.')) walk(next, depth + 1);","      } catch {","        // Unreadable: skip.","      }","    }","  };","  walk('.', 0);","  return out;","}","","function declare(","  index: FileIndex,","  symbols: Map\u003cstring, CodeSymbol\u003e,","  names: Map\u003cstring, string[]\u003e,","  methods: Map\u003cstring, Map\u003cstring, string\u003e\u003e,","  required: Set\u003cstring\u003e,","): void {","  for (const node of index.tree.namedChildren) {","    if (!node) continue;","    switch (node.type) {","      case 'function_declaration': {","        const name = node.childForFieldName('name')?.text;","        if (!name) break;","        // Several init() functions may share a file; the first stands for them all.","        bind(names, name, record(node, name, 'function', index.file, symbols));","        break;","      }","      case 'method_declaration': {","        const name = node.childForFieldName('name')?.text;","        const receiver = receiverType(node);","        if (!name || !receiver) break;","        const id = record(node, name, 'method', index.file, symbols, receiver);","        // Methods may sit in a different file from their type, so they are","        // keyed by the type's name within the package and resolved later.","        const key = `${index.pkg}|${receiver}`;","        const map = methods.get(key) ?? new Map\u003cstring, string\u003e();","        map.set(name, id);","        methods.set(key, map);","        break;","      }","      case 'type_declaration': {","        for (const spec of node.namedChildren) {","          if (spec?.type !== 'type_spec' \u0026\u0026 spec?.type !== 'type_alias') continue;","          const name = spec.childForFieldName('name')?.text;","          if (!name) continue;","          const type = spec.childForFieldName('type');","          const kind: SymbolKind = type?.type === 'interface_type' ? 'interface' : 'class';","          bind(names, name, record(spec, name, kind, index.file, symbols));","          if (type?.type === 'interface_type') {","            for (const element of type.namedChildren) {","              const method = element?.type === 'method_elem' ? element.childForFieldName('name')?.text : undefin
