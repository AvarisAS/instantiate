<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>instantiate — instantiate</title>
<style>
/*
 * A report is read the way an instrument panel is read: severity first, then
 * scale, then the code. So severity is carried by shape as well as colour — a
 * stripe down the edge of every finding — and the semantic scale is kept
 * separate from the accent, which marks only what is interactive.
 *
 * No web fonts: a report is opened offline, attached to a mail, read on a
 * plane. A font that fails to load silently would take the typography with it.
 */
:root {
  /*
   * Flexoki, by Steph Ango. An ink-on-paper palette: warm neutrals that hold
   * their character in both themes, and colours picked to sit on them without
   * shouting. Chosen over the cool blue-greys because a page full of code
   * should read like a printed page, not like a control panel.
   */
  --bg: #FFFCF0;          /* paper */
  --panel: #FFFCF0;
  --sunk: #F2F0E5;        /* base-50 */
  --ink: #100F0F;         /* black */
  --ink-soft: #403E3C;    /* base-800 */
  --muted: #6F6E69;       /* base-600 */
  --line: #DAD8CE;        /* base-150 */
  --line-strong: #B7B5AC; /* base-300 */
  --accent: #205EA6;      /* blue-600 */
  --accent-soft: #E1ECF7;
  --high: #AF3029;        /* red-600 */
  --medium: #AD8301;      /* yellow-600 */
  --low: #878580;         /* base-500 */
  --good: #66800B;        /* green-600 */

  /* Three bands, not a gradient: "clean", "some" and "mostly" have to be
     distinguishable at a glance in a map of four hundred boxes. */
  --heat0: #EDEBE0;
  --heat1: #E8C88A;
  --heat2: #C86A56;

  --focus-tint: color-mix(in srgb, var(--accent) 10%, transparent);
  --tok-comment: #878580;  /* base-500 */
  --tok-string: #66800B;   /* green-600 */
  --tok-keyword: #5E409D;  /* purple-600 */
  --tok-number: #BC5215;   /* orange-600 */
  --tok-type: #205EA6;     /* blue-600 */
  --tok-fn: #24837B;       /* cyan-600 */
  --tok-punct: #6F6E69;
  --tint-high: color-mix(in srgb, var(--high) 10%, transparent);
  --tint-medium: color-mix(in srgb, var(--medium) 13%, transparent);
  --tint-low: color-mix(in srgb, var(--low) 9%, transparent);

  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --step--1: 0.78rem;
  --step-0: 0.94rem;
  --step-1: 1.15rem;
  --step-2: 1.6rem;
  --step-3: 2.1rem;
}

/* Flexoki's dark side: the same ink, inverted. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #100F0F;          /* black */
    --panel: #1C1B1A;       /* base-950 */
    --sunk: #282726;        /* base-900 */
    --ink: #CECDC3;         /* base-200 */
    --ink-soft: #B7B5AC;    /* base-300 */
    --muted: #878580;       /* base-500 */
    --line: #343331;        /* base-850 */
    --line-strong: #575653; /* base-700 */
    --accent: #4385BE;      /* blue-400 */
    --accent-soft: #1A2733;
    --high: #D14D41;        /* red-400 */
    --medium: #D0A215;      /* yellow-400 */
    --low: #878580;
    --good: #879A39;        /* green-400 */
    --heat0: #2A2927;
    --heat1: #6E5A1E;
    --heat2: #8C3B31;
    --focus-tint: color-mix(in srgb, var(--accent) 18%, transparent);
    --tok-comment: #6F6E69;  /* base-600 */
    --tok-string: #879A39;   /* green-400 */
    --tok-keyword: #8B7EC8;  /* purple-400 */
    --tok-number: #DA702C;   /* orange-400 */
    --tok-type: #4385BE;     /* blue-400 */
    --tok-fn: #3AA99F;       /* cyan-400 */
    --tok-punct: #878580;
    --tint-high: color-mix(in srgb, var(--high) 14%, transparent);
    --tint-medium: color-mix(in srgb, var(--medium) 16%, transparent);
    --tint-low: color-mix(in srgb, var(--low) 12%, transparent);
  }
}
:root[data-theme="dark"] {
  --bg: #100F0F;
  --panel: #1C1B1A;
  --sunk: #282726;
  --ink: #CECDC3;
  --ink-soft: #B7B5AC;
  --muted: #878580;
  --line: #343331;
  --line-strong: #575653;
  --accent: #4385BE;
  --accent-soft: #1A2733;
  --high: #D14D41;
  --medium: #D0A215;
  --low: #878580;
  --good: #879A39;
  --heat0: #2A2927;
  --heat1: #6E5A1E;
  --heat2: #8C3B31;
  --focus-tint: color-mix(in srgb, var(--accent) 18%, transparent);
  --tok-comment: #6F6E69;
  --tok-string: #879A39;
  --tok-keyword: #8B7EC8;
  --tok-number: #DA702C;
  --tok-type: #4385BE;
  --tok-fn: #3AA99F;
  --tok-punct: #878580;
  --tint-high: color-mix(in srgb, var(--high) 14%, transparent);
  --tint-medium: color-mix(in srgb, var(--medium) 16%, transparent);
  --tint-low: color-mix(in srgb, var(--low) 12%, transparent);
}

* { box-sizing: border-box; }

/* Icons size themselves against the text beside them, and inherit its colour. */
.icon { width: 1.05em; height: 1.05em; flex: 0 0 auto; vertical-align: -0.16em; }
.icon-sm { width: 0.85em; height: 0.85em; opacity: 0.7; }
/*
 * A code browser is an application, not a document: it should take the window
 * and grow with it. Height in percentages rather than viewport units, so the
 * shell sits inside the safe-area padding the host applies rather than
 * overflowing it on a phone.
 */
html, body { height: 100%; }
* { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb { background: var(--line-strong);
                             border: 2px solid var(--panel); }
*::-webkit-scrollbar-thumb:hover { background: var(--muted); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: var(--step-0);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
#app {
  height: 100%;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.shell-body { flex: 1 1 auto; min-height: 0; display: flex; }
.warnings { padding: 10px 16px 0; flex: 0 0 auto; }

/* The one bar: identity, navigation, search and the numbers, in that order. */
.bar-title { display: grid; gap: 1px; flex: 0 0 auto; min-width: 0; margin-right: 4px; }
.bar-line { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.bar-title strong { font-size: var(--step-0); letter-spacing: -0.01em; }
.bar-repo { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px;
            color: var(--muted); text-decoration: none; font-family: var(--mono);
            max-width: 34ch; white-space: nowrap; }
.bar-repo:hover { color: var(--accent); text-decoration: underline; }
.bar-repo:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bar-meta { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums;
            white-space: nowrap; }

.stats { display: flex; flex-wrap: wrap; gap: 4px; flex: 0 0 auto; }
.stat { display: flex; gap: 5px; align-items: baseline; padding: 2px 8px;
        border: 1px solid var(--line); background: var(--sunk); }
.stat-n { font-weight: 640; font-variant-numeric: tabular-nums; font-size: 11.5px; }
.stat-l { font-size: 10.5px; color: var(--muted); }
.stat.is-clean .stat-n { color: var(--good); }
.stat.is-alert .stat-n { color: var(--high); }

h1 { font-size: var(--step-1); margin: 0; letter-spacing: -0.02em; font-weight: 640; }
h2 {
  font-size: var(--step--1); text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--muted); font-weight: 650; margin: 60px 0 6px;
}
.sub { color: var(--muted); font-size: var(--step--1); margin: 0; font-variant-numeric: tabular-nums; }
.lede { color: var(--ink-soft); margin: 0 0 18px; max-width: 64ch; }

.headline { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1px;
            margin: 28px 0 4px; background: var(--line); border: 1px solid var(--line); overflow: hidden; }
.tile { background: var(--panel); padding: 16px 18px; }
.tile .n { font-size: var(--step-2); font-weight: 600; letter-spacing: -0.03em;
           font-variant-numeric: tabular-nums; display: block; line-height: 1.1; }
.tile .l { font-size: var(--step--1); color: var(--muted); }
.tile.is-clean .n { color: var(--good); }
.tile.is-alert .n { color: var(--high); }

.warn { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--medium); padding: 12px 16px; margin: 16px 0; color: var(--ink-soft); }

.panel { background: var(--panel); border: 1px solid var(--line);
         padding: 16px; overflow: hidden; }
svg { display: block; width: 100%; height: auto; }
.box { stroke: var(--panel); stroke-width: 1; cursor: pointer; }
.box:hover { stroke: var(--accent); stroke-width: 2; }
.box-label { font-family: var(--mono); font-size: 9px; fill: var(--ink-soft);
             pointer-events: none; opacity: 0.8; }
.dir-label { font-size: 10px; fill: var(--muted); pointer-events: none; font-weight: 650; }

/* Severity reads as a stripe before it reads as a word. */
.finding { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--low); margin: 7px 0; overflow: hidden; }
.finding[data-severity="high"] { border-left-color: var(--high); }
.finding[data-severity="medium"] { border-left-color: var(--medium); }
.finding summary { padding: 12px 16px; cursor: pointer; display: flex; gap: 12px;
                   align-items: baseline; list-style: none; }
.finding summary::-webkit-details-marker { display: none; }
.finding summary:hover { background: var(--accent-soft); }
.finding summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.sev { font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 700;
       flex: 0 0 auto; padding: 2px 7px; background: var(--sunk); color: var(--low); }
.sev.high { color: var(--high); } .sev.medium { color: var(--medium); }
.f-title { flex: 1 1 auto; font-weight: 500; }
.f-meta { color: var(--muted); font-size: var(--step--1); font-variant-numeric: tabular-nums;
          font-family: var(--mono); flex: 0 0 auto; }
.f-body { padding: 0 16px 16px; border-top: 1px solid var(--line); }
.f-detail { color: var(--ink-soft); margin: 12px 0; max-width: 72ch; }

.snips { display: grid; gap: 10px; grid-template-columns: 1fr; }
.snips.side-by-side { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
pre { margin: 0; background: var(--sunk); border: 1px solid var(--line);
      padding: 10px 12px; overflow-x: auto; font-family: var(--mono); font-size: 11.5px;
      line-height: 1.55; }
pre .ln { color: var(--muted); opacity: 0.6; user-select: none; display: inline-block;
          width: 3ch; text-align: right; margin-right: 10px; }
.snip-head { font-family: var(--mono); font-size: 11px; color: var(--muted); margin: 0 0 4px; }

.variants { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: var(--step--1); }
.variants th { text-align: left; font-weight: 650; color: var(--muted); font-size: 10px;
               text-transform: uppercase; letter-spacing: 0.07em; padding: 0 10px 6px 0; }
.variants td { padding: 6px 10px 6px 0; border-top: 1px solid var(--line);
               font-family: var(--mono); font-size: 12px; }
.variants code { background: color-mix(in srgb, var(--high) 12%, transparent);
                 padding: 1px 6px; }

.bars { display: grid; gap: 5px; margin: 12px 0; }
.bar-row { display: grid; grid-template-columns: minmax(110px, 170px) 1fr 46px; gap: 10px;
           align-items: center; font-size: var(--step--1); }
.bar-track { height: 8px; background: var(--sunk); overflow: hidden; }
.bar-fill { height: 100%; background: var(--accent); }
.bar-row.minor .bar-fill { background: var(--medium); }
.bar-num { font-family: var(--mono); font-size: 11px; color: var(--muted); text-align: right;
           font-variant-numeric: tabular-nums; }

.filters { display: flex; gap: 6px; flex-wrap: wrap; margin: 16px 0 4px; }
.filters button { background: var(--panel); border: 1px solid var(--line); color: var(--ink-soft); padding: 5px 14px; font-size: var(--step--1); cursor: pointer;
                  font-family: inherit; }
.filters button:hover { border-color: var(--line-strong); }
.filters button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent);
                                       background: var(--accent-soft); }
.crumb { font-family: var(--mono); font-size: 12px; color: var(--muted); margin: 10px 0 0;
         min-height: 18px; }
.crumb button { background: none; border: none; color: var(--accent); cursor: pointer;
                font: inherit; padding: 0; text-decoration: underline; }
.legend { display: flex; gap: 16px; align-items: center; color: var(--muted);
          font-size: var(--step--1); margin-top: 10px; flex-wrap: wrap; }
.swatch { display: inline-block; width: 13px; height: 13px; vertical-align: -2px;
          margin-right: 7px; border: 1px solid var(--line-strong); }

/* The three panes ---------------------------------------------------------
 *
 * Tree, symbols, source. Severity is carried by the row itself rather than by
 * a bullet beside it, so a glance down the tree reads as a heat profile of the
 * codebase; the source pane shades the exact lines to act on, in place.
 */
.ide { border: 0; overflow: hidden; background: var(--panel); flex: 1 1 auto;
       display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.ide-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
           padding: 8px 12px; border-bottom: 1px solid var(--line);
           background: var(--sunk); flex: 0 0 auto; }
.nav-pair { display: flex; gap: 2px; flex: 0 0 auto; }
.nav-btn { border: 1px solid var(--line-strong); background: var(--panel); color: var(--ink-soft); width: 28px; height: 28px; cursor: pointer; font: inherit;
           font-size: 15px; line-height: 1; padding: 0; }
.nav-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent);
                                background: var(--accent-soft); }
.nav-btn:disabled { opacity: 0.35; cursor: default; }
.nav-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* The path taken, so digging three files deep stays retraceable. */
.trail { display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
         padding: 6px 12px; border-bottom: 1px solid var(--line);
         background: var(--panel); font-size: 11px; }
.trail-step { border: 0; background: none; font: inherit; font-family: var(--mono);
              font-size: 11px; color: var(--muted); cursor: pointer; padding: 2px 6px; max-width: 26ch; overflow: hidden;
              text-overflow: ellipsis; white-space: nowrap; }
.trail-step:hover { background: var(--accent-soft); color: var(--accent); }
.trail-step.is-here { color: var(--ink); background: var(--sunk); font-weight: 600; }
.trail-step:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
.trail-sep { color: var(--line-strong); }
.trail-more { color: var(--muted); padding: 0 2px; }

.search-wrap { position: relative; display: flex; align-items: center; flex: 1 1 220px;
               min-width: 0; }
.search-icon { position: absolute; left: 9px; color: var(--muted); pointer-events: none; }
.ex-search { width: 100%; min-width: 0; font: inherit; font-size: var(--step--1);
             padding: 7px 11px 7px 29px; border: 1px solid var(--line-strong);
             background: var(--panel); color: var(--ink); }
.ex-search:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.ex-count { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums;
            flex: 0 0 auto; }

.ide-panes { display: grid;
             grid-template-columns: var(--w-tree, 240px) 6px var(--w-symbols, 280px) 6px 1fr;
             flex: 1 1 auto; min-height: 0; }

/* Splitters. Thin, and wide enough to grab: the padded ::after widens the
   target without widening the line. */
.splitter, .splitter-h { background: var(--line); position: relative; flex: 0 0 auto; }
.splitter { cursor: col-resize; }
.splitter-h { cursor: row-resize; height: 6px; }
.splitter::after { content: ''; position: absolute; inset: 0 -3px; }
.splitter-h::after { content: ''; position: absolute; inset: -3px 0; }
.splitter:hover, .splitter:focus-visible,
.splitter-h:hover, .splitter-h:focus-visible { background: var(--accent); outline: none; }
body.is-resizing { cursor: col-resize; user-select: none; }
body.is-resizing-y { cursor: row-resize; user-select: none; }
body.is-resizing .splitter, body.is-resizing-y .splitter-h { background: var(--accent); }
.ide-tree, .ide-symbols { display: flex; flex-direction: column;
                          min-width: 0; min-height: 0; }
.ide-tree { overflow: auto; padding: 8px 0; }
.ide-code { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.pane-scroll { overflow: auto; flex: 1 1 auto; padding: 8px; }
.code-scroll { padding: 0; }
.pane-empty { color: var(--muted); padding: 22px 14px; font-size: var(--step--1); }
.pane-head { display: flex; gap: 8px; align-items: center; padding: 8px 10px;
             border-bottom: 1px solid var(--line); background: var(--sunk); flex: 0 0 auto; }
.pane-head .search-wrap { flex: 1 1 auto; }
.pane-filter { width: 100%; min-width: 0; font: inherit; font-size: var(--step--1);
               padding: 5px 9px 5px 27px; border: 1px solid var(--line-strong);
               background: var(--panel); color: var(--ink); }
.pane-head .search-icon { left: 8px; }
.pane-filter:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.chip { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; border: 1px solid var(--line-strong); background: var(--panel); color: var(--muted); padding: 4px 10px; font: inherit; font-size: 11px;
        cursor: pointer; flex: 0 0 auto; }
.chip.is-on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

/* Tree: the row carries the colour. */
.tree-dir { display: flex; align-items: center; gap: 5px; width: 100%; border: 0;
            border-left: 3px solid transparent; background: none; cursor: pointer;
            font: inherit; font-size: 11px; font-weight: 650; color: var(--muted);
            text-align: left; padding: 3px 8px 3px calc(8px + var(--depth) * 11px); }
.tree-dir:hover { background: var(--accent-soft); color: var(--accent); }
.tree-dir:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.tree-dir.sev-high { border-left-color: var(--high); color: var(--ink-soft); }
.tree-dir.sev-medium { border-left-color: var(--medium); color: var(--ink-soft); }
.tree-dir.sev-low { border-left-color: var(--low); }
.tree-chevron { display: inline-flex; flex: 0 0 11px; opacity: 0.75; font-size: 10px; }
.tree-file { display: flex; align-items: center; gap: 7px; width: 100%; border: 0;
             border-left: 3px solid transparent; background: none; font: inherit;
             font-size: var(--step--1); color: var(--ink-soft); text-align: left; cursor: pointer;
             padding: 3px 8px 3px calc(8px + var(--depth) * 11px); }
.tree-file:hover { background: var(--accent-soft); }
.tree-file.sev-high { border-left-color: var(--high); background: var(--tint-high); color: var(--ink); }
.tree-file.sev-medium { border-left-color: var(--medium); background: var(--tint-medium); color: var(--ink); }
.tree-file.sev-low { border-left-color: var(--low); background: var(--tint-low); }
.tree-file.is-open { outline: 2px solid var(--accent); outline-offset: -2px; font-weight: 600; }
.tree-file:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.tree-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 auto; }
.tree-count { font-family: var(--mono); font-size: 10px; color: var(--muted);
              font-variant-numeric: tabular-nums; }

/* Symbols. */
.sym { display: flex; gap: 9px; align-items: center; width: 100%; text-align: left;
       border: 1px solid transparent; border-left: 3px solid transparent;
       background: none; font: inherit; cursor: pointer; padding: 5px 8px; color: var(--ink); }
.sym:hover { background: var(--accent-soft); }
.sym.is-open { border-color: var(--accent); background: var(--accent-soft); }
.sym.has-high { border-left-color: var(--high); background: var(--tint-high); }
.sym.has-medium { border-left-color: var(--medium); background: var(--tint-medium); }
.sym.has-low { border-left-color: var(--low); background: var(--tint-low); }
.sym:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.sym-line { font-family: var(--mono); font-size: 10px; color: var(--muted);
            font-variant-numeric: tabular-nums; flex: 0 0 34px; text-align: right; }
.sym-main { flex: 1 1 auto; min-width: 0; display: grid; }
.sym-name { font-family: var(--mono); font-size: var(--step--1); overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap; }
.sym-sub { font-size: 10px; color: var(--muted); }
.sym-uses.is-dead { color: var(--high); font-weight: 600; }
.sym-uses.is-quiet { font-style: italic; }
.sym-flag { font-size: 10px; font-weight: 700; font-variant-numeric: tabular-nums; padding: 1px 6px; background: var(--sunk); flex: 0 0 auto; }
.sym-flag.high { color: var(--high); } .sym-flag.medium { color: var(--medium); }

/* Source, with the lines to act on shaded in place. */
.head-spacer { flex: 1 1 auto; }
.code-path { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono);
             font-size: var(--step--1); overflow: hidden; text-overflow: ellipsis;
             white-space: nowrap; color: var(--ink); text-decoration: none; flex: 0 1 auto; }
.code-path.is-link:hover { color: var(--accent); text-decoration: underline; }
.code-path.is-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.code-meta { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums;

{"path":"src/types.ts","count":2}],"marks":[],"source":["/**"," * Duplicate-detection calibration, against hand-labelled pairs."," *"," * Tuning a similarity model on intuition is how it ends up anti-predictive:"," * before this existed the highest-confidence band was *less* accurate than the"," * middle one, and the most actionable finding in a whole run sat at 0.42,"," * beneath seven false positives."," *"," * Every pair in labelled-pairs.json was judged by reading both bodies in full."," * The repositories are not vendored — clone them first; pairs whose repository"," * is absent are skipped and reported."," *"," *     npm run calibrate"," *"," * Read the bands, not only the rate. A change that raises the raw number while"," * flattening the bands has made the tool worse, because ranking is what a user"," * actually sees."," */","import { existsSync, readFileSync } from 'node:fs';","import { dirname, join } from 'node:path';","import { fileURLToPath } from 'node:url';","import { loadConfig } from '../src/config.js';","import { scan } from '../src/api.js';","","interface LabelledPair {","  repo: string;","  a: string;","  b: string;","  want: 'TRUE' | 'FALSE';","}","","const here = dirname(fileURLToPath(import.meta.url));","const all = JSON.parse(readFileSync(join(here, 'labelled-pairs.json'), 'utf8')) as LabelledPair[];","","const labelled = all.filter((pair) =\u003e existsSync(pair.repo));","const missing = [...new Set(all.filter((pair) =\u003e !existsSync(pair.repo)).map((p) =\u003e p.repo))];","if (missing.length \u003e 0) {","  console.log(`skipping repositories not cloned: ${missing.join(', ')}\\n`);","}","if (labelled.length === 0) {","  console.log('None of the labelled repositories are present. Clone them and try again.');","  process.exit(0);","}","","/** Highest score any cluster gave to each pair of names, per repository. */","const scored = new Map\u003cstring, Map\u003cstring, number\u003e\u003e();","for (const repo of [...new Set(labelled.map((p) =\u003e p.repo))]) {","  const result = await scan({ root: repo, config: loadConfig(repo) });","  const pairs = new Map\u003cstring, number\u003e();","  for (const finding of result.findings.filter((f) =\u003e f.kind === 'duplicate')) {","    const names = finding.symbols.map((s) =\u003e s.split('#')[1].split('.').pop()!);","    for (let i = 0; i \u003c names.length; i++) {","      for (let j = 0; j \u003c names.length; j++) {","        if (i === j) continue;","        const key = `${names[i]}|${names[j]}`;","        pairs.set(key, Math.max(pairs.get(key) ?? 0, finding.score));","      }","    }","  }","  scored.set(repo, pairs);","}","","const scoreOf = (pair: LabelledPair): number | undefined =\u003e {","  const pairs = scored.get(pair.repo)!;","  return pairs.get(`${pair.a}|${pair.b}`) ?? pairs.get(`${pair.b}|${pair.a}`);","};","","/** What a user sees: anything below the confidence floor is not acted on. */","const FLOOR = 0.5;","","let truePositives = 0;","let falseNegatives = 0;","let falsePositives = 0;","let trueNegatives = 0;","","for (const pair of labelled) {","  const score = scoreOf(pair);","  const shown = score !== undefined \u0026\u0026 score \u003e= FLOOR;","  const correct = pair.want === 'TRUE' ? shown : !shown;","  if (pair.want === 'TRUE') correct ? truePositives++ : falseNegatives++;","  else correct ? trueNegatives++ : falsePositives++;","","  console.log(","    `${correct ? ' ok ' : 'MISS'} ${pair.want.padEnd(5)} ` +","      `${(score === undefined ? 'absent' : score.toFixed(2)).padStart(6)}  ${pair.a} ~ ${pair.b}`,","  );","}","","const precision = truePositives / (truePositives + falsePositives || 1);","const recall = truePositives / (truePositives + falseNegatives || 1);","console.log(","  `\\nTP ${truePositives}  FN ${falseNegatives}  FP ${falsePositives}  TN ${trueNegatives}` +","    `   → precision ${precision.toFixed(2)}  recall ${recall.toFixed(2)}`,",");","","console.log('\\ncalibration — each band should be more accurate than the one below it:');","for (const [label, low, high] of [","  ['\u003e=0.70', 0.7, 1.01],","  ['0.50-0.69', 0.5, 0.7],","  ['\u003c0.50', 0, 0.5],","] as const) {","  const band = labelled.filter((pair) =\u003e {","    const score = scoreOf(pair);","    return score !== undefined \u0026\u0026 score \u003e= low \u0026\u0026 score \u003c high;","  });","  const good = band.filter((pair) =\u003e pair.want === 'TRUE').length;","  console.log(","    `  ${label.padEnd(10)} n=${String(band.length).padStart(2)}  true=${good}  ` +","      `false=${band.length - good}  precision=${band.length ? (good / band.length).toFixed(2) : '—'}`,","  );","}",""]},{"path":"src/analysis/budget.ts","loc":78,"findings":[],"symbols":[{"id":"src/analysis/budget.ts#budgetPath","name":"budgetPath","kind":"function","line":13,"loc":3,"exported":true,"usedBy":[{"file":"src/analysis/budget.ts","line":18,"name":"readBudget"},{"file":"src/analysis/budget.ts","line":38,"name":"writeBudget"}],"usedByCount":2,"reaches":[],"reachesCount":0,"findings":[]},{"id":"src/analysis/budget.ts#readBudget","name":"readBudget","kind":"function","line":17,"loc":9,"exported":true,"usedBy":[{"file":"src/cli.ts","line":219,"name":"main"}],"usedByCount":1,"reaches":[{"file":"src/types.ts","line":158,"name":"Budget"},{"file":"src/analysis/budget.ts","line":13,"name":"budgetPath"}],"reachesCount":2,"findings":[]},{"id":"src/analysis/budget.ts#writeBudget","name":"writeBudget","kind":"function","line":27,"loc":14,"exported":true,"usedBy":[{"file":"src/cli.ts","line":212,"name":"main"}],"usedByCount":1,"reaches":[{"file":"src/types.ts","line":181,"name":"Stats"},{"file":"src/types.ts","line":158,"name":"Budget"},{"file":"src/analysis/budget.ts","line":13,"name":"budgetPath"}],"reachesCount":3,"findings":[]},{"id":"src/analysis/budget.ts#BudgetCheck","name":"BudgetCheck","kind":"interface","line":42,"loc":4,"exported":true,"usedBy":[{"file":"src/analysis/budget.ts","line":47,"name":"checkBudget"},{"file":"src/cli.ts","line":226,"name":"main"}],"usedByCount":2,"reaches":[],"reachesCount":0,"findings":[]},{"id":"src/analysis/budget.ts#checkBudget","name":"checkBudget","kind":"function","line":47,"loc":31,"exported":true,"usedBy":[{"file":"src/cli.ts","line":224,"name":"main"}],"usedByCount":1,"reaches":[{"file":"src/types.ts","line":158,"name":"Budget"},{"file":"src/types.ts","line":181,"name":"Stats"},{"file":"src/analysis/budget.ts","line":42,"name":"BudgetCheck"}],"reachesCount":3,"findings":[]}],"usedBy":[{"path":"src/cli.ts","count":8},{"path":"test/analysis.test.ts","count":3},{"path":"test/ignores.test.ts","count":3}],"uses":[{"path":"src/types.ts","count":8}],"marks":[],"source":["import { existsSync, mkdirSync, readFileSync, writeFileSync } from 'node:fs';","import { join } from 'node:path';","import type { Budget, Stats } from '../types.js';","","/**"," * The ratchet. CI fails on an *increase*, never on an absolute number."," *"," * A repo with 4,100 dead lines today is not a repo anyone will clean up before"," * adopting a tool. Baselining the mess and refusing to let it grow is the only"," * version of this that lands in a real codebase."," */","","export function budgetPath(root: string): string {","  return join(root, '.instantiate', 'budget.json');","}","","export function readBudget(root: string): Budget | undefined {","  const path = budgetPath(root);","  if (!existsSync(path)) return undefined;","  try {","    return JSON.parse(readFileSync(path, 'utf8')) as Budget;","  } catch {","    return undefined;","  }","}","","export function writeBudget(root: string, stats: Stats): Budget {","  const budget: Budget = {","    dead: stats.deadLoc,","    duplicate: stats.duplicateLoc,","    drift: stats.driftCount,","    contradiction: stats.contradictionCount,","    unfinished: stats.unfinishedCount,","    ignored: stats.ignoredCount,","    createdAt: Date.now(),","  };","  mkdirSync(join(root, '.instantiate'), { recursive: true });","  writeFileSync(budgetPath(root), `${JSON.stringify(budget, null, 2)}\\n`);","  return budget;","}","","export interface BudgetCheck {","  ok: boolean;","  lines: string[];","}","","export function checkBudget(budget: Budget, stats: Stats): BudgetCheck {","  const rows: Array\u003c[string, number, number]\u003e = [","    ['dead lines', stats.deadLoc, budget.dead],","    ['duplicated lines', stats.duplicateLoc, budget.duplicate],","    ['drifting conventions', stats.driftCount, budget.drift],","    // An older budget file predates this metric; treat it as \"none allowed\"","    // only once it has been recorded, never as an accidental instant failure.","    ['contradictions', stats.contradictionCount, budget.contradiction ?? stats.contradictionCount],","    ['unfinished', stats.unfinishedCount, budget.unfinished ?? stats.unfinishedCount],","    // Each new exception is a decision someone has to lock in on purpose.","    ['ignored in code', stats.ignoredCount, budget.ignored ?? stats.ignoredCount],","  ];","","  const lines: string[] = [];","  let ok = true;","","  for (const [label, actual, allowed] of rows) {","    const delta = actual - allowed;","    if (delta \u003e 0) {","      ok = false;","      lines.push(`  ✗ ${label}: ${actual} (budget ${allowed}, +${delta})`);","    } else if (delta \u003c 0) {","      // Improvement is worth saying out loud, and worth tightening the budget to.","      lines.push(`  ✓ ${label}: ${actual} (budget ${allowed}, ${delta} — run \\`instantiate budget\\` to lock this in)`);","    } else {","      lines.push(`  ✓ ${label}: ${actual} (at budget)`);","    }","  }","","  return { ok, lines };","}",""]},{"path":"src/analysis/concepts.ts","loc":224,"findings":[],"symbols":[{"id":"src/analysis/concepts.ts#findConcepts","name":"findConcepts","kind":"function","line":11,"loc":104,"exported":true,"usedBy":[{"file":"src/api.ts","line":57,"name":"scan"}],"usedByCount":1,"reaches":[{"file":"src/types.ts","line":69,"name":"CodeGraph"},{"file":"src/types.ts","line":137,"name":"Concept"},{"file":"s oncepts.ts#describe","name":"describe","kind":"function","line":195,"loc":5,"exported":false,"usedBy":[{"file":"src/analysis/concepts.ts","line":132,"name":"build"}],"usedByCount":1,"reaches":[{"file":"src/types.ts","line":13,"name":"CodeSymbol"}],"reachesCount":1,"findings":[]},{"id":"src/analysis/concepts.ts#assignCoupling","name":"assignCoupling","kind":"function","line":201,"loc":23,"exported":false,"usedBy":[{"file":"src/analysis/concepts.ts","line":106,"name":"findConcepts"}],"usedByCount":1,"reaches":[{"file":"src/types.ts","line":137,"name":"Concept"},{"file":"src/types.ts","line":69,"name":"CodeGraph"},{"file":"src/types.ts","line":53,"name":"Edge"}],"reachesCount":3,"findings":[]}],"usedBy":[{"path":"src/api.ts","count":3},{"path":"test/dupe-shapes.test.ts","count":1}],"uses":[{"path":"src/types.ts","count":16},{"path":"src/analysis/similarity.ts","count":4}],"marks":[],"source":["import type { CodeGraph, Concept, CodeSymbol } from '../types.js';","import { splitIdentifier } from './similarity.js';","","/**"," * Collapse the graph into a small number of named concepts."," *"," * A node-link picture of 50,000 symbols is a hairball nobody reads. Thirty"," * labelled bubbles is the only whole-codebase view that survives scale, so the"," * job here is to get from one to the other honestly."," */","export function findConcepts(graph: CodeGraph, target: number): Concept[] {","  const ids = [...graph.symbols.keys()];","  if (ids.length === 0) return [];","","  const index = new Map(ids.map((id, i) =\u003e [id, i]));","  const neighbours: number[][] = ids.map(() =\u003e []);","","  for (const edge of graph.edges) {","    const from = index.get(edge.from);","    const to = index.get(edge.to);","    if (from === undefined || to === undefined || from === to) continue;","    neighbours[from].push(to);","    neighbours[to].push(from);","  }","","  // Seed each symbol with its directory. Folder structure is a real signal about","  // intent, and it stops label propagation from drifting into nonsense on the","  // sparse parts of the graph.","  const directories = new Map\u003cstring, number\u003e();","  const labels = ids.map((id) =\u003e {","    const dir = dirOf(graph.symbols.get(id)!.file);","    let label = directories.get(dir);","    if (label === undefined) {","      label = directories.size;","      directories.set(dir, label);","    }","    return label;","  });","","  // Label propagation: adopt whichever label most of your neighbours carry.","  // Deterministic order, so two runs on the same code give the same map.","  for (let pass = 0; pass \u003c 12; pass++) {","    let changed = 0;","    for (let i = 0; i \u003c ids.length; i++) {","      const tally = new Map\u003cnumber, number\u003e();","      for (const n of neighbours[i]) tally.set(labels[n], (tally.get(labels[n]) ?? 0) + 1);","      // Keep a light pull towards the seed so isolated nodes stay with their folder.","      tally.set(labels[i], (tally.get(labels[i]) ?? 0) + 0.5);","      let best = labels[i];","      let bestCount = -1;","      for (const [label, count] of [...tally].sort((a, b) =\u003e a[0] - b[0])) {","        if (count \u003e bestCount) {","          best = label;","          bestCount = count;","        }","      }","      if (best !== labels[i]) {","        labels[i] = best;","        changed++;","      }","    }","    if (changed === 0) break;","  }","","  const groups = new Map\u003cnumber, string[]\u003e();","  for (let i = 0; i \u003c ids.length; i++) {","    const list = groups.get(labels[i]);","    if (list) list.push(ids[i]);","    else groups.set(labels[i], [ids[i]]);","  }","","  // Document frequency across clusters, so naming can favour the word that makes","  // a cluster *different* rather than the most common verb in the codebase.","  const rawGroups = [...groups.values()];","  const documentFrequency = new Map\u003cstring, number\u003e();","  for (const symbolIds of rawGroups) {","    const seen = new Set\u003cstring\u003e();","    for (const id of symbolIds) {","      for (const word of splitIdentifier(graph.symbols.get(id)?.name ?? '')) seen.add(word);","    }","    for (const word of seen) documentFrequency.set(word, (documentFrequency.get(word) ?? 0) + 1);","  }","","  let concepts = rawGroups.map((symbolIds, i) =\u003e","    build(i, symbolIds, graph, documentFrequency, rawGroups.length),","  );","  concepts.sort((a, b) =\u003e b.loc - a.loc);","","  // Too many clusters is as unreadable as too few. Fold the tail into one bucket","  // rather than pretending a map with 200 bubbles helps anybody.","  if (concepts.length \u003e target) {","    const kept = concepts.slice(0, target - 1);","    const tail = concepts.slice(target - 1);","    kept.push({","      id: target - 1,","      name: 'Everything else',","      description: `${tail.length} small groups too scattered to name, totalling ${tail.reduce((s, c) =\u003e s + c.loc, 0)} lines.`,","      symbols: tail.flatMap((c) =\u003e c.symbols),","      loc: tail.reduce((s, c) =\u003e s + c.loc, 0),","      couples: [],","    });","    concepts = kept;","  }","","  concepts.forEach((c, i) =\u003e (c.id = i));","  assignCoupling(concepts, graph);","  for (const concept of concepts) {","    for (const id of concept.symbols) {","      const symbol = graph.symbols.get(id);","      if (symbol) symbol.conceptId = concept.id;","    }","  }","  return concepts;","}","","function dirOf(file: string): string {","  const i = file.lastIndexOf('/');","  return i === -1 ? '.' : file.slice(0, i);","}","","function build(","  id: number,","  symbolIds: string[],","  graph: CodeGraph,","  documentFrequency: Map\u003cstring, number\u003e,","  clusterCount: number,","): Concept {","  const symbols = symbolIds.map((s) =\u003e graph.symbols.get(s)!).filter(Boolean);","  return {","    id,","    name: nameOf(symbols, documentFrequency, clusterCount),","    description: describe(symbols),","    symbols: symbolIds,","    loc: symbols.reduce((sum, s) =\u003e sum + s.loc, 0),","    couples: [],","  };","}","","/**"," * Name a cluster after what makes it distinctive."," *"," * Ranking words by raw frequency yields word salad, because the commonest words"," * in any codebase (\"get\", \"build\", \"result\") are common in every cluster. TF-IDF"," * picks the word that separates this group from the others, which is what a"," * human would have named it."," */","function nameOf(","  symbols: CodeSymbol[],","  documentFrequency: Map\u003cstring, number\u003e,","  clusterCount: number,","): string {","  // A cluster that lives in one folder already has a name its authors chose.","  const directories = new Map\u003cstring, number\u003e();","  for (const symbol of symbols) {","    const dir = dirOf(symbol.file);","    directories.set(dir, (directories.get(dir) ?? 0) + 1);","  }","  const [topDir, topDirCount] = [...directories].sort((a, b) =\u003e b[1] - a[1])[0] ?? ['', 0];","  const folderCoherent = topDirCount / symbols.length \u003e= 0.75 \u0026\u0026 topDir !== '.' \u0026\u0026 topDir !== '';","","  const tally = new Map\u003cstring, number\u003e();","  for (const symbol of symbols) {","    // Weight by size: a 200-line function says more about the cluster than a getter.","    const weight = Math.log2(symbol.loc + 2);","    for (const word of splitIdentifier(symbol.name)) {","      tally.set(word, (tally.get(word) ?? 0) + weight);","    }","  }","","  const scored = [...tally.entries()]","    .map(([word, weight]) =\u003e {","      const df = documentFrequency.get(word) ?? 1;","      return [word, weight * Math.log(clusterCount / df + 1)] as const;","    })","    .sort((a, b) =\u003e b[1] - a[1] || a[0].localeCompare(b[0]));","","  const top = scored.slice(0, 2).map(([word]) =\u003e word);","","  if (folderCoherent) {","    const folder = topDir.split('/').filter(Boolean).pop() ?? '';","    const distinctive = top.find((w) =\u003e w !== folder);","    return distinctive ? `${title(folder)} · ${title(distinctive)}` : title(folder); |fixtures?|scripts?|vendor)\\//i;","","function isSource(file: string): boolean {","  return !NON_SOURCE.test(file) \u0026\u0026 !/\\.(test|spec)\\.[cm]?[jt]sx?$/.test(file) \u0026\u0026 !/_test\\.py$|^test_/.test(file);","}","","/** Map a match offset to a line number and the symbol that contains it. */","function locate(","  graph: CodeGraph,","  file: string,","  text: string,","  offset: number,","): { file: string; line: number; symbol?: CodeSymbol } {","  let line = 1;","  for (let i = 0; i \u003c offset \u0026\u0026 i \u003c text.length; i++) {","    if (text.charCodeAt(i) === 10) line++;","  }","  let symbol: CodeSymbol | undefined;","  for (const candidate of graph.symbols.values()) {","    if (candidate.file !== file || candidate.kind === 'module') continue;","    if (candidate.line \u003c= line \u0026\u0026 line \u003c= candidate.endLine) {","      // Prefer the innermost symbol containing the line.","      if (!symbol || candidate.line \u003e symbol.line) symbol = candidate;","    }","  }","  return { file, line, symbol };","}","","/** Iterate every source file worth checking, with its text. */","function* sourceFiles(graph: CodeGraph): Generator\u003c[string, string]\u003e {","  for (const [file, text] of graph.sources) {","    if (isSource(file)) yield [file, text];","  }","}","","/**"," * Concepts whose value should be the same everywhere it is stated."," *"," * Matched against split identifier words, so entries here are single words:"," * a list containing `maxage` could never match `maxAge`, which splits into"," * `max` and `age`."," */","const NUMERIC_CONCEPTS = [","  'timeout', 'retry', 'backoff', 'delay', 'interval', 'ttl',","  'expiry', 'expire', 'limit', 'port', 'threshold', 'concurrency',","];","","export function findContradictions(graph: CodeGraph): ContradictionResult {","  const findings: Finding[] = [","    ...divergentDefaults(graph),","    ...divergentConstants(graph),","    ...divergentTimeSemantics(graph),","  ];","","  findings.sort((a, b) =\u003e b.score - a.score);","  return { findings, count: findings.length };","}","","/**"," * One rule: find sites, group them, and report a group that states more than"," * one value."," *"," * Both the environment-variable rule and the declared-constant rule are this"," * shape, differing only in what they match and how strongly they believe it."," * They were written separately and drifted apart; the duplicate detector caught"," * them, which seems like the right test of it."," */","interface DivergenceRule {","  id: string;","  pattern: RegExp;","  /** Pull the grouping key and the value out of a match, or skip it. */","  extract: (match: RegExpExecArray) =\u003e { key: string; value: string } | undefined;","  /** Reject a group before it becomes a finding. */","  accept?: (sites: Site[]) =\u003e boolean;","  severity: Severity;","  score: number;","  title: (key: string, values: string[], sites: Site[]) =\u003e string;","  detail: (key: string, values: string[], sites: Site[]) =\u003e string;","  action: (key: string, values: string[], sites: Site[]) =\u003e string;","  evidence?: (key: string, sites: Site[]) =\u003e Record\u003cstring, unknown\u003e;","}","","function applyRule(graph: CodeGraph, rule: DivergenceRule): Finding[] {","  const groups = new Map\u003cstring, Site[]\u003e();","","  for (const [file, text] of sourceFiles(graph)) {","    rule.pattern.lastIndex = 0;","    let match: RegExpExecArray | null;","    while ((match = rule.pattern.exec(text)) !== null) {","      const extracted = rule.extract(match);","      if (!extracted) continue;","      const site: Site = {","        ...locate(graph, file, text, match.index),","        value: extracted.value,","        raw: match[0].trim(),","      };","      const list = groups.get(extracted.key);","      if (list) list.push(site);","      else groups.set(extracted.key, [site]);","    }","  }","","  const findings: Finding[] = [];","  for (const [key, sites] of groups) {","    const values = [...new Set(sites.map((s) =\u003e s.value))];","    if (values.length \u003c 2) continue;","    if (rule.accept \u0026\u0026 !rule.accept(sites)) continue;","","    findings.push({","      id: `contradiction:${rule.id}:${key}`,","      kind: 'contradiction',","      severity: rule.severity,","      title: rule.title(key, values, sites),","      detail: rule.detail(key, values, sites),","      action: rule.action(key, values, sites),","      file: sites[0].file,","      line: sites[0].line,","      symbols: sites.map((s) =\u003e s.symbol?.id ?? `${s.file}#\u003cmodule\u003e`),","      loc: sites.length,","      score: rule.score,","      evidence: {","        key,","        ...(rule.evidence?.(key, sites) ?? {}),","        variants: sites.map((s) =\u003e ({","          value: s.value,","          raw: s.raw,","          file: s.file,","          line: s.line,","          symbol: s.symbol?.name ?? '(module scope)',","        })),","      },","    });","  }","  return findings;","}","","/**"," * The same environment variable or config key, with two different fallbacks."," * Whichever call site runs first wins, which is never what anybody intended."," */","function divergentDefaults(graph: CodeGraph): Finding[] {","  return applyRule(graph, {","    id: 'default',","    // `process.env.FOO ?? 'x'`, `env.FOO || 3000`, `env['FOO'] ?? 'x'`","    pattern:","      /(?:process\\.env|env)\\s*(?:\\.\\s*([A-Z][A-Z0-9_]*)|\\[\\s*['\"]([A-Za-z0-9_]+)['\"]\\s*\\])\\s*(?:\\?\\?|\\|\\|)\\s*([^;,)\\]}]+)/g,","    extract: (match) =\u003e {","      const key = match[1] ?? match[2];","      const value = normaliseValue(match[3]);","      return key \u0026\u0026 value ? { key, value } : undefined;","    },","    // Two literal defaults for one key is about as unambiguous as static","    // analysis gets, so this is reported with real confidence.","    severity: 'high',","    score: 0.9,","    title: (key, values) =\u003e `${key} falls back to ${values.length} different values`,","    detail: (_key, values) =\u003e","      `${values.join(' and ')}. Whichever site runs first decides the behaviour, ` +","      'so the value this actually takes depends on import order rather than on a decision.',","    action: (key) =\u003e","      `Decide what ${key} should default to, put that in one place, and have both sites read it.`,","  });","}","","/**"," * One declared setting, several values. `DEFAULT_CONCURRENCY = 1024` in one"," * file and `= 2` in another is a decision nobody made twice on purpose."," */","function divergentConstants(graph: CodeGraph): Finding[] {","  return applyRule(graph, {","    id: 'constant',","    // A declaration keyword, or a SCREAMING_SNAKE name, which is a declared","    // setting by convention. Never a property inside an options object:","    // `maxAge: 1000` in one feature and `3600` in another are two settings,","    // not a disagreement, and matching those made this mostly false positives.","    pattern:","      /(?:\\b(?:const|let|var|final|static)\\s+([A-Za-z_$][\\w$]*)|^\\s*([A-Z][A-Z0-9_]{2,}))\\s*(?::\\s*\\w+\\s*)?=\\s*(\\d+)\\s*(?:;|$)/gm,","    extract: (match) =\u003e {","      const name = match[1] ?? match[2];","      if (!name) return undefined;","      const words = splitIdentifier(name);","      const namesConcept = words.some((w) =\u003e NUMERIC_CONCEPTS.includes(w));","      const isDeclaredConstant = /^[A-Z][A-Z0-9_]{2,}$/.test(name);","      if (!namesConcept \u0026\u0026 !isDeclaredConstant) return undefined;","      // Key on the whole name: `retryDelay` and `retryLimit` are different","      // facts that happen to share a word.","      return { key: words.join('-'), value: match[3] };","    },","    // One file stating two values is usually a table of cases, not a conflict.","    accept: (sites) =\u003e new Set(sites.map((s) =\u003e s.file)).size \u003e= 2,","    severity: 'medium',","    score: 0.6,","    title: (key, values) =\u003e","      `\"${key.split('-').join(' ')}\" is ${values.slice().sort((a, b) =\u003e Number(a) - Number(b)).join(', ')} in different places`,","    detail: (_key, _values, sites) =\u003e","      `${sites.length} sites across ${new Set(sites.map((s) =\u003e s.file)).size} files state a different ` +","      'number for the same thing. One of them is stale, or this value belongs in one place rather than several.',","    action: (key) =\u003e","      `Work out which value is right for ${key.split('-').join(' ')}, declare it once, and import it everywhere else.`,","  });","}","","/**"," * UTC in one place, local time in another. The classic silent contradiction:"," * both are correct in isolation, and together they are off by the offset."," */","function divergentTimeSemantics(graph: CodeGraph): Finding[] {","  const utc: Site[] = [];","  const local: Site[] = [];","","  const utcPattern = /\\b(?:getUTC(?:FullYear|Month|Date|Hours|Minutes|Seconds)|toISOString|Date\\.UTC|utc\\(\\))/;","  const localPattern = /\\b(?:get(?:FullYear|Month|Date|Hours|Minutes|Seconds)\\s*\\(|toLocale(?:Date|Time)?String)/;","","  for (const symbol of graph.symbols.values()) {","    if (symbol.kind === 'module' || !isSource(symbol.file)) continue;","    const hasUtc = utcPattern.test(symbol.body);","    const hasLocal = localPattern.test(symbol.body);","    // A symbol doing both is usually a deliberate conversion, not a conflict.","    const site = { file: symbol.file, line: symbol.line, symbol };","    if (hasUtc \u0026\u0026 !hasLocal) utc.push({ ...site, value: 'UTC', raw: 'UTC' });","    else if (hasLocal \u0026\u0026 !hasUtc) local.push({ ...site, value: 'local', raw: 'local time' });","  }","","  if (utc.length === 0 || local.length === 0) return [];","  // One-off local formatting for display is normal; a split down the middle is not.","  const minority = Math.min(utc.length, local.length);","  const total = utc.length + local.length;","  if (minority \u003c 2 || minority / total \u003c 0.15) return [];","","  const all = [...utc, ...local];","  return ["," const executed = new Map\u003cstring, Set\u003cnumber\u003e\u003e();","  for (const coverage of all) {","    for (const [file, lines] of coverage.executed) {","      const merged = executed.get(file) ?? new Set\u003cnumber\u003e();","      for (const line of lines) merged.add(line);","      executed.set(file, merged);","    }","  }","  return { executed, format: [...new Set(all.map((c) =\u003e c.format))].join(' + '), files: executed.size };","}","","export function readCoverage(root: string, path: string): Coverage {","  if (existsSync(path) \u0026\u0026 statSync(path).isDirectory()) {","    const reports = readdirSync(path).filter((name) =\u003e name.endsWith('.json'));","    if (reports.length === 0) throw new UserError(`${path} is a directory with no coverage files in it.`);","    return fromV8(root, reports.map((name) =\u003e JSON.parse(readFileSync(join(path, name), 'utf8'))));","  }","","  let raw: unknown;","  try {","    raw = JSON.parse(readFileSync(path, 'utf8'));","  } catch (error) {","    throw new UserError(","      `Could not read the coverage file at ${path}: ${error instanceof Error ? error.message : error}`,","    );","  }","","  if (!raw || typeof raw !== 'object') {","    throw new UserError(`${path} is not a coverage report this understands.`);","  }","","  const record = raw as Record\u003cstring, unknown\u003e;","  if (Array.isArray(record.result)) return fromV8(root, [record]);","  const pythonFiles = record.files;","  if (pythonFiles \u0026\u0026 typeof pythonFiles === 'object') {","    return fromCoveragePy(root, pythonFiles as Record\u003cstring, unknown\u003e);","  }","  return fromIstanbul(root, record);","}","","/** coverage.py: `{ \"files\": { \"src/x.py\": { \"executed_lines\": [1, 2, 4] } } }` */","function fromCoveragePy(root: string, files: Record\u003cstring, unknown\u003e): Coverage {","  const executed = new Map\u003cstring, Set\u003cnumber\u003e\u003e();","  for (const [file, value] of Object.entries(files)) {","    const lines = (value as { executed_lines?: number[] })?.executed_lines;","    if (!Array.isArray(lines)) continue;","    executed.set(normalise(root, file), new Set(lines));","  }","  return { executed, format: 'coverage.py', files: executed.size };","}","","/**"," * Istanbul: statement ranges plus an execution count for each. A statement"," * counted above zero means every line it spans ran."," */","function fromIstanbul(root: string, report: Record\u003cstring, unknown\u003e): Coverage {","  const executed = new Map\u003cstring, Set\u003cnumber\u003e\u003e();","","  for (const [file, value] of Object.entries(report)) {","    const entry = value as {","      statementMap?: Record\u003cstring, { start?: { line?: number }; end?: { line?: number } }\u003e;","      s?: Record\u003cstring, number\u003e;","      path?: string;","    };","    if (!entry?.statementMap || !entry.s) continue;","","    const lines = new Set\u003cnumber\u003e();","    for (const [id, range] of Object.entries(entry.statementMap)) {","      if (!entry.s[id]) continue;","      const from = range.start?.line;","      const to = range.end?.line ?? from;","      if (typeof from !== 'number') continue;","      for (let line = from; line \u003c= (to ?? from); line++) lines.add(line);","    }","    executed.set(normalise(root, entry.path ?? file), lines);","  }","","  if (executed.size === 0) {","    throw new UserError(","      'That file parsed but held no coverage this understands. ' +","        'Expected an Istanbul `coverage-final.json` or the output of `coverage json`.',","    );","  }","  return { executed, format: 'istanbul', files: executed.size };","}","","interface V8Range {","  startOffset: number;","  endOffset: number;","  count: number;","}","","/**"," * V8's own format: byte ranges per function, each with an execution count,"," * where an inner range overrides the one around it."," *"," * Offsets refer to the code V8 ran. For plain JavaScript that is the file on"," * disk; for TypeScript it is a transpiled copy whose offsets mean nothing"," * here, so those are left out — `c8 report --reporter=json` maps them through"," * source maps into an Istanbul report, which this already reads."," */","function fromV8(root: string, reports: unknown[]): Coverage {","  const executed = new Map\u003cstring, Set\u003cnumber\u003e\u003e();","  for (const report of reports) {","    const result = (report as { result?: Array\u003c{ url?: string; functions?: Array\u003c{ ranges?: V8Range[] }\u003e }\u003e }).result;","    for (const script of result ?? []) {","      if (!script.url?.startsWith('file://')) continue;","      const absolute = fileURLToPath(script.url);","      if (!/\\.[cm]?jsx?$/.test(absolute) || absolute.includes('/node_modules/')) continue;","      const file = normalise(root, absolute);","      if (file.startsWith('..')) continue;","","      let text: string;","      try {","        text = readFileSync(absolute, 'utf8');","      } catch {","        continue;","      }","      // Line start offsets, so a byte range becomes the lines it covers.","      const starts = [0];","      for (let i = 0; i \u003c text.length; i++) if (text[i] === '\\n') starts.push(i + 1);","      const ranges = (script.functions ?? []).flatMap((fn) =\u003e fn.ranges ?? []);","      // Widest first, so a nested range paints over its parent.","      ranges.sort((a, b) =\u003e b.endOffset - b.startOffset - (a.endOffset - a.startOffset));","","      const ran = new Map\u003cnumber, boolean\u003e();","      for (const range of ranges) {","        for (let line = lineAt(starts, range.startOffset); line \u003c starts.length; line++) {","          const start = starts[line];","          if (start \u003e= range.endOffset) break;","          const end = (starts[line + 1] ?? text.length + 1) - 1;","          if (end \u003c range.startOffset || start \u003e= range.endOffset) continue;","          // A line only partly inside a never-run range may still have run the","          // rest, so only a every file look like it lives outside the project.","  return relative(real(root), real(absolute)).split('\\\\').join('/');","}","","function real(path: string): string {","  try {","    return realpathSync(path);","  } catch {","    return path;","  }","}",""]},{"path":"src/analysis/dead.ts","loc":363,"findings":[],"symbols":[{"id":"src/analysis/dead.ts#METRIC_CONFIDENCE_FLOOR","name":"METRIC_CONFIDENCE_FLOOR","kind":"variable","line":11,"loc":1,"exported":false,"usedBy":[{"file":"src/analysis/dead.ts","line":217,"name":"findDeadCode"}],"usedByCount":1,"reaches":[],"reachesCount":0,"findings":[]},{"id":"src/analysis/dead.ts#DeadResult","name":"DeadResult","kind":"interface","line":13,"loc":9,"exported":true,"usedBy":[{"file":"src/analysis/dead.ts","line":30,"name":"findDeadCode"},{"file":"src/api.ts","line":66,"name":"scan"}],"usedByCount":2,"reaches":[{"file":"src/types.ts","line":111,"name":"Finding"}],"reachesCount":1,"findings":[]},{"id":"src/analysis/dead.ts#findDeadCode","name":"findDeadCode","kind":"function","line":30,"loc":226,"exported":true,"usedBy":[{"file":"src/api.ts","line":52,"name":"scan"}],"usedByCount":1,"reaches":[{"file":"src/types.ts","line":69,"name":"CodeGraph"},{"file":"src/config.ts","line":6,"name":"Config"},{"file":"src/analysis/coverage.ts","line":30,"name":"Coverage"},{"file":"src/analysis/dead.ts","line":13,"name":"DeadResult"},{"file":"src/util/glob.ts","line":66,"name":"matchesAny"},{"file":"src/types.ts","line":53,"name":"Edge"},{"file":"src/types.ts","line":13,"name":"CodeSymbol"},{"file":"src/plugins.ts","line":200,"name":"rootingPlugin"},{"file":"src/plugins.ts","line":19,"name":"Plugin"},{"file":"src/analysis/dead.ts","line":293,"name":"collectDynamicNames"},{"file":"src/analysis/dead.ts","line":318,"name":"collectDataNames"},{"file":"src/types.ts","line":111,"name":"Finding"},{"file":"src/analysis/dead.ts","line":264,"name":"findOrphanFiles"},{"file":"src/types.ts","line":61,"name":"FileRecord"},{"file":"src/analysis/dead.ts",
